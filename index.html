    <div class="wizfooter"><div class="btnrow">
      <button class="btn gray" onclick="goTab('agenda')">Voltar</button>
      <button class="btn green" onclick="salvarVisita()">${V._novo?'Salvar visita':'Regravar visita'}</button>
    </div></div>`;
}
function salvarVisita(){
  if(!V.imovelId){ toast('Escolha o imóvel da visita.'); return; }
  if(!V.compradorNome.trim()){ toast('Informe o nome do comprador.'); return; }
  V.updatedAt = Date.now();
  const novo = V._novo;
  const dados = JSON.parse(JSON.stringify(V));
  delete dados._novo;

  // grava/atualiza o compromisso
  const idx = DB.agendamentos.findIndex(a=>a.id===V.id);
  if(idx>=0) DB.agendamentos[idx] = dados; else DB.agendamentos.push(dados);

  // re-sincroniza as despesas ligadas a este compromisso (remove as antigas e relança)
  DB.financeiro.despesas = DB.financeiro.despesas.filter(d=>d.agendamentoId!==V.id);
  const im = DB.imoveis.find(x=>x.id===V.imovelId);
  const reg = (im?.codigo||'').toUpperCase();  // ex.: CS00001
  const cats = { transporte:'Transporte', refeicao:'Refeição', gasolina:'Gasolina', outros:'Outros' };
  Object.keys(cats).forEach(k=>{
    const valor = parseMoeda(V.despesas[k]||'');
    if(valor>0){
      DB.financeiro.despesas.push({
        id: uid(), categoria: cats[k], valor, data: V.data,
        origem:'agenda', agendamentoId: V.id, imovelId: V.imovelId, imovelCodigo: reg,
        descricao: `Visita ${reg} — ${V.compradorNome}`.trim(), createdAt: Date.now()
      });
    }
  });
  save();
  toast(novo?'Visita agendada e despesas lançadas.':'Visita regravada e despesas atualizadas.');
  V = null;
  goTab('agenda');
}

// ══════════════ FINANCEIRO (aba) — apresentação no padrão VetFlowCare ══════════════
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DESP_CATS = ['Transporte','Refeição','Gasolina','Outros'];
let finExpM = 0;          // deslocamento de mês (0 = atual, -1 = anterior…)
let finExpView = 'mes';   // 'mes' | 'all'
let finExpCat = 'all';    // filtro de categoria
function iconeCat(c){ return c==='Transporte'?'🚗':c==='Refeição'?'🍽️':c==='Gasolina'?'⛽':'📦'; }
function fmtMoedaSemRS(v){ return (parseFloat(v)||0).toFixed(2).replace('.',','); }

// barras por categoria (reaproveitado das duas visões) — padrão VetFlowCare
function cartaoCategorias(byCat, maxCat){
  const chaves = Object.keys(byCat);
  if(!chaves.length) return '';
  return `<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px">
    ${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`
      <div style="margin-top:6px">
        <div style="display:flex;justify-content:space-between;font-size:11px"><span>${esc(c)}</span><b>${fmtBRL(v)}</b></div>
        <div style="height:7px;background:var(--bg);border-radius:4px;margin-top:3px">
          <div style="height:100%;width:${Math.round(v/maxCat*100)}%;background:var(--danger);border-radius:4px;opacity:.75"></div></div>
      </div>`).join('')}</div>`;
}
function fchip(on, label, onclick){
  return `<button onclick="${onclick}" style="padding:9px 14px;border-radius:100px;border:1.5px solid ${on?'var(--primary)':'var(--border)'};background:${on?'var(--primary)':'var(--surface)'};color:${on?'#fff':'var(--muted)'};font-size:12.5px;font-weight:700;white-space:nowrap;flex-shrink:0">${label}</button>`;
}
function renderFinanceiro(){
  document.getElementById('mainNav').classList.remove('hidden');
  document.getElementById('appHeader').innerHTML = `<div class="eyebrow">Controle</div>
    <div style="display:flex;align-items:center;gap:8px"><h2 style="flex:1">💰 Financeiro</h2>
      <button class="btn sm green" style="width:auto" onclick="novaReceitaManual()">Receitas +</button>
      <button class="btn sm danger" style="width:auto" onclick="novaDespesaManual()">Despesa +</button></div>`;

  // Toggle de visão: Mês / Todas / Fluxo diário / Semana / Realizado
  let htop = `<div style="display:flex;gap:8px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px">
    ${fchip(finExpView==='mes','📅 Por mês',"finExpView='mes';renderFinanceiro()")}
    ${fchip(finExpView==='all','🗂️ Todas',"finExpView='all';renderFinanceiro()")}
    ${fchip(finExpView==='fluxo','📊 Fluxo diário',"finExpView='fluxo';renderFinanceiro()")}
    ${fchip(finExpView==='semana','🗓️ Semana',"finExpView='semana';fluxoPeriodo('semana')")}
    ${fchip(finExpView==='realizado','✅ Realizado',"finExpView='realizado';renderFinanceiro()")}
  </div>`;

  if(finExpView==='fluxo'){ document.getElementById('mainContent').innerHTML = htop + fluxoDiarioHTML(); return; }
  if(finExpView==='semana'){ document.getElementById('mainContent').innerHTML = htop + fluxoDiarioHTML(true); return; }
  if(finExpView==='realizado'){ document.getElementById('mainContent').innerHTML = htop + realizadoHTML(); return; }

  const now = new Date();
  const md = new Date(now.getFullYear(), now.getMonth()+finExpM, 1);
  const ym = md.toISOString().slice(0,7);
  const todas = finExpView === 'all';

  // ── despesas e receitas do período ──
  // despesas com "data realizada" preenchida NÃO entram nos relatórios (vão para "Realizado")
  const despAtivas = DB.financeiro.despesas.filter(e=>!e.dataRealizada);
  const despBase = todas ? despAtivas.slice() : despAtivas.filter(e=>(e.data||'').startsWith(ym));
  const recBase  = todas ? DB.financeiro.receitas.slice() : DB.financeiro.receitas.filter(e=>(e.data||'').startsWith(ym));
  const totDesp = despBase.reduce((s,e)=>s+(e.valor||0),0);
  const totRec  = recBase.reduce((s,e)=>s+(e.valor||0),0);
  const saldo   = totRec - totDesp;

  const byCat = {};
  despBase.forEach(e=>{ byCat[e.categoria||'Outros'] = (byCat[e.categoria||'Outros']||0) + (e.valor||0); });
  const maxCat = Math.max(1, ...Object.values(byCat));

  let h = htop;

  if(!todas){
    h += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <button class="btn sm gray" style="width:auto" onclick="finExpM--;renderFinanceiro()">‹</button>
      <b style="flex:1;text-align:center;font-size:15px">${MESES[md.getMonth()]} ${md.getFullYear()}</b>
      <button class="btn sm gray" style="width:auto" ${finExpM>=0?'disabled style="opacity:.4;width:auto"':''} onclick="finExpM++;renderFinanceiro()">›</button></div>`;
  }
  // Resumo Receitas / Despesas / Saldo
  h += `<div class="card" style="margin-bottom:12px">
    <div style="display:flex;gap:8px;text-align:center">
      <div style="flex:1"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Receitas</div><b style="color:var(--success);font-size:15px">${fmtBRL(totRec)}</b></div>
      <div style="flex:1;border-left:1px solid var(--border);border-right:1px solid var(--border)"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Despesas</div><b style="color:var(--danger);font-size:15px">${fmtBRL(totDesp)}</b></div>
      <div style="flex:1"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Saldo</div><b style="color:${saldo>=0?'var(--success)':'var(--danger)'};font-size:15px">${fmtBRL(saldo)}</b></div>
    </div>
    ${Object.keys(byCat).length?cartaoCategorias(byCat, maxCat):''}
  </div>`;

  // Lista combinada (receitas verdes + despesas vermelhas)
  let lista = [
    ...recBase.map(e=>({...e, _tipo:'rec'})),
    ...despBase.map(e=>({...e, _tipo:'desp'}))
  ].sort((a,b)=>(b.data||'').localeCompare(a.data||''));

  if(!lista.length){
    h += `<div class="empty"><div class="big">🧾</div>Nenhum lançamento ${todas?'cadastrado':'neste mês'}<br><span style="font-size:12px">Use "Receitas +" ou "Despesa +" acima</span></div>`;
    document.getElementById('mainContent').innerHTML = h; return;
  }
  let mesAtual='';
  lista.forEach(e=>{
    if(todas){
      const emes=(e.data||'').slice(0,7);
      if(emes!==mesAtual){ mesAtual=emes; const [yy,mm]=emes.split('-');
        h += `<div style="margin:14px 2px 6px"><b style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em">${mm?MESES[parseInt(mm)-1]+' '+yy:'Sem data'}</b></div>`; }
    }
    const rec = e._tipo==='rec';
    h += `<div class="card" style="display:flex;align-items:center;gap:10px;cursor:pointer;${estiloLinhaData(e.data)}" onclick="${rec?`editarReceita('${e.id}')`:`editarDespesa('${e.id}')`}">
      <div class="ptile-icon" style="width:38px;height:38px;flex-shrink:0;background:${rec?'var(--pgreen)':'var(--pblue)'}">${rec?'💚':iconeCat(e.categoria)}</div>
      <div style="flex:1;min-width:0">
        <b style="font-size:14px">${esc(e.categoria||(rec?'Receita':'Outros'))}</b>
        ${e.descricao?`<div style="font-size:11px;color:var(--muted);margin-top:2px;white-space:pre-wrap">📝 ${esc(e.descricao)}</div>`:''}
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${fmtDataBR(e.data)}${e.origem==='agenda'?' · agenda':''} · toque para editar</div></div>
      <b style="color:${rec?'var(--success)':'var(--danger)'};white-space:nowrap">${rec?'+':'-'} ${fmtBRL(e.valor)}</b>
      <button style="background:none;color:var(--muted)" onclick="event.stopPropagation();${rec?`excluirReceita('${e.id}')`:`excluirDespesa('${e.id}')`}">🗑</button></div>`;
  });
  document.getElementById('mainContent').innerHTML = h;
}

// ── Relatório de fluxo diário (Receitas / Despesas / Saldo acumulado) ──
let fluxoIni = '', fluxoFim = '';
function fluxoPeriodo(qual){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  if(qual==='semana'){
    fluxoIni = isoDate(hoje);
    const fim = new Date(hoje); fim.setDate(fim.getDate()+7);   // hoje até +7 dias
    fluxoFim = isoDate(fim);
    finExpView = 'semana';
  } else if(qual==='mes'){
    fluxoIni = isoDate(new Date(hoje.getFullYear(), hoje.getMonth(), 1));
    fluxoFim = isoDate(new Date(hoje.getFullYear(), hoje.getMonth()+1, 0));
    finExpView = 'fluxo';
  } else if(qual==='hoje'){
    fluxoIni = isoDate(hoje); fluxoFim = isoDate(hoje);
    finExpView = 'fluxo';
  }
  renderFinanceiro();
}
function ehHoje(iso){ return iso===isoDate(new Date()); }
function estiloLinhaData(iso){
  const d = new Date(iso+'T00:00:00'); const dow = d.getDay();
  let s = '';
  if(dow===0||dow===6) s += ';background:#FFF7CC';                 // fim de semana amarelo claro
  if(ehHoje(iso)) s += ';border-top:3px solid var(--dark);border-bottom:3px solid var(--dark);font-weight:800';
  return s;
}
let realIni = '', realFim = '';
function realizadoHTML(){
  const realizadas = DB.financeiro.despesas.filter(e=>e.dataRealizada);
  const hojeIso = isoDate(new Date());
  if(!realIni){ const datas = realizadas.map(e=>e.dataRealizada).sort(); realIni = datas.length ? datas[0] : hojeIso.slice(0,8)+'01'; }
  if(!realFim) realFim = hojeIso;
  let lista = realizadas.filter(e=> e.dataRealizada>=realIni && e.dataRealizada<=realFim)
                        .sort((a,b)=> (a.dataRealizada||'').localeCompare(b.dataRealizada||''));
  const total = lista.reduce((s,e)=>s+(e.valor||0),0);
  let h = `<div class="card" style="margin-bottom:10px">
    <div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:8px">✅ Despesas realizadas (com data realizada preenchida)</div>
    <div class="row2">
      <div class="field" style="margin:0"><label>De (data realizada)</label><input type="date" value="${realIni}" max="${realFim}" onchange="realIni=this.value;renderFinanceiro()"></div>
      <div class="field" style="margin:0"><label>Até</label><input type="date" value="${realFim}" min="${realIni}" onchange="realFim=this.value;renderFinanceiro()"></div>
    </div>
  </div>
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">

      <b style="color:var(--danger);white-space:nowrap">- ${fmtBRL(e.valor)}</b></div>`).join('');

}
function fluxoDiarioHTML(modoSemana){
  const todas = [...DB.financeiro.receitas, ...DB.financeiro.despesas].map(e=>e.data).filter(Boolean).sort();
  const hojeIso = isoDate(new Date());
  if(modoSemana){
    const hoje=new Date(); hoje.setHours(0,0,0,0);
    fluxoIni = isoDate(hoje);
    const fim=new Date(hoje); fim.setDate(fim.getDate()+7); fluxoFim = isoDate(fim);
  } else {
    if(!fluxoIni) fluxoIni = todas.length ? todas[0].slice(0,8)+'01' : hojeIso.slice(0,8)+'01';
    if(!fluxoFim) fluxoFim = hojeIso;
  }
  // despesas com "data realizada" preenchida NÃO entram nos relatórios
  const despAtivas = DB.financeiro.despesas.filter(e=>!e.dataRealizada);
  // saldo anterior (antes da data inicial)
  const saldoAnt = DB.financeiro.receitas.filter(e=>(e.data||'')<fluxoIni).reduce((s,e)=>s+(e.valor||0),0)
                 - despAtivas.filter(e=>(e.data||'')<fluxoIni).reduce((s,e)=>s+(e.valor||0),0);

  let h = `<div class="card" style="margin-bottom:10px">
    ${modoSemana?`<div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:8px">🗓️ Semana — de hoje até +7 dias</div>`:`
    <div style="display:flex;gap:8px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px">
      ${fchip(false,'🗓️ Este mês',"fluxoPeriodo('mes')")}
      ${fchip(false,'📆 Hoje',"fluxoPeriodo('hoje')")}
    </div>`}
    <div class="row2">
      <div class="field" style="margin:0"><label>Data inicial</label><input type="date" value="${fluxoIni}" max="${fluxoFim}" onchange="fluxoIni=this.value;finExpView='fluxo';renderFinanceiro()"></div>
      <div class="field" style="margin:0"><label>Data final</label><input type="date" value="${fluxoFim}" min="${fluxoIni}" onchange="fluxoFim=this.value;finExpView='fluxo';renderFinanceiro()"></div>
    </div>
  </div>`;

  // itera dia a dia
  const di = new Date(fluxoIni+'T00:00:00'), df = new Date(fluxoFim+'T00:00:00');
  if(isNaN(di)||isNaN(df)||di>df){ return h + `<div class="empty"><div class="big">📊</div>Selecione um período válido.</div>`; }

  let acc = saldoAnt;
  let totR=0, totD=0;
  let linhas = '';
  for(let d=new Date(di); d<=df; d.setDate(d.getDate()+1)){
    const iso = isoDate(d);
    const r = DB.financeiro.receitas.filter(e=>e.data===iso).reduce((s,e)=>s+(e.valor||0),0);
    const p = despAtivas.filter(e=>e.data===iso).reduce((s,e)=>s+(e.valor||0),0);
    acc += r - p; totR+=r; totD+=p;
    const temMov = (r>0||p>0);
    linhas += `<div style="display:flex;align-items:center;padding:9px 10px;border-bottom:1px solid var(--border);${temMov?'':'opacity:.5'}${estiloLinhaData(iso)}">
      <div style="width:74px;flex-shrink:0;font-size:11.5px;font-weight:${ehHoje(iso)?'800':'600'}" class="mono">${fmtDataBR(iso)}</div>
      <div style="flex:1;text-align:right;color:var(--success);font-size:12px;font-weight:700">${r>0?fmtBRL(r):'—'}</div>
      <div style="flex:1;text-align:right;color:var(--danger);font-size:12px;font-weight:700">${p>0?fmtBRL(p):'—'}</div>
      <div style="flex:1;text-align:right;color:${acc>=0?'var(--success)':'var(--danger)'};font-size:12px;font-weight:800">${fmtBRL(acc)}</div>
    </div>`;
  }
  const saldoFinal = acc;
  h += `<div class="card" style="padding:0;overflow:hidden">
    <div style="display:flex;align-items:center;padding:9px 10px;background:var(--pblue);font-size:9.5px;font-weight:800;text-transform:uppercase;color:var(--dark)">
      <div style="width:74px;flex-shrink:0">Data</div>
      <div style="flex:1;text-align:right">Receitas</div>
      <div style="flex:1;text-align:right">Despesas</div>
      <div style="flex:1;text-align:right">Saldo</div>
    </div>
    <div style="display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--bg);font-size:11px">
      <div style="width:74px;flex-shrink:0;color:var(--muted);font-weight:600">Saldo ant.</div>
      <div style="flex:1"></div><div style="flex:1"></div>
      <div style="flex:1;text-align:right;font-weight:800;color:${saldoAnt>=0?'var(--success)':'var(--danger)'}">${fmtBRL(saldoAnt)}</div>
    </div>
    ${linhas}
    <div style="display:flex;align-items:center;padding:10px;background:var(--pblue);font-size:12px;font-weight:800">
      <div style="width:74px;flex-shrink:0">TOTAL</div>
      <div style="flex:1;text-align:right;color:var(--success)">${fmtBRL(totR)}</div>
      <div style="flex:1;text-align:right;color:var(--danger)">${fmtBRL(totD)}</div>
      <div style="flex:1;text-align:right;color:${saldoFinal>=0?'var(--success)':'var(--danger)'}">${fmtBRL(saldoFinal)}</div>
    </div>
  </div>
  <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5">O saldo é acumulado: cada dia soma as receitas e subtrai as despesas do saldo do dia anterior, até a data final. Verde = positivo, vermelho = negativo.</div>`;
  return h;
}

function editarDespesa(id){
  const ex = DB.financeiro.despesas.find(d=>d.id===id); if(!ex) return;
  showSheet('✏️ Editar despesa', despForm(ex),

function salvarDespesaManual(editId){
  const valor = parseMoeda(document.getElementById('ndVal').value);
  if(valor<=0){ toast('Informe um valor.'); return; }
  let categoria = document.getElementById('ndCat').value;
  if(categoria==='__nova__'){
    categoria = (document.getElementById('ndCatNova').value||'').trim();
    if(!categoria){ toast('Digite a nova categoria.'); return; }
  }
  if(!categoria){ toast('Selecione ou digite uma categoria.'); return; }
  const imovelId = document.getElementById('ndImovel')?.value || '';
  const imovelCodigo = imovelId ? (DB.imoveis.find(im=>im.id===imovelId)?.codigo||'').toUpperCase() : '';
  const dados = { categoria, valor,
    data:document.getElementById('ndData').value||isoDate(new Date()),
    dataRealizada:document.getElementById('ndDataReal')?.value||'',
    imovelId, imovelCodigo,
    descricao:document.getElementById('ndDesc').value||'' };
  const commit = ()=>{
    if(editId){ const ex = DB.financeiro.despesas.find(d=>d.id===editId); if(ex) Object.assign(ex, dados); }
    else { DB.financeiro.despesas.push({ id:uid(), origem:'manual', createdAt:Date.now(), ...dados }); }
    save(); closeSheet(); toast(editId?'✏️ Despesa regravada!':'🧾 Despesa registrada!'); renderFinanceiro();
  };
  if(editId){ _pendingCommit = commit; confirmar({icon:'✏️', title:'Regravar o lançamento?', msg:`Confirmar as alterações da despesa de <b>${fmtBRL(valor)}</b>?`, noLabel:'Voltar', yesLabel:'Regravar', yes:'_runPendingCommit()'}); }
  else { commit(); }
}
let _pendingCommit = null;
function _runPendingCommit(){ const f=_pendingCommit; _pendingCommit=null; if(f) f(); }
function excluirDespesa(id){

  DB.financeiro.despesas = DB.financeiro.despesas.filter(d=>d.id!==id);

}

}
function capturarCorField(){ DB.corretor.nome = val('corNome')||DB.corretor.nome; DB.corretor.creci = val('corCreci')||DB.corretor.creci; DB.corretor.validadeCreci = val('corValidade')||DB.corretor.validadeCreci; }
async function storeCorFoto(kind, dataUrl){
  if(kind==='foto'){ await idbPut(keyCorretorFoto(), dataUrl); DB.corretor.temFoto=true; }
  else { await idbPut(keyCorretorCreci(), dataUrl); DB.corretor.temCreci=true; }
  save(); renderDadosCorretor();
}
async function onCorFoto(kind, input){
  const file = input.files[0]; if(!file) return;
  capturarCorField();
  const reader = new FileReader();
  reader.onload = async (ev)=>{ await storeCorFoto(kind, ev.target.result); };
  reader.readAsDataURL(file);
}
function salvarCorretor(){
  const validade = val('corValidade');
  if(!validade){ toast('Informe a validade da carteira CRECI.'); return; }
  DB.corretor.nome = val('corNome');
  DB.corretor.creci = val('corCreci');
  DB.corretor.validadeCreci = validade;
  save();
  toast('Dados do corretor salvos.');
  goTab('config');
}
function openChangePass(){
  showSheet('Alterar senha', `
    <label>Senha atual</label><div class="pwwrap"><input id="cpOld" type="password"><button type="button" class="eye" onclick="togglePw('cpOld',this)">👁</button></div>
    <label>Nova senha</label><div class="pwwrap"><input id="cpNew" type="password" maxlength="10" oninput="checkPwRules('cpNew','cpBtn')"><button type="button" class="eye" onclick="togglePw('cpNew',this)">👁</button></div>
    ${pwRulesHTML()}`,
    `<button class="btn gray" onclick="closeSheet()">Cancelar</button><button class="btn" id="cpBtn" disabled onclick="doChangePass()">Salvar</button>`);
}
async function doChangePass(){
  const auth = getAuth();
  const oldKey = await deriveKey(val('cpOld'), b64d(auth.salt));
  if(!(await verifyKey(oldKey, auth.check))){ toast('Senha atual incorreta'); return; }
  const novo = val('cpNew');
  if(!Object.values(validatePassword(novo)).every(Boolean)) return;
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(novo, salt);
  const check = await makeCheck(key);
  localStorage.setItem(LS_AUTH, JSON.stringify({salt:b64e(salt), check, createdAt:auth.createdAt}));
  _cryptoKey = key;
  await persistDB();
  closeSheet(); toast('Senha alterada com sucesso.');
}
function doLogout(){
  sessionStorage.removeItem('unlocked');
  _cryptoKey = null;
  location.reload();
}
function confirmarReset(){
  confirmar({icon:'⚠️', title:'Apagar tudo?', msg:'Todos os imóveis, fotos e a senha serão apagados permanentemente deste aparelho.',
    noLabel:'Cancelar', yesLabel:'Apagar tudo', yes:'doResetTudo()'});
}
async function doResetTudo(){
  localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_AUTH);
  sessionStorage.removeItem('unlocked');
  try{ indexedDB.deleteDatabase('corretorimoveis_midia'); }catch(e){}
  location.reload();
}

  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
