<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1D4ED8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cor Sync Imóveis">
<title>Cor Sync Imóveis — Gestão de Imóveis</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2563EB; --dark:#1D4ED8; --accent:#16A34A;
  --bg:#F4F6FC; --surface:#FFFFFF; --text:#16233B; --muted:#6B7A93;
  --border:#E7ECF5; --line:#E7ECF5; --success:#16A34A; --warning:#F59E0B; --danger:#E0453B;
  --pblue:#E8EEFF; --pgreen:#E7F5EC; --pred:#FCEBEA;
  --shadow:0 2px 10px rgba(30,50,100,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:78px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--border);font-size:15px;background:var(--surface);color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px}
h2{font-size:19px;font-weight:800;letter-spacing:-.3px}
.hidden{display:none!important}
.ic{display:inline-block;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.filein{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;opacity:0}
.mono{font-family:'IBM Plex Mono',monospace}

/* ---- splash / lock ---- */
#splash,#lockScreen,#setupScreen{position:fixed;inset:0;background:linear-gradient(160deg,#2F5FEC 0%,#1E3FAE 60%,#16307A 100%);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 26px calc(32px + env(safe-area-inset-bottom));text-align:center;overflow-y:auto}
#splash .mark,#lockScreen .mark,#setupScreen .mark{width:74px;height:74px;border-radius:22px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.brandlogo{width:132px;height:132px;border-radius:28px;object-fit:cover;background:#fff;box-shadow:0 14px 34px rgba(0,0,0,.28);margin-bottom:20px}
.brandlogo.sm{width:96px;height:96px;border-radius:22px;margin-bottom:16px}
#splash .wm{font-size:30px;font-weight:800;color:#fff;letter-spacing:-.5px}
#splash .wm span{color:#8FB0FF}
#splash .tag{color:rgba(255,255,255,.6);font-size:10px;letter-spacing:2px;font-weight:700;margin-top:8px;text-transform:uppercase}
.auth-box{width:100%;max-width:320px}
.auth-title{color:#fff;font-size:19px;font-weight:800;margin-top:4px}
.auth-sub{color:rgba(255,255,255,.75);font-size:13px;margin-top:6px;line-height:1.5;margin-bottom:20px}
.auth-box input{text-align:left;padding:14px 44px 14px 16px}
.pwwrap{position:relative}
.pwwrap .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--muted)}
.auth-box .btn{margin-top:14px}
.pw-rules{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:12px 0 4px;text-align:left}
.pw-rule{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.55);font-weight:600}
.pw-rule .rc{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);flex-shrink:0}
.pw-rule.ok{color:#8FE0B5}
.pw-rule.ok .rc{background:#1FAE6B;border-color:#1FAE6B}
.auth-err{color:#FFB3AC;font-size:12.5px;font-weight:700;margin-top:12px;min-height:16px}
.auth-link{margin-top:18px;background:none;color:rgba(255,255,255,.6);font-size:12px;text-decoration:underline;text-underline-offset:3px}

/* ---- buttons ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:14px;font-weight:700;font-size:14.5px;background:var(--primary);color:#fff;transition:transform .1s ease,filter .1s ease}
.btn:active{transform:scale(.98)}
.btn:disabled{background:#C7CDDB;color:#8890a0;cursor:not-allowed}
.btn.gray{background:var(--surface);color:var(--text);border:1.5px solid var(--border)}
.btn.green{background:var(--accent)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:11px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}

/* ---- header / topbar ---- */
header.topbar{padding:18px 18px 6px;position:sticky;top:0;background:var(--bg);z-index:10}
.greet{display:flex;align-items:center;justify-content:space-between}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--primary);font-weight:700}
.bell{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:14px;color:var(--muted);font-size:13.5px;box-shadow:var(--shadow)}
main{padding:6px 18px 10px}

/* ---- action cards ---- */
.action-card{position:relative;border-radius:20px;overflow:hidden;padding:18px;margin-bottom:12px;width:100%;text-align:left;box-shadow:0 12px 22px -14px rgba(21,27,46,.3)}
.action-card.vender{background:linear-gradient(135deg,var(--primary) 0%,var(--dark) 100%);color:#fff}
.action-card.comprar{background:var(--surface);color:var(--text);border:1.5px dashed var(--border);box-shadow:none;opacity:.75}
.ac-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.action-card.vender .ac-icon{background:rgba(255,255,255,.18)}
.action-card.comprar .ac-icon{background:var(--pblue);color:var(--primary)}
.ac-title{font-weight:800;font-size:16px;margin-top:12px}
.ac-sub{font-size:12px;margin-top:3px;opacity:.85;max-width:85%}
.badge-soon{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--pblue);color:var(--primary);padding:3px 8px;border-radius:100px;font-weight:700;float:right}

/* ---- categories ---- */
.cat-row{display:flex;gap:15px;overflow-x:auto;padding:2px 0 6px}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:7px;flex-shrink:0}
.cat-circle{width:52px;height:52px;border-radius:50%;background:var(--pblue);color:var(--primary);display:flex;align-items:center;justify-content:center}
.cat-item.disabled{opacity:.4}
.cat-label{font-size:11px;font-weight:700}

/* ---- lists / cards ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.stitle{font-weight:800;font-size:15px;margin:18px 0 10px}
.ptile{display:flex;align-items:center;gap:13px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px;text-align:left;margin-bottom:10px;box-shadow:var(--shadow)}
.ptile.disabled{opacity:.5}
.ptile-icon{width:42px;height:42px;border-radius:12px;background:var(--pblue);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.ptile-icon img{width:100%;height:100%;object-fit:cover}
.ptile-title{font-weight:700;font-size:14px}
.ptile-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.ptile-chev{margin-left:auto;color:var(--muted);flex-shrink:0}
.tag{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.05em;color:var(--muted);background:#EEF0F5;padding:3px 7px;border-radius:100px;text-transform:uppercase;font-weight:700}

.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:10px}

/* ---- wizard ---- */
.progress-wrap{padding:14px 18px 4px}
.step-back{display:inline-flex;align-items:center;gap:5px;background:var(--pblue);border:none;color:var(--primary);font-size:13.5px;font-weight:800;padding:9px 15px 9px 11px;border-radius:100px;margin-bottom:11px;cursor:pointer;line-height:1}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.progress-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.06em}
.progress-name{font-size:12.5px;font-weight:700;color:var(--primary)}
.progress-track{height:5px;background:var(--pblue);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:100px;transition:width .25s ease}
.wtabs{display:flex;gap:3px;overflow-x:auto;margin-top:9px;padding-bottom:1px;-webkit-overflow-scrolling:touch}
.wtabs::-webkit-scrollbar{height:0}
.wtab{flex:none;font-size:11px;font-weight:600;padding:6px 11px;border:1px solid var(--border);border-bottom:2px solid transparent;border-radius:9px 9px 0 0;background:var(--pblue);color:var(--primary);white-space:nowrap;cursor:pointer;line-height:1}
.wtab.on{background:var(--surface);color:var(--text);border-bottom-color:var(--primary)}
.section-title{font-weight:800;font-size:16px;margin:6px 0 14px}

.chip-group{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:100px;border:1.5px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:700;cursor:pointer;user-select:none}
.chip.selected{background:var(--primary);border-color:var(--primary);color:#fff}
fieldset{border:none;padding:0;margin:0 0 15px}
legend{padding:0;margin-bottom:8px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.row2{display:flex;gap:10px}
.row2>*{flex:1;min-width:0}
.field{margin-bottom:14px}
.hint{font-size:11px;color:var(--muted);margin-top:5px}
.charcount{font-size:11px;color:var(--muted);margin-top:4px;text-align:right}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border-bottom:none}
.toggle-row .lbl{font-size:13.5px;font-weight:600}
.toggle-row .lbl .d{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:1px}
.switch{width:42px;height:25px;border-radius:100px;background:#E4E7EF;border:1.5px solid var(--border);position:relative;cursor:pointer;flex-shrink:0}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s ease}
.switch.on{background:var(--primary);border-color:var(--primary)}
.switch.on::after{transform:translateX(17px)}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:6px}
.photo-slot{aspect-ratio:1/1;border-radius:16px;border:1.5px dashed var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;position:relative;overflow:hidden;color:var(--primary)}
.photo-slot span{font-size:10px;color:var(--muted);font-weight:600}
.photo-slot.filled{border-style:solid;border-color:var(--primary)}
.photo-slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo-slot .badge{position:absolute;top:5px;left:5px;background:rgba(21,27,46,.75);color:#fff;font-size:8px;font-weight:700;padding:2px 6px;border-radius:100px;z-index:2;font-family:'IBM Plex Mono',monospace}
.photo-slot .remove{position:absolute;top:5px;right:5px;z-index:2;width:19px;height:19px;border-radius:50%;background:rgba(15,20,40,.7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px}
.public-note{font-size:11.5px;color:var(--dark);background:var(--pblue);border-radius:14px;padding:10px 12px;margin:8px 0 16px;line-height:1.5;font-weight:500}

.review-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.review-item:last-child{border-bottom:none}
.review-item .k{color:var(--muted);width:44%;flex-shrink:0}
.review-item .v{font-weight:700;text-align:right}
.review-block{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:4px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.review-block-title{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);padding-top:11px;font-weight:700}
.wizfooter{position:fixed;bottom:calc(62px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--border);z-index:20}

/* ---- bottom nav ---- */
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:50}
nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:9px;font-weight:700;padding:0 1px}
nav button .nic{width:30px;height:26px;border-radius:14px;display:flex;align-items:center;justify-content:center}
nav button.on{color:var(--primary)}
nav button.on .nic{background:var(--pblue)}

/* ---- sheet / confirm ---- */
.modal{position:fixed;inset:0;background:rgba(15,20,40,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal.ov{z-index:400}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:22px 22px 0 0;max-height:88vh;display:flex;flex-direction:column;animation:sheetup .2s ease}
@keyframes sheetup{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 6px}
.sheet .mh h2{font-size:16.5px}
.sheet .mh .x{width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--muted);font-size:14px}
.sheet .mb{padding:8px 18px 4px;overflow-y:auto}
.sheet .mf{display:flex;gap:10px;padding:14px 18px calc(14px + env(safe-area-inset-bottom))}
.sheet .mf .btn{flex:1}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 20px;border-radius:14px;font-size:13px;font-weight:600;z-index:500;box-shadow:0 10px 24px rgba(0,0,0,.3);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}

/* ── Agenda ── */
.ag-search{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:14px;color:var(--muted);box-shadow:var(--shadow)}
.ag-search span{font-size:13px;font-weight:500;flex:1}
.ag-search .go{width:34px;height:34px;border-radius:11px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.weekstrip{display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding-bottom:2px}
.day{flex-shrink:0;width:50px;border-radius:16px;background:var(--surface);border:1px solid var(--line);padding:10px 0;text-align:center;cursor:pointer;transition:.15s}
.day .dw{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.day .dn{font-size:17px;font-weight:800;margin-top:3px}
.day .dd{width:5px;height:5px;border-radius:50%;background:var(--primary);margin:5px auto 0;opacity:0}
.day.has .dd{opacity:1}
.day.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 10px 18px -8px rgba(93,95,239,.55)}
.day.active .dw{color:rgba(255,255,255,.85)}
.day.active .dd{background:#fff}
.cal-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);margin-top:16px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}
.cal-head .nav{width:32px;height:32px;flex-shrink:0;border-radius:50%;background:var(--pblue);color:var(--primary);font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cal-head .lbl{flex:1;text-align:center;font-size:14.5px;font-weight:800;cursor:pointer;padding:6px 4px;border-radius:10px}
.cal-head .lbl:active{background:var(--pblue)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;padding-bottom:4px}
.cal-day{position:relative;aspect-ratio:1;border-radius:12px;background:var(--bg);border:1.5px solid transparent;font-size:12.5px;font-weight:700;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cal-day.today{border-color:var(--primary);color:var(--dark)}
.cal-day.sel{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 10px 18px -8px rgba(93,95,239,.55)}
.cal-day .dots{display:flex;gap:2px;height:5px}
.cal-day .dots i{width:4px;height:4px;border-radius:50%;background:var(--primary)}
.cal-day.sel .dots i{background:#fff}
.pills{display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding-bottom:2px}
.pill{flex-shrink:0;padding:9px 15px;border-radius:100px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.quick{display:flex;gap:16px;margin:18px 0 2px;overflow-x:auto;padding-bottom:2px}
.q{display:flex;flex-direction:column;align-items:center;gap:7px;flex-shrink:0;cursor:pointer}
.q .c{width:54px;height:54px;border-radius:50%;background:var(--pblue);color:var(--primary);display:flex;align-items:center;justify-content:center}
.q .l{font-size:11px;font-weight:700}
.srow{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 12px}
.srow .t{font-size:15.5px;font-weight:800}
.srow .a{font-size:12px;font-weight:700;color:var(--primary)}
.appt{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:13px;box-shadow:var(--shadow);position:relative}
.appt .tt{position:absolute;top:12px;right:12px;background:var(--pblue);color:var(--dark);font-size:11px;font-weight:800;padding:5px 10px;border-radius:100px;font-family:'IBM Plex Mono',monospace}
.appt .thumb{width:64px;height:64px;border-radius:15px;flex-shrink:0;object-fit:cover;background:var(--pblue);color:var(--primary);display:flex;align-items:center;justify-content:center;overflow:hidden}
.appt .kind{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;color:var(--primary);background:var(--pblue);padding:3px 8px;border-radius:100px;text-transform:uppercase}
.appt .acts{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.appt .act{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:12px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.appt .act.wa{background:#E9F9F1;border-color:#CFF0E0;color:#128A56}
.appt .act.gps{background:var(--pblue);border-color:var(--pblue);color:var(--dark)}
svg{display:block}
/* ===== Início (novo layout) ===== */
header.topbar.home{padding:0;background:transparent;box-shadow:none}
.hhero{background:linear-gradient(135deg,var(--primary) 0%,var(--dark) 100%);color:#fff;padding:16px 18px 20px;border-radius:0 0 22px 22px}
.hhero .eyebrow{color:#fff;opacity:.85}
.hhero .top{display:flex;justify-content:space-between;align-items:flex-start;margin-top:4px}
.hhero h1{font-size:24px;font-weight:800;line-height:1.12;letter-spacing:-.3px}
.hhero .sub{font-size:13.5px;opacity:.92;margin-top:3px}
.hbell{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;position:relative;transition:background .2s}
.bellbadge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:50%;background:#fff;color:var(--danger);font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--danger)}
.hsearch{margin-top:14px;background:#fff;border-radius:14px;display:flex;align-items:center;gap:10px;padding:13px 15px;color:#98a3ba;font-size:14.5px;font-weight:600;box-shadow:0 6px 18px rgba(30,50,100,.14);cursor:pointer}
.sec{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 2px 10px}
.creci-ok{display:flex;align-items:center;gap:11px;background:var(--pgreen);border:1.5px solid #BBF7D0;border-radius:14px;padding:12px 14px}
.creci-ok .tx{font-size:13.5px;color:#0f7a3d;font-weight:700;line-height:1.3}
.creci-ok .tx small{display:block;font-weight:600;color:#3f9e63;font-size:12px}
.hero-btn{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:linear-gradient(135deg,var(--primary),var(--dark));color:#fff;border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 12px 24px -8px rgba(37,99,235,.5)}
.hero-btn .pl{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none}
.hero-btn .ht{font-size:18px;font-weight:800;line-height:1.15}
.hero-btn .ht small{display:block;font-size:12.5px;font-weight:600;opacity:.9;margin-top:2px}
.hero-btn .ar{margin-left:auto;opacity:.9}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.qtile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px;text-align:left;box-shadow:var(--shadow)}
.qtile .qbox{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.qtile .ql{font-size:15.5px;font-weight:800;color:var(--text)}
.qtile .qm{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px}
.qb1{background:#E8EEFF;color:#2563EB}.qb2{background:#EEF1F7;color:#475569}.qb3{background:#E4F1FB;color:#0284C7}.qb4{background:#E7F5EC;color:#16A34A}
.vcardh{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.vtoph{display:flex;align-items:center;gap:11px;cursor:pointer}
.avh{width:42px;height:42px;border-radius:12px;background:#E8EEFF;color:#2563EB;display:flex;align-items:center;justify-content:center;flex:none}
.vnmh{font-size:15px;font-weight:800}
.vmetah{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vwhenh{margin-left:auto;text-align:right;flex:none}
.vwhenh b{font-size:13px;color:var(--primary);font-weight:800}
.vwhenh small{display:block;font-size:11.5px;color:var(--muted)}
.vactsh{display:flex;gap:8px;margin-top:11px}
.vbtnh{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:11px;font-size:13px;font-weight:800;cursor:pointer}
.vwah{background:#25D366;color:#fff}
.vrth{background:#E8EEFF;color:var(--primary)}
</style>
</head>

const ZOOM_KEY='cor_zoom', ZOOM_MIN=0.8, ZOOM_MAX=1.7;
function getZoom(){ const v=parseFloat(localStorage.getItem(ZOOM_KEY)); return (v && v>=ZOOM_MIN && v<=ZOOM_MAX)?v:1; }
function aplicarZoom(f){ f=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,Math.round((f||1)*100)/100)); try{ document.documentElement.style.zoom=f; }catch(e){} try{ localStorage.setItem(ZOOM_KEY,String(f)); }catch(e){} return f; }
function mudarZoom(delta){ const f=aplicarZoom(getZoom()+delta); const el=document.getElementById('zoomPct'); if(el) el.textContent=Math.round(f*100)+'%'; }
function resetZoom(){ aplicarZoom(1); const el=document.getElementById('zoomPct'); if(el) el.textContent='100%'; }
try{ document.documentElement.style.zoom=getZoom(); }catch(e){}
const val = id => document.getElementById(id)?.value.trim() || '';
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2,10)+Date.now().toString(36));
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function fmtBRL(v){
  const n = parseFloat(v)||0;
  const neg = n < 0;
  let [int,dec] = Math.abs(n).toFixed(2).split('.');
  int = int.replace(/\B(?=(\d{3})+(?!\d))/g,'.');   // 12980 -> 12.980
  return (neg?'- ':'') + 'R$ ' + int + ',' + dec;
}
// Hora das visitas exibida por extenso: "as 03:10 hs"
function fmtHora(h){ return h ? ('as '+h+' hs') : '--:--'; }
function fmtDataBR(iso){ if(!iso) return '—'; const [a,m,d]=iso.split('-'); return `${d}/${m}/${a}`; }

// ═══ Máscaras ═══
// Telefone (99)99999.9999
function maskTelefone(input){
  let d = input.value.replace(/\D/g,'').slice(0,11);
  let out = '';
  if(d.length>0) out = '(' + d.slice(0,2);
  if(d.length>=2) out += ')';
  out += d.slice(2,7);
  if(d.length>7) out += '.' + d.slice(7,11);
  input.value = out;
  return out;
}
// CEP 99999-999
// CPF: máscara 000.000.000-00 e validação dos dígitos verificadores
function maskCPF(input){
  let d = input.value.replace(/\D/g,'').slice(0,11);
  let out = d;
  if(d.length>9) out = `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`;
  else if(d.length>6) out = `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6)}`;
  else if(d.length>3) out = `${d.slice(0,3)}.${d.slice(3)}`;
  input.value = out;
  const hint = document.getElementById('cpfHint');
  if(hint){
    if(d.length===0){ hint.textContent=''; hint.style.color='var(--muted)'; }
    else if(d.length<11){ hint.textContent='Faltam dígitos…'; hint.style.color='var(--muted)'; }
    else if(validarCPF(d)){ hint.textContent='✓ CPF válido'; hint.style.color='var(--success)'; }
    else { hint.textContent='✗ CPF inválido'; hint.style.color='var(--danger)'; }
  }
  return out;
}
function validarCPF(cpf){
  cpf = (cpf||'').replace(/\D/g,'');
  if(cpf.length!==11 || /^(\d)\1{10}$/.test(cpf)) return false;
  let soma=0;
  for(let i=0;i<9;i++) soma += parseInt(cpf[i])*(10-i);
  let d1 = 11 - (soma%11); if(d1>=10) d1=0;
  if(d1!==parseInt(cpf[9])) return false;
  soma=0;
  for(let i=0;i<10;i++) soma += parseInt(cpf[i])*(11-i);
  let d2 = 11 - (soma%11); if(d2>=10) d2=0;
  return d2===parseInt(cpf[10]);
}
function maskCEP(input){
  let d = input.value.replace(/\D/g,'').slice(0,8);
  input.value = d.length>5 ? d.slice(0,5)+'-'+d.slice(5) : d;
  return input.value;
}
// Moeda 99.999,99 (máx 99.999,99)
function maskMoeda(input){
  let d = input.value.replace(/\D/g,'').slice(0,7); // até 7 dígitos => 99999,99
  if(!d){ input.value=''; return ''; }
  let n = parseInt(d,10);
  let s = (n/100).toFixed(2);                 // "1234.56"
  let [int,dec] = s.split('.');
  int = int.replace(/\B(?=(\d{3})+(?!\d))/g,'.'); // milhar
  input.value = int + ',' + dec;
  return input.value;
}
// Valores maiores (imóvel): até 9 dígitos => 9.999.999,99
function maskMoedaG(input){
  let d = input.value.replace(/\D/g,'').slice(0,9);
  if(!d){ input.value=''; return ''; }
  let s = (parseInt(d,10)/100).toFixed(2);
  let [int,dec] = s.split('.');
  int = int.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  input.value = int + ',' + dec;
  return input.value;
}
function parseMoeda(str){ if(!str) return 0; return parseFloat(str.replace(/\./g,'').replace(',','.'))||0; }
function maskMoedaFromNumber(n){ n=parseFloat(n)||0; let [int,dec]=n.toFixed(2).split('.'); int=int.replace(/\B(?=(\d{3})+(?!\d))/g,'.'); return int+','+dec; }

// ═══ Busca de CEP (ViaCEP) ═══
// CEP é opcional. Se preenchido (8 dígitos), busca o endereço e preenche
// o campo Endereço, permitindo complementar. Requer internet no momento do uso.
async function buscarCEP(cepRaw, alvoIds, force){
  // Ao editar um imóvel já cadastrado, não refaz a busca nem sobrescreve os dados existentes
  // (a não ser que o corretor peça explicitamente, via botão "Buscar endereço pelo CEP").
  if(W && W._editando && !force) return;
  const cep = (cepRaw||'').replace(/\D/g,'');
  if(cep.length!==8) return;
  const hint = document.getElementById('cepHint');
  if(hint) hint.textContent = 'Buscando endereço…';
  try{
    const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const j = await r.json();
    if(j.erro){ if(hint) hint.textContent='CEP não encontrado — preencha manualmente.'; return; }
    // preenche endereço, cidade e UF (sempre gravando o estado)
    if(j.logradouro){ W.endereco = j.logradouro; }
    if(j.localidade){ W.cidade = j.localidade; }
    if(j.uf){ W.estado = String(j.uf).toUpperCase().slice(0,2); }
    if(j.bairro){ W.bairro = j.bairro; }
    renderWizard();
    toast(`Endereço preenchido — ${j.localidade||''}/${(j.uf||'').toUpperCase()}`);
  }catch(e){
    if(hint) hint.textContent = 'Sem conexão para buscar o CEP — preencha manualmente.';
  }
}

// ═══ Rota por GPS — sempre Waze + Google Maps ═══
function abrirRota(endereco){
  const q = encodeURIComponent(endereco||'');
  if(!q){ toast('Endereço não informado.'); return; }
  showSheet('Abrir rota', `
    <div style="font-size:13px;color:var(--muted);margin-bottom:10px">Escolha o app de navegação para traçar a rota até:</div>
    <div style="font-size:13.5px;font-weight:600;margin-bottom:14px">📍 ${esc(endereco)}</div>`,
    `<button class="btn gray" onclick="closeSheet()">Fechar</button>
     <button class="btn" style="background:#33CCFF" onclick="window.open('https://waze.com/ul?q=${q}&navigate=yes','_blank');closeSheet()">Waze</button>
     <button class="btn" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${q}','_blank');closeSheet()">Google Maps</button>`);
}

// ═══ Código sequencial do imóvel (cs/ap/tr/ch + 5 dígitos) ═══
function prefixoTipo(tipo){ return ({casa:'cs',apartamento:'ap',terreno:'tr',chacara:'ch'})[tipo]||'cs'; }
function tipoLabel(tipo){ return ({casa:'Casa',apartamento:'Apartamento',terreno:'Terreno',chacara:'Chácara/Sítio'})[tipo]||'Imóvel'; }
function pad5(n){ return String(Math.min(n,99999)).padStart(5,'0'); }
function pad6(n){ return String(Math.min(n,999999)).padStart(6,'0'); }
// sequencial numérico do proprietário (até 999999)
function maiorSeqProp(){
  let maxN = (DB.contadores && DB.contadores.prop) || 0;
  (DB.proprietarios||[]).forEach(p=>{ const n = parseInt(p.codigo,10)||0; if(n>maxN) maxN=n; });
  return maxN;
}
function proximoCodigoProp(){ return pad6(maiorSeqProp()+1); }
// maior sequência já usada por aquele tipo (contador OU maior código gravado)
function maiorSeq(tipo){
  const pref = prefixoTipo(tipo);
  let maxN = (DB.contadores && DB.contadores[pref]) || 0;
  (DB.imoveis||[]).forEach(im=>{
    if((im.codigo||'').toLowerCase().startsWith(pref)){
      const n = parseInt(im.codigo.slice(2),10) || 0;
      if(n>maxN) maxN=n;
    }
  });
  return maxN;
}
function proximoCodigo(tipo){ return prefixoTipo(tipo) + pad5(maiorSeq(tipo) + 1); }
function b64e(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64d(str){ return Uint8Array.from(atob(str), c=>c.charCodeAt(0)); }

// ── Seletor de arquivo no método do VetFlowCare ──
// O input precisa estar REALMENTE no DOM (não só criado em memória) para o
// seletor nativo de câmera abrir de forma confiável no WebView do celular
// (Android/TWA e iOS). Por isso ele é anexado ao body, escondido fora da tela,
// e só é removido depois que o arquivo já foi escolhido.
// SEM fechar a folha durante o gesto (fechar/alterar o DOM no meio do toque
// cancela a câmera no celular) — a folha é fechada só no callback, já com o arquivo em mãos.
function pegarArquivo(accept, captureVal, cb){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept;
  if(captureVal){ inp.setAttribute('capture', captureVal); }
  inp.style.position = 'fixed';
  inp.style.left = '-9999px';
  inp.style.top = '0';
  document.body.appendChild(inp);
  inp.onchange = function(e){
    var f = e.target.files && e.target.files[0];
    if(inp.parentNode) inp.parentNode.removeChild(inp);
    if(f && cb){ cb(f); }
  };
  inp.click();
}

// ═══ IndexedDB — mídia (fotos/vídeo) separada do banco principal ═══
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const r = indexedDB.open('corretorimoveis_midia', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('midia');
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbPut(key, value){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction('midia','readwrite');
    tx.objectStore('midia').put(value, key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction('midia','readonly');
    const rq = tx.objectStore('midia').get(key);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbDel(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction('midia','readwrite');
    tx.objectStore('midia').delete(key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}
async function idbAll(){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const out = {};
    const tx = db.transaction('midia','readonly');
    const st = tx.objectStore('midia');
    const rq = st.openCursor();
    rq.onsuccess = e => { const c = e.target.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); };
    rq.onerror = () => rej(rq.error);
  });
}
async function idbPutAll(obj){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction('midia','readwrite');
    const st = tx.objectStore('midia');
    Object.entries(obj||{}).forEach(([k,v])=>st.put(v,k));
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}

// ═══ Banco de dados principal — criptografado em repouso (AES-256-GCM) ═══
// A senha nunca é gravada. Deriva-se uma chave (PBKDF2) e o JSON do banco
// é criptografado com ela antes de ir para o localStorage. Sem a senha
// certa, o conteúdo do banco não pode ser lido — mesmo com acesso ao
// aparelho. É o mesmo padrão usado no app de referência (VetFlowCare).
const LS_KEY = 'corretorimoveis_db';
const LS_AUTH = 'corretorimoveis_auth';
let DB = null;
let _cryptoKey = null;

function defaultDB(){ return { imoveis: [], proprietarios: [], agendamentos: [], financeiro:{ despesas:[], receitas:[] }, contadores:{cs:0,ap:0,tr:0,ch:0,prop:0}, corretor: { nome:'', creci:'', validadeCreci:'', email:'', temFoto:false, temCreci:false } }; }
function getAuth(){ try{ return JSON.parse(localStorage.getItem(LS_AUTH)||'null'); }catch(e){ return null; } }

async function deriveKey(pass, saltU8){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:saltU8, iterations:150000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function makeCheck(key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode('corretor-ok'));
  return {iv:b64e(iv), ct:b64e(new Uint8Array(ct))};
}
async function verifyKey(key, check){
  try{
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(check.iv)}, key, b64d(check.ct));
    return new TextDecoder().decode(pt) === 'corretor-ok';
  }catch(e){ return false; }
}
let _saveTimer=null;
function save(){ clearTimeout(_saveTimer); _saveTimer=setTimeout(persistDB, 150); }
async function persistDB(){
  const raw = JSON.stringify(DB);
  if(_cryptoKey){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, _cryptoKey, new TextEncoder().encode(raw));
    localStorage.setItem(LS_KEY, JSON.stringify({iv:b64e(iv), ct:b64e(new Uint8Array(ct))}));
  } else {
    localStorage.setItem(LS_KEY, raw);
  }
}

/* ============ BECAPE (backup / restauração) ============ */
async function idbAllEntries(){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    try{
      const tx = db.transaction('midia','readonly'), st = tx.objectStore('midia');
      const kq = st.getAllKeys(), vq = st.getAll(); let ks=null, vs=null;
      kq.onsuccess = ()=>{ ks = kq.result; if(vs) done(); };
      vq.onsuccess = ()=>{ vs = vq.result; if(ks) done(); };
      kq.onerror = ()=>rej(kq.error); vq.onerror = ()=>rej(vq.error);
      function done(){ const o={}; ks.forEach((k,i)=>o[k]=vs[i]); res(o); }
    }catch(e){ rej(e); }
  });
}
function diasDesdeBackup(){
  const d = localStorage.getItem('cor_last_backup'); if(!d) return null;
  const a = new Date(d+'T00:00:00'); return Math.floor((Date.now()-a.getTime())/86400000);
}
async function exportarBackup(){
  toast('Preparando backup…');
  let midia = {}; try{ midia = await idbAllEntries(); }catch(e){ midia = {}; }
  const pacote = { app:'corretor-imoveis', formato:'backup', versao:APP_VERSION, exportadoEm:new Date().toISOString(), dados:DB, midia:midia };
  let blob; try{ blob = new Blob([JSON.stringify(pacote)], {type:'application/json'}); }catch(e){ toast('Não foi possível gerar o backup.'); return; }
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'corretor-backup-'+isoDate(new Date())+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch(e){} a.remove(); }, 1500);
  }catch(e){ toast('Não foi possível salvar o arquivo.'); return; }
  try{ localStorage.setItem('cor_last_backup', isoDate(new Date())); }catch(e){}
  toast('Backup salvo! Guarde o arquivo em local seguro (nuvem ou e-mail).');
  if(currentTab==='config') renderConfig();
}
function importarBackup(input){
  const f = input.files && input.files[0]; if(!f){ return; }
  input.value = '';
  const r = new FileReader();
  r.onload = e=>{
    let pkg; try{ pkg = JSON.parse(e.target.result); }catch(err){ toast('Arquivo inválido.'); return; }
    if(!pkg || !pkg.dados || !Array.isArray(pkg.dados.imoveis)){ toast('Este arquivo não é um backup do app.'); return; }
    window._pendBackup = pkg;
    const qtd = (pkg.dados.imoveis||[]).length;
    const dt = pkg.exportadoEm ? fmtDataBR(String(pkg.exportadoEm).slice(0,10)) : '—';
    confirmar({ icon: ic('warning',30), title:'Restaurar este backup?',
      msg:'Backup de <b>'+dt+'</b> com <b>'+qtd+' imóvel(is)</b>.<br>Os dados atuais deste aparelho serão <b>substituídos</b> — imóveis, proprietários, agenda, financeiro e fotos.',
      noLabel:'Cancelar', yesLabel:'Restaurar', yesBg:'var(--primary)', yes:'doRestaurarBackup()' });
  };
  r.readAsText(f);
}
async function doRestaurarBackup(){
  const pkg = window._pendBackup; if(!pkg) return;
  toast('Restaurando backup…');
  try{
    let atuais = {}; try{ atuais = await idbAllEntries(); }catch(e){ atuais = {}; }
    for(const k of Object.keys(atuais)){ try{ await idbDel(k); }catch(e){} }
    if(pkg.midia){ for(const k of Object.keys(pkg.midia)){ try{ await idbPut(k, pkg.midia[k]); }catch(e){} } }
    DB = pkg.dados;
    await persistDB();
    toast('Backup restaurado com sucesso!');
    setTimeout(()=>location.reload(), 800);
  }catch(e){ toast('Falha ao restaurar o backup.'); }
}

/* Portão de convite (fase de testes): DESLIGADO por padrão. */
const PORTAO_CONVITE = false;
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addMonths(iso, m){ const d = new Date((iso||todayISO())+'T00:00:00'); d.setMonth(d.getMonth() + (m||0)); return d.toISOString().slice(0,10); }
function makeDevId(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  try{ if(window.crypto && crypto.getRandomValues){ const r = crypto.getRandomValues(new Uint8Array(4)); out = [].slice.call(r).map(function(b){ return A[b % A.length]; }).join(''); } }catch(e){}
  if(!/^[A-Z0-9]{4}$/.test(out)){ out=''; for(let i=0;i<4;i++) out += A[Math.floor(Math.random()*A.length)]; }
  return out;
}
function myDevId(){
  if(!DB) return '';
  if(!/^[A-Z0-9]{4}$/.test(DB.devId||'')){ DB.devId = makeDevId(); try{ save(); }catch(e){} }
  return DB.devId;
}
function corChecksum(devId, planIdx){
  let h = 7; const s = (devId||'') + '|' + planIdx + '|CORRETORIMOVEISPRO';
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % 99991;
  return String(100 + (h % 900));
}
function corCheck(code){
  const m = /^COR-([A-Z0-9]{4})-([123])(\d{3})$/.exec((code||'').toUpperCase().trim());
  if(!m) return { ok:false, motivo:'formato' };
  const dev = m[1], idx = +m[2], chk = m[3];
  if(dev !== myDevId()) return { ok:false, motivo:'aparelho' };
  if(corChecksum(dev, idx) !== chk) return { ok:false, motivo:'invalido' };
  return { ok:true, meses: PLAN_BY_IDX[idx] };
}
/* Convite (fase de testes) — mesmo cálculo usado na Central de Envio, se ligar o portão */
function inviteChecksum(seed){ let h=7; const s=(seed||'')+'CONVITECORRETOR'; for(let i=0;i<s.length;i++) h=(h*31 + s.charCodeAt(i))%99991; return String(1000 + (h%9000)); }
function inviteCheck(code){ const m=/^COR-([A-Z0-9]{4})-(\d{4})$/.exec((code||'').toUpperCase().trim()); return !!m && inviteChecksum(m[1])===m[2]; }
function isProReal(){ const l = DB && DB.license; if(!l || !l.pro) return false; if(l.expiresAt && l.expiresAt < todayISO()) return false; return true; }

  if(!getAuth()){ const code0 = ((document.getElementById('proCode')||{}).value||''); closeSheet();

    return; }
  const el = document.getElementById('proCode');
  const code = ((el&&el.value)||'').toUpperCase().trim();

  if(!r.ok){
    toast(r.motivo==='aparelho' ? ('Este código foi gerado para outro aparelho. Confira o ID AP-'+myDevId()) : 'Código inválido para este aparelho.');

// ═══ MODO SOMENTE LEITURA (após o fim do teste grátis) ═══
// Quando o teste de 30 dias vence e não há Pro ativo, o app entra em SOMENTE
// LEITURA: dá para abrir e consultar todas as telas, mas nada pode ser incluído,
// alterado ou excluído. Ficam liberados: a tela de Ajustes (inclusive Dados do
// corretor e o becape) e a ativação do plano Pro.
const TRIAL_LEITURA_DIAS = 7;   // janela de consulta a contar do bloqueio

function modoSomenteLeitura(){ return !isProReal() && trialExpirado(); }

// Dias que ainda restam da janela de 7 dias de consulta (0 = janela encerrada)
function leituraDiasRestantes(){
  const T = DB.trial;
  if(!T || !T.expiresAt) return 0;
  const fim = addDays(T.expiresAt, TRIAL_LEITURA_DIAS);
  const d = Math.ceil((new Date(fim+'T00:00:00') - new Date(todayISO()+'T00:00:00'))/86400000);
  return d > 0 ? d : 0;
}

// Porteiro das ações de escrita. Uso: if(bloqueioTrial('cadastrar imóvel')) return;

  if(!modoSomenteLeitura()) return false;

  confirmar({ icon:'🔒', title:'Teste grátis encerrado',

const TRIAL_DIAS = 30;
const TRIAL_AVISO_DIAS = 5; // avisa quando faltar 5 dias ou menos
function addDays(iso, n){ const d = new Date((iso||todayISO())+'T00:00:00'); d.setDate(d.getDate()+(n||0)); return d.toISOString().slice(0,10); }
// Marca "este aparelho já usou o trial" em várias chaves + espelho no IndexedDB (sobrevive a reinstalação)
const TRIAL_MARKS = ['cor_trial_used', 'cor_tu2', 'cortrial'];
const TRIAL_IDB_KEY = '__cor_trial_flag__';
function marcarTrialUsado(){
  try{ TRIAL_MARKS.forEach(k => localStorage.setItem(k, '1')); }catch(e){}
  try{ idbPut(TRIAL_IDB_KEY, {used:1, at:new Date().toISOString()}); }catch(e){}
}
function trialJaUsado(){
  for(const k of TRIAL_MARKS){ try{ if(localStorage.getItem(k)) return true; }catch(e){} }
  return false;
}
async function trialJaUsadoForte(){
  const ls = trialJaUsado();
  let idb = false;
  try{ const v = await idbGet(TRIAL_IDB_KEY); idb = !!(v && v.used); }catch(e){}
  if(ls && !idb){ try{ idbPut(TRIAL_IDB_KEY, {used:1, at:new Date().toISOString()}); }catch(e){} }
  if(idb && !ls){ try{ TRIAL_MARKS.forEach(k => localStorage.setItem(k,'1')); }catch(e){} }
  return ls || idb;
}
// Inicia o trial de 30 dias (chamado uma única vez, no primeiro uso do aparelho)
function iniciarTrial(){
  const hoje = todayISO();
  DB.trial = { active:true, startedAt:hoje, expiresAt:addDays(hoje, TRIAL_DIAS) };
  marcarTrialUsado();
  try{ save(); }catch(e){}
}
function trialAtivo(){ const T=DB.trial; if(!T||!T.active||!T.expiresAt) return false; return todayISO() <= T.expiresAt; }
function trialExpirado(){ const T=DB.trial; return !!(T && T.startedAt && T.expiresAt && todayISO() > T.expiresAt); }
function trialDiasRestantes(){
  const T=DB.trial; if(!T||!T.expiresAt) return 0;
  const hoje=new Date(todayISO()+'T00:00:00'), fim=new Date(T.expiresAt+'T00:00:00');
  const dias=Math.ceil((fim-hoje)/86400000); return dias>0?dias:0;
}

function boot(){
  // Sem senha: carrega o banco em texto puro do localStorage (ou cria vazio).
  _cryptoKey = null;
  try{
    const raw = localStorage.getItem(LS_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    // Se por acaso houver um blob criptografado antigo, ignora e recomeça limpo.
    DB = (parsed && Array.isArray(parsed.imoveis)) ? parsed : defaultDB();
    if(!DB.corretor) DB.corretor = { nome:'', creci:'', validadeCreci:'', temFoto:false, temCreci:false };
    if(DB.corretor.validadeCreci===undefined) DB.corretor.validadeCreci='';
    if(DB.corretor.email===undefined) DB.corretor.email='';
    if(!Array.isArray(DB.proprietarios)) DB.proprietarios = [];
    if(!Array.isArray(DB.agendamentos)) DB.agendamentos = [];
    if(!DB.financeiro || !Array.isArray(DB.financeiro.despesas)) DB.financeiro = { despesas:[], receitas:[] };
    if(!Array.isArray(DB.financeiro.receitas)) DB.financeiro.receitas = [];
    if(!DB.contadores) DB.contadores = {cs:0,ap:0,tr:0,ch:0,prop:0};
    if(DB.contadores.prop===undefined) DB.contadores.prop=0;
    if(!DB.devId || !/^[A-Z0-9]{4}$/.test(DB.devId)) DB.devId = makeDevId();
    if(!DB.license) DB.license = { pro:false };
    // ── Avisos/Alertas (sino) — configuráveis em Ajustes, mesmo padrão do VetFlowCare ──
    if(!DB.settings) DB.settings = {};
    if(DB.settings.avisoAtrasado===undefined) DB.settings.avisoAtrasado = true;
    if(DB.settings.avisoHoje===undefined) DB.settings.avisoHoje = true;
    if(DB.settings.aviso7===undefined) DB.settings.aviso7 = true;
    if(DB.settings.aviso3===undefined) DB.settings.aviso3 = true;
    if(DB.settings.aviso1===undefined) DB.settings.aviso1 = true;
    // ── Teste grátis de 30 dias: começa sozinho na primeira vez que o app roda neste
    // aparelho (instalação nova OU quem já usava e nunca teve trial nem Pro) ──
    if(!isProReal() && !DB.trial && !trialJaUsado()){
      iniciarTrial();
      toast('🎁 Você tem 30 dias grátis com tudo liberado!');
    }
  }catch(e){ DB = defaultDB(); }
  // Já existe senha criada → pede a senha antes de abrir (login normal).
  if(getAuth()){
    if(sessionStorage.getItem('unlocked')==='1'){ enterApp(); }
    else renderLock();
    return;
  }
  // Primeiro acesso neste aparelho (sem senha e sem cadastro nenhum) → oferece criar a senha.
  if(primeiroAcesso()){ renderPrimeiroAcesso(); return; }
  enterApp();
}

// Cria a senha SEM apagar nada: passa a criptografar o banco que já existe.
async function criarSenhaParaDBAtual(pass){
  if(!crypto.subtle) return 'Criptografia indisponível neste navegador.';
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(pass, salt);
  const check = await makeCheck(key);
  localStorage.setItem(LS_AUTH, JSON.stringify({salt:b64e(salt), check, createdAt:Date.now()}));
  _cryptoKey = key;
  if(DB && DB.settings) DB.settings.senhaDispensada = false;
  await persistDB();
  sessionStorage.setItem('unlocked','1');
  return '';
}
async function doPrimeiroAcesso(){
  const p1 = val('setupPass'), p2 = val('setupPass2');
  const err = document.getElementById('setupErr');
  if(p1!==p2){ err.textContent = 'As senhas não conferem.'; return; }
  if(!Object.values(validatePassword(p1)).every(Boolean)){ err.textContent = 'A senha não atende às regras.'; return; }
  err.textContent = 'Criando…';
  const msg = await criarSenhaParaDBAtual(p1);
  if(msg){ err.textContent = msg; return; }
  document.getElementById('setupScreen')?.remove();
  enterApp();
  toast('🔐 Senha criada. Seus dados estão protegidos.');
}
function pularSenhaPrimeiroAcesso(){
  if(!DB.settings) DB.settings = {};
  DB.settings.senhaDispensada = true;

}

async function doSetup(){
  const pass = val('setupPass');
  if(!Object.values(validatePassword(pass)).every(Boolean)) return;
  const err = document.getElementById('setupErr');
  if(!crypto.subtle){ err.textContent = 'Criptografia indisponível neste navegador.'; return; }
  err.textContent = 'Criando…';
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(pass, salt);
  const check = await makeCheck(key);
  localStorage.setItem(LS_AUTH, JSON.stringify({salt:b64e(salt), check, createdAt:Date.now()}));
  _cryptoKey = key;
  DB = defaultDB();
  await persistDB();
  sessionStorage.setItem('unlocked','1');
  document.getElementById('setupScreen').remove();
  enterApp();
}

function renderLock(){
  const div = document.createElement('div');
  div.id = 'lockScreen';
  div.innerHTML = `
    <img class="brandlogo sm" src="${LOGO}" alt="Cor Sync Imóveis">
    <div class="auth-title">Bem-vindo de volta</div>

        <button type="button" class="eye" onclick="togglePw('lockPass',this)">👁</button></div>
      <button class="btn" onclick="unlockApp()" style="margin-top:16px">Entrar</button>
      <div class="auth-err" id="lockErr"></div>
      <button class="auth-link" onclick="lockForgot()">Esqueci minha senha</button>
    </div>`;
  document.body.appendChild(div);
  setTimeout(()=>document.getElementById('lockPass')?.focus(),200);
}
async function unlockApp(){
  const auth = getAuth();
  const pass = val('lockPass');
  const err = document.getElementById('lockErr');
  const until = parseInt(localStorage.getItem('cim_lock_until')||'0');
  if(Date.now() < until){ err.textContent = `Muitas tentativas — aguarde ${Math.ceil((until-Date.now())/1000)}s`; return; }
  if(!pass){ err.textContent = 'Digite a senha'; return; }
  err.textContent = 'Verificando…';
  const key = await deriveKey(pass, b64d(auth.salt));
  if(!(await verifyKey(key, auth.check))){
    const tries = parseInt(localStorage.getItem('cim_bad')||'0') + 1;
    localStorage.setItem('cim_bad', tries);
    if(tries>=5){
      localStorage.setItem('cim_lock_until', Date.now()+30000);
      localStorage.setItem('cim_bad','0');
      err.textContent = '5 tentativas erradas — aguarde 30 segundos';
    } else {
      err.textContent = `Senha incorreta (${tries}/5)`;
    }
    return;
  }
  localStorage.removeItem('cim_bad'); localStorage.removeItem('cim_lock_until');
  _cryptoKey = key;
  try{
    const blob = JSON.parse(localStorage.getItem(LS_KEY));
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(blob.iv)}, key, b64d(blob.ct));
    DB = JSON.parse(new TextDecoder().decode(pt));
  }catch(e){ DB = defaultDB(); }
  sessionStorage.setItem('unlocked','1');
  document.getElementById('lockScreen').remove();
  enterApp();
}

function doWipe(){

// Quais dias de antecedência estão ativos nos Ajustes (7/3/1). Sempre pelo menos 1 dia.
function activeAlertDays(){
  const s = DB.settings||{}; const d=[];
  if(s.aviso7) d.push(7); if(s.aviso3) d.push(3); if(s.aviso1) d.push(1);
  return d.length ? d : [1];
}
function diasAte(iso){
  const hoje = new Date(isoDate(new Date())+'T00:00:00');
  const alvo = new Date((iso||'')+'T00:00:00');
  return Math.round((alvo-hoje)/86400000);
}
// Junta os compromissos (visitas) relevantes para avisos: vencidos, de hoje e os
// próximos dentro da antecedência configurada — cada grupo respeita seu toggle em Ajustes.
function compromissosAviso(){
  const s = DB.settings||{};
  const dias = activeAlertDays();
  return (DB.agendamentos||[]).filter(a=>a.data).map(a=>({a, d:diasAte(a.data)}))
    .filter(({d})=>{
      if(d<0) return !!s.avisoAtrasado;
      if(d===0) return !!s.avisoHoje;
      return dias.includes(d);
    })
    .sort((x,y)=>x.d-y.d);
}
// Conta só o que exige atenção AGORA (vencido ou de hoje) — é o número do sino.
function contarAvisosPendentes(){
  return compromissosAviso().filter(({d})=>d<=0).length;
}

function quandoLabel(dataISO){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const [a,m,d] = (dataISO||'').split('-').map(Number);
  if(!a) return '';
  const dt = new Date(a,m-1,d); dt.setHours(0,0,0,0);
  const diff = Math.round((dt-hoje)/86400000);
  if(diff===0) return 'Hoje';
  if(diff===1) return 'Amanhã';
  if(diff===-1) return 'Ontem';
  return fmtDataBR(dataISO).slice(0,5);
}
// ── Financeiro em aberto na tela Início ──────────────────────────────────────
// "Em aberto" segue exatamente a mesma regra da tela Financeiro: é todo
// lançamento (receita ou despesa) que ainda NÃO tem "Data realizada" preenchida.
//  • Atrasados  → data anterior a hoje (a pagar vencido / a receber não recebido).
//                 Mostra TODOS, sem limite.
//  • A vencer   → de hoje até hoje + 3 dias (janela dos próximos 3 dias).
// As cores são as mesmas do Financeiro: receita verde (+), despesa vermelha (-).
function diasAteData(iso){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const [a,m,d] = (iso||'').split('-').map(Number);
  if(!a) return null;
  const dt = new Date(a,m-1,d); dt.setHours(0,0,0,0);
  return Math.round((dt-hoje)/86400000);
}
function titulosEmAberto(){
  const hoje = isoDate(new Date());
  const lim = new Date(); lim.setHours(0,0,0,0); lim.setDate(lim.getDate()+3);
  const limISO = isoDate(lim);
  const fin = DB.financeiro || {};
  const abertos = [
    ...(fin.receitas||[]).filter(e=>!e.dataRealizada && e.data).map(e=>({...e,_tipo:'rec'})),
    ...(fin.despesas||[]).filter(e=>!e.dataRealizada && e.data).map(e=>({...e,_tipo:'desp'}))
  ];
  const porData = (a,b)=>(a.data||'').localeCompare(b.data||'');
  return {
    atrasados: abertos.filter(e=>e.data <  hoje).sort(porData),
    proximos:  abertos.filter(e=>e.data >= hoje && e.data <= limISO).sort(porData)
  };
}
function totaisTitulos(lista){
  return {
    receber: lista.filter(e=>e._tipo==='rec').reduce((s,e)=>s+(e.valor||0),0),
    pagar:   lista.filter(e=>e._tipo==='desp').reduce((s,e)=>s+(e.valor||0),0)
  };
}
function cabecalhoTitulosHTML(titulo, qtd, cor, bg, borda, lista){

  return `<div style="background:${bg};border:1px solid ${borda};border-radius:14px;padding:9px 12px;margin:0 0 8px">
    <div style="font-size:11.5px;font-weight:800;color:${cor};text-transform:uppercase;letter-spacing:.03em">${titulo} · ${qtd}</div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:3px">
      A receber <b style="color:var(--success)">${fmtBRL(t.receber)}</b> · A pagar <b style="color:var(--danger)">${fmtBRL(t.pagar)}</b></div>
  </div>`;
}
function linhaTituloAbertoHTML(e, atrasado){
  const rec = e._tipo==='rec';
  const d = diasAteData(e.data);
  let quando;
  if(atrasado){ const n = Math.abs(d); quando = n===1 ? 'venceu ontem' : `venceu há ${n} dias`; }
  else if(d===0) quando = 'vence hoje';
  else if(d===1) quando = 'vence amanhã';
  else quando = `vence em ${d} dias`;
  const sub = rec && e.fontePagadora
    ? `<div style="font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Fonte pagadora: <b style="color:var(--text);font-weight:700">${esc(e.fontePagadora)}</b></div>`
    : (e.descricao ? `<div style="font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ic('doc',12)} ${esc(e.descricao)}</div>` : '');
  return `<div class="card" style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:11px 12px" onclick="${rec?`editarReceita('${e.id}')`:`editarDespesa('${e.id}')`}">
    <div class="ptile-icon" style="width:36px;height:36px;flex-shrink:0;background:${rec?'var(--pgreen)':'var(--pblue)'}">${rec?'💚':iconeCat(e.categoria)}</div>
    <div style="flex:1;min-width:0">
      <b style="font-size:13.5px">${esc(e.categoria||(rec?'Receita':'Outros'))}</b>
      <span style="font-size:10px;font-weight:800;color:${rec?'var(--success)':'var(--danger)'};background:${rec?'var(--pgreen)':'var(--pred)'};padding:2px 7px;border-radius:100px;margin-left:6px;white-space:nowrap">${rec?'A RECEBER':'A PAGAR'}</span>
      ${sub}
      <div style="font-size:11px;margin-top:3px;color:${atrasado?'var(--danger)':'var(--muted)'};font-weight:${atrasado?'700':'400'}">${fmtDataBR(e.data)} · ${quando}</div>
    </div>
    <b style="color:${rec?'var(--success)':'var(--danger)'};white-space:nowrap;font-size:13.5px">${rec?'+':'-'} ${fmtBRL(e.valor)}</b>
  </div>`;
}
function financeiroAbertoHTML(){
  const { atrasados, proximos } = titulosEmAberto();
  if(!atrasados.length && !proximos.length) return '';
  let h = `<div class="sec">Financeiro em aberto</div>`;
  if(atrasados.length){
    h += cabecalhoTitulosHTML('⚠️ Atrasados', atrasados.length, '#B42318', 'var(--pred)', '#F6C6C2', atrasados);
    h += atrasados.map(e=>linhaTituloAbertoHTML(e, true)).join('');
  }
  if(proximos.length){
    h += cabecalhoTitulosHTML('📅 Próximos 3 dias', proximos.length, '#B45309', '#FFF6E6', '#FCE2B0', proximos);
    h += proximos.map(e=>linhaTituloAbertoHTML(e, false)).join('');
  }
  h += `<button class="btn sm gray" style="margin-top:2px" onclick="goTab('financeiro')">${ic('wallet',15)} Abrir Financeiro</button>`;
  return h;
}

function preencherListaProprietarios(){
  let items = DB.proprietarios.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  const q = propBuscaQ.trim().toLowerCase();
  if(q){
    if(propBuscaModo==='celular'){
      const qd = q.replace(/\D/g,'');
      items = items.filter(p=>[p.tel1,p.tel2,p.tel3].some(t=>(t||'').replace(/\D/g,'').includes(qd)) );
    } else {
      items = items.filter(p=>(p.nome||'').toLowerCase().includes(q));
    }
  }
  const cont = document.getElementById('propListContainer');
  if(!cont) return;
  cont.innerHTML = items.length===0
    ? (DB.proprietarios.length===0
        ? `<div class="empty"><div class="big">${ic('user',40)}</div>Nenhum proprietário cadastrado.<br><button class="btn" style="margin-top:16px;max-width:220px" onclick="novoProprietario()">+ Cadastrar proprietário</button></div>`
        : `<div class="empty"><div class="big">${ic('search',40)}</div>Nenhum proprietário encontrado.</div>`)

      <button class="ptile" onclick="editarProprietario('${p.id}')">

        <div class="ptile-chev">›</div>

  items.forEach(p=>{
    if(p.temFoto) idbGet(keyPropFoto(p.id)).then(data=>{ if(data){ const el=document.getElementById('pthumb_'+p.id); if(el) el.innerHTML=`<img src="${data}">`; } }).catch(()=>{});
  });

// Imóveis que pertencem a este proprietário — pelo vínculo (id) ou, para cadastros
// antigos sem vínculo, pelo nome gravado dentro do imóvel.
function imoveisDoProprietario(id){
  const p = DB.proprietarios.find(x=>x.id===id);
  const nomeP = ((p&&p.nome)||'').trim().toLowerCase();
  return DB.imoveis.filter(im=>{
    if(im.proprietario?.id===id) return true;
    const n = (im.proprietario?.nome||'').trim().toLowerCase();
    return !!nomeP && n===nomeP;
  });
}
function excluirProprietario(id){
  if(bloqueioTrial('excluir o proprietário')) return;
  const p = DB.proprietarios.find(x=>x.id===id);
  const nome = p ? (p.nome||'este proprietário') : 'este proprietário';
  const vinculados = imoveisDoProprietario(id);

  // Com imóvel cadastrado, a exclusão é BLOQUEADA — o imóvel ficaria sem dono.
  if(vinculados.length){
    const lista = vinculados.map(im=>
      `<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)">
         <span>${esc(tipoLabel(im.tipo))}</span>
         <b class="mono" style="color:var(--primary)">${esc((im.codigo||'').toUpperCase())}</b>
       </div>`).join('');
    confirmar({icon:'⛔', title:'Não é possível excluir',
      msg:`<b>Tem imóvel deste proprietário.</b><br>
        <span style="font-size:12.5px">${esc(nome)} está em <b>${vinculados.length} imóvel(is)</b>. Exclua ou troque o proprietário desses imóveis antes de apagar o cadastro.</span>
        <div style="margin-top:10px;text-align:left;font-size:12.5px">${lista}</div>`,
      single:true, yesLabel:'Entendi', yesBg:'var(--primary)', yes:''});
    return;
  }

  confirmar({icon:'🗑️', title:'Excluir proprietário?',
    msg:`Deseja realmente excluir <b>${esc(nome)}</b>? Esta ação não pode ser desfeita.`,
    noLabel:'Cancelar', yesLabel:'Excluir', yes:`doExcluirProprietario('${id}')`});
}
async function doExcluirProprietario(id){
  if(bloqueioTrial('excluir o proprietário')) return;
  await idbDel(keyPropFoto(id)).catch(()=>{});
  DB.proprietarios = DB.proprietarios.filter(x=>x.id!==id);
  // desvincula dos imóveis (mantém os dados copiados no imóvel)
  DB.imoveis.forEach(im=>{ if(im.proprietario?.id===id) im.proprietario.id=''; });
  save();
  toast('Proprietário excluído.');
  P=null; pFotoCache=null;
  goTab('proprietarios');
}
async function onPropFoto(input){
  const file = (input && input.files) ? input.files[0] : input; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{ downscaleImage(ev.target.result, 1280, 0.82, function(d){ storePropFoto(d); }); };
  reader.readAsDataURL(file);
}
async function storePropFoto(dataUrl){ pFotoCache = dataUrl; await idbPut(keyPropFoto(P.id), dataUrl); P.temFoto=true; renderPropForm(); }

}
function salvarProprietario(){
  if(bloqueioTrial('salvar o proprietário')) return;
  P.nome = val('pNome') || P.nome;
  if(!P.nome.trim()){ toast('Informe o nome do proprietário.'); return; }
  if(P.cpf && !validarCPF(P.cpf)){ toast('CPF inválido — confira os números.'); return; }
  const idx = DB.proprietarios.findIndex(x=>x.id===P.id);
  // novo proprietário: grava o sequencial (maior existente + 1)
  if(idx<0){ const prox = maiorSeqProp()+1; DB.contadores.prop = prox; P.codigo = pad6(prox); }
  else if(!P.codigo){ P.codigo = DB.proprietarios[idx].codigo || pad6(maiorSeqProp()+1); }
  P.updatedAt = Date.now();
  if(idx>=0) DB.proprietarios[idx]=P; else DB.proprietarios.push(P);
  save();
  toast('Proprietário salvo — Nº ' + P.codigo);
  const novoId = P.id;
  P=null; pFotoCache=null;
  if(_voltarAoImovel && W){
    _voltarAoImovel = false;
    // volta ao cadastro do imóvel já selecionando o proprietário recém-criado
    escolherProprietario(novoId);
    wStep = 1;
    document.getElementById('mainNav').classList.remove('hidden');
    renderWizard();
    return;
  }
  goTab('proprietarios');
}

  W.medFrente = cc.medFrente||''; W.medFundos = cc.medFundos||''; W.medEsquerdo = cc.medEsquerdo||''; W.medDireito = cc.medDireito||''; W.condicao = cc.condicao||'Usada'; W.morador = cc.morador||'Não'; W.tipoCasa = cc.tipoCasa||tipoCasaDefault; W.outroTipo = cc.outroTipo||'';
  W.quartos=cc.quartos||''; W.suites=cc.suites||''; W.banheiros=cc.banheiros||''; W.lavanderia=cc.lavanderia||'';

  W.condominio = (im.condominio && im.condominio.valor) ? String(im.condominio.valor) : ''; W.comissao = im.comissao||'';
  W.vagas = GA.vagas||''; W.coberta = GA.coberta||''; W.disposicao = GA.disposicao||''; W.portao = GA.portao||'';
  W.portariaVigia = !!GA.portariaVigia; W.segurancaInterna = !!GA.segurancaInterna; W.monitoradoCamera = !!GA.monitoradoCamera;
  const LO = im.loteamento||{};
  W.terrenoCondominio = LO.condominio||''; W.terrenoAcesso = LO.acesso||''; W.terrenoRuas = LO.ruas||''; W.terrenoSarjeta = !!LO.sarjeta; W.terrenoIluminacao = !!LO.iluminacao;
  W.agua = AG.tipo||''; W.aguaFonte = AG.fonte||''; W.aguaSituacao = AG.situacao||'';

function validarStep(s){
  if(s===0 && !(W.endereco||'').trim()){ toast('Informe o endereço do imóvel.'); return false; }

}
function irStep(i){

// Comissão: até 2 dígitos inteiros e 1 casa decimal (0.0 – 99.9)
function sanitizarComissao(input){
  let v = input.value.replace(',', '.').replace(/[^0-9.]/g,'');
  const parts = v.split('.');
  let intp = (parts[0]||'').slice(0,2);
  let dec = parts.length>1 ? '.' + (parts[1]||'').slice(0,1) : (v.endsWith('.') ? '.' : '');
  v = intp + dec;
  input.value = v;
  return v;
}
// Cálculo da comissão: valor negociado × (comissão% ÷ 100). Só aparece se o negociado ≠ 0.
function comissaoCalcHTML(){
  const neg = parseMoeda(W.valorNegociado||'');
  const pct = parseFloat((W.comissao||'').replace(',','.'))||0;
  if(neg<=0) return '';
  const valor = neg * (pct/100);
  return `<div class="card" style="background:var(--pgreen);border:none;margin-top:4px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-size:10px;font-weight:700;color:#128A56;text-transform:uppercase">Comissão estimada</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${fmtBRL(neg)} × ${(pct||0).toString().replace('.',',')}%</div></div>
      <b style="font-size:19px;color:#128A56">${fmtBRL(valor)}</b>
    </div></div>`;
}
function atualizaComissaoCalc(){
  const el = document.getElementById('comissaoCalc');
  if(el) el.innerHTML = comissaoCalcHTML();
}
function toggle(field){ return `<div class="switch ${W[field]?'on':''}" onclick="W.${field}=!W.${field};renderWizard()"></div>`; }

// Escolha de proprietário cadastrado no passo do imóvel.
// Se já houver dados preenchidos, pergunta antes de regravar.
function escolherProprietario(id){
  if(!id){ return; }
  const temDados = (W.nome||W.tel1||W.tel2||W.tel3||W.email1||W.email2);
  if(temDados){
    // reseta a seleção visual até o usuário decidir
    const sel = document.getElementById('propSelect'); if(sel) sel.value = W.proprietarioId||'';
    confirmar({icon:'✍️', title:'Regravar os dados?',
      msg:'Já existem informações preenchidas neste imóvel. Deseja substituí-las pelos dados do proprietário selecionado?',
      noLabel:'Manter', yesLabel:'Regravar', yesBg:'var(--primary)', yes:`aplicarProprietario('${id}')`});
    return;
  }
  aplicarProprietario(id);
}
function aplicarProprietario(id){
  const p = DB.proprietarios.find(x=>x.id===id); if(!p) return;
  W.proprietarioId = p.id;
  W.nome=p.nome||''; W.tel1=p.tel1||''; W.tel2=p.tel2||''; W.tel3=p.tel3||'';
  W.email1=p.email1||''; W.email2=p.email2||'';
  renderWizard();
  toast('Dados do proprietário preenchidos.');
}

// Resumo das medidas do lote (só terreno). Devolve '' se nenhuma foi preenchida.
function medidasLoteTxt(c){
  if(!c) return '';
  const p = [['Frente',c.medFrente],['Fundos',c.medFundos],['Esq.',c.medEsquerdo],['Dir.',c.medDireito]]
    .filter(x=>x[1]!==''&&x[1]!==null&&x[1]!==undefined&&parseFloat(x[1])>0)
    .map(x=>`${x[0]} ${String(x[1]).replace('.',',')} m`);
  return p.join(' · ');
}

// ── Câmera nativa do aparelho (mesmo método do VetFlowCare) ──
// Abre a câmera do próprio celular pelo seletor nativo com "capture".
// Funciona em file://, HTTP e HTTPS, no iOS e no Android — sem depender de getUserMedia.
// A foto é reduzida antes de salvar, para economizar espaço no aparelho.
function abrirCameraModal(facing, cb){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.setAttribute('capture', facing === 'user' ? 'user' : 'environment');
  inp.style.position = 'fixed';
  inp.style.left = '-9999px';
  inp.style.top = '0';
  document.body.appendChild(inp);
  inp.addEventListener('change', function(){
    const f = inp.files && inp.files[0];
    if(!f){ if(inp.parentNode) inp.parentNode.removeChild(inp); return; }
    const r = new FileReader();
    r.onload = function(){
      downscaleImage(r.result, 1280, 0.82, function(smaller){
        if(inp.parentNode) inp.parentNode.removeChild(inp);
        if(cb) cb(smaller);
      });
    };
    r.onerror = function(){ if(inp.parentNode) inp.parentNode.removeChild(inp); toast('Não foi possível ler a foto.'); };
    r.readAsDataURL(f);
  });
  inp.click();
}
// Reduz a imagem mantendo a proporção (economiza armazenamento sem perder legibilidade)
function downscaleImage(dataUrl, maxDim, quality, done){
  try{
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      done(c.toDataURL('image/jpeg', quality || 0.82));
    };
    img.onerror = function(){ done(dataUrl); };
    img.src = dataUrl;
  }catch(e){ done(dataUrl); }
}
async function hydratarFotos(){
  const els = document.querySelectorAll('[data-needload]');
  if(!els.length) return;
  let changed = false;
  for(const el of els){
    const key = el.dataset.needload;
    if(wCache[key]) continue;
    const data = await idbGet(key).catch(()=>null);
    if(data){ wCache[key]=data; changed=true; }
  }
  if(changed) renderWizard();
}
async function onFotoSelected(kind, i, input){
  const file = (input && input.files) ? input.files[0] : input; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{ downscaleImage(ev.target.result, 1280, 0.82, function(d){ storeFotoDataUrl(kind, i, d); input.value=''; }); };
  reader.readAsDataURL(file);
}
async function storeFotoDataUrl(kind, i, dataUrl){
  const key = kind==='pub' ? keyFotoPub(W.id,i) : keyFotoAdd(W.id,i);
  await idbPut(key, dataUrl);
  wCache[key] = dataUrl;
  const nome = nomeFotoArq(kind, i);
  if(kind==='pub'){ W.fotosPublicas[i]=true; W.fotoNomesPub = W.fotoNomesPub||{}; W.fotoNomesPub[i]=nome; }
  else { W.fotosAdicionais[i] = {publica: true, nome}; }
  renderWizard();
  toast('Foto gravada como ' + nome);
}
async function removerFoto(kind, i){
  if(bloqueioTrial('remover a foto')) return;
  const key = kind==='pub' ? keyFotoPub(W.id,i) : keyFotoAdd(W.id,i);
  await idbDel(key).catch(()=>{});
  delete wCache[key];
  if(kind==='pub') W.fotosPublicas[i]=false;
  else W.fotosAdicionais[i]=null;
  renderWizard();
}

async function onVideoSelected(input){
  const file = (input && input.files) ? input.files[0] : input; if(!file){ return; }
  // Verifica a duração antes de aceitar — limite de 45 segundos.
  const url = URL.createObjectURL(file);
  const v = document.createElement('video');
  v.preload = 'metadata';
  v.onloadedmetadata = ()=>{
    const dur = v.duration;
    URL.revokeObjectURL(url);
    if(isFinite(dur) && dur > 45.5){
      toast(`Vídeo de ${Math.round(dur)}s — o limite é 45 segundos.`);
      input.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      await idbPut(keyVideo(W.id), ev.target.result);
      W.video = { nome: file.name, arquivo: nomeVideoArq(), compartilhar: true, duracao: Math.round(dur||0) };
      input.value='';
      renderWizard();
      toast('Vídeo gravado como ' + nomeVideoArq());
    };
    reader.readAsDataURL(file);
  };
  v.onerror = ()=>{ URL.revokeObjectURL(url); toast('Não foi possível ler o vídeo.'); input.value=''; };
  v.src = url;
}

async function onContratoSelected(input){
  const file = (input && input.files) ? input.files[0] : input; if(!file) return;
  const ehPdf = file.type==='application/pdf' || /\.pdf$/i.test(file.name||'');
  if(!ehPdf){ toast('Selecione um arquivo PDF.'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    await idbPut(keyContrato(W.id), ev.target.result);

    input.value='';
    renderWizard();

const CERTIDAO_LABEL = { iptu:'IPTU', registro:'Registro de Imóveis', cnd:'CND Prefeitura', testamento:'Testamento' };
function certidaoSlotHTML(tipo, label){
  W.certidoes = W.certidoes || {};

  const cache = wCache[keyCertidao(W.id,tipo)];
  const isPdf = tem && W.certidoes[tipo].tipoArq==='pdf';
  return `<div class="field"><label>${esc(label)}</label>
    <div class="photo-slot ${tem?'filled':''}" style="width:100%;height:${tem&&cache&&!isPdf?'150px':'64px'};margin-bottom:4px" onclick="${tem?`editarCertidao('${tipo}')`:`escolherOrigemCertidao('${tipo}')`}">
      ${tem
        ? (isPdf
            ? `<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.5"/></svg><span style="font-size:11px;color:var(--dark);font-weight:700">PDF anexado</span><div class="remove" onclick="event.stopPropagation();removerCertidao('${tipo}')">✕</div>`
            : (cache

    </div>
    <input type="file" id="certCam_${tipo}" accept="image/*" capture="environment" class="filein" onchange="onCertidaoSelected('${tipo}',this)">
    <input type="file" id="certGal_${tipo}" accept="image/*,application/pdf" class="filein" onchange="onCertidaoSelected('${tipo}',this)">
  </div>`;
}
function escolherOrigemCertidao(tipo){
  showSheet('Anexar '+(CERTIDAO_LABEL[tipo]||'certidão'), `<div style="font-size:13px;color:var(--muted);margin-bottom:6px">Como você quer anexar?</div>`,
    `<button class="btn gray" onclick="closeSheet()">Cancelar</button>
     <button class="btn gray" onclick="pegarArquivo('image/*,application/pdf',null,function(f){closeSheet();onCertidaoSelected('${tipo}',f);})">${ic('image',16)} Galeria / PDF</button>
     <button class="btn" onclick="pegarArquivo('image/*','environment',function(f){closeSheet();onCertidaoSelected('${tipo}',f);})">${ic('camera',16)} Câmera</button>`);
}
function editarCertidao(tipo){
  if(bloqueioTrial('trocar a certidão')) return;
  confirmar({icon:'📄', title:'Substituir o anexo?', msg:`Deseja trocar o anexo de <b>${esc(CERTIDAO_LABEL[tipo]||'')}</b>?`,
    noLabel:'Não', yesLabel:'Sim', yesBg:'var(--primary)', yes:`escolherOrigemCertidao('${tipo}')`});
}
async function onCertidaoSelected(tipo, input){
  const file = (input && input.files) ? input.files[0] : input; if(!file) return;
  const isPdf = file.type==='application/pdf';
  const reader = new FileReader();
  reader.onload = (ev)=>{
    if(isPdf){ storeCertidaoDataUrl(tipo, ev.target.result, 'pdf'); input.value=''; }
    else { downscaleImage(ev.target.result, 1280, 0.82, function(d){ storeCertidaoDataUrl(tipo, d, 'img'); input.value=''; }); }
  };
  reader.readAsDataURL(file);
}
async function storeCertidaoDataUrl(tipo, dataUrl, tipoArq){
  await idbPut(keyCertidao(W.id, tipo), dataUrl);
  wCache[keyCertidao(W.id, tipo)] = dataUrl;
  W.certidoes = W.certidoes || {};
  W.certidoes[tipo] = { anexado:true, tipoArq: tipoArq||'img' };
  renderWizard();
  toast((CERTIDAO_LABEL[tipo]||'Certidão')+' anexada.');
}
async function removerCertidao(tipo){
  if(bloqueioTrial('remover a certidão')) return;
  await idbDel(keyCertidao(W.id, tipo)).catch(()=>{});
  if(W.certidoes) delete W.certidoes[tipo];
  delete wCache[keyCertidao(W.id, tipo)];
  renderWizard();
}
async function hydratarCertidoes(){
  const els = document.querySelectorAll('[data-needcert]');
  if(!els.length) return;
  let changed=false;
  for(const el of els){
    const tipo = el.dataset.needcert;
    const key = keyCertidao(W.id, tipo);
    if(wCache[key]) continue;
    const data = await idbGet(key).catch(()=>null);
    if(data){ wCache[key]=data; changed=true; }
  }
  if(changed) renderWizard();
}

    proprietario:{ id:W.proprietarioId||'', nome:W.nome, tel1:W.tel1, tel2:W.tel2, tel3:W.tel3, email1:W.email1, email2:W.email2 },
    caracteristicas:{ terreno:W.terreno, construcao:W.construcao, medFrente:W.medFrente||'', medFundos:W.medFundos||'', medEsquerdo:W.medEsquerdo||'', medDireito:W.medDireito||'', condicao:W.condicao, morador:W.morador, tipoCasa:W.tipoCasa, outroTipo:W.outroTipo,
      quartos:W.quartos||'', suites:W.suites||'', banheiros:W.banheiros||'', lavanderia:W.lavanderia||'', piscina:!!W.piscina, piscinaAquecida:!!W.piscinaAquecida, furo:!!W.furo, sauna:!!W.sauna, churrasqueira:!!W.churrasqueira, parquinho:!!W.parquinho, academia:!!W.academia, obsApto:W.obsApto||'' },
    exclusividade:{ exclusiva: W.vendaExclusiva==='Sim', dataInicial:W.dataInicial, dataFinal:W.dataFinal },
    condominio:{ valor: parseFloat(W.condominio)||0 },
    comissao: W.comissao||'',
    valores:{ solicitado: parseMoeda(W.valorSolicitado||''), minimo: parseMoeda(W.valorMinimo||''), negociado: parseMoeda(W.valorNegociado||''), dataProposta: W.dataProposta||'' },
    garagem:{ vagas:W.vagas, coberta:W.coberta, disposicao:W.disposicao, portao:W.portao, portariaVigia:W.portariaVigia, segurancaInterna:!!W.segurancaInterna, monitoradoCamera:!!W.monitoradoCamera },
    loteamento:{ condominio:W.terrenoCondominio, acesso:W.terrenoAcesso, ruas:W.terrenoRuas, sarjeta:W.terrenoSarjeta, iluminacao:W.terrenoIluminacao },
    agua:{ tipo:W.agua, fonte:W.aguaFonte, situacao:W.aguaSituacao },
    energia:{ situacao:W.energia, info:W.energiaInfo }, internet:{ situacao:W.internet },
    fotosPublicas: W.fotosPublicas, fotosAdicionais: W.fotosAdicionais, contrato: W.contrato, video: W.video,
    certidoes: W.certidoes || {}
