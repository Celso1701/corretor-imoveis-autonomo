<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1E3FAE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Corretor PWA">
<title>Corretor PWA — Gestão de Imóveis</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#5D5FEF; --dark:#4B3FD6; --accent:#20B472;
  --bg:#F4F4FB; --surface:#FFFFFF; --text:#191A2C; --muted:#8B8DA3;
  --border:#EDEDF4; --line:#EDEDF4; --success:#20B472; --warning:#F5A623; --danger:#E0453B;
  --pblue:#ECEBFE; --pgreen:#E6F8EF; --pred:#FCEBEA;
  --shadow:0 2px 10px rgba(25,26,44,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:78px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--border);font-size:15px;background:var(--surface);color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px}
h2{font-size:19px;font-weight:800;letter-spacing:-.3px}
.hidden{display:none!important}
.filein{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;opacity:0}
.mono{font-family:'IBM Plex Mono',monospace}

/* ---- splash / lock ---- */
#splash,#lockScreen,#setupScreen{position:fixed;inset:0;background:linear-gradient(160deg,#2F5FEC 0%,#1E3FAE 60%,#16307A 100%);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 26px calc(32px + env(safe-area-inset-bottom));text-align:center;overflow-y:auto}
#splash .mark,#lockScreen .mark,#setupScreen .mark{width:74px;height:74px;border-radius:22px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
#splash .wm{font-size:30px;font-weight:800;color:#fff;letter-spacing:-.5px}
#splash .wm span{color:#8FB0FF}
#splash .tag{color:rgba(255,255,255,.6);font-size:10px;letter-spacing:2px;font-weight:700;margin-top:8px;text-transform:uppercase}
.auth-box{width:100%;max-width:320px}
.auth-title{color:#fff;font-size:19px;font-weight:800;margin-top:4px}
.auth-sub{color:rgba(255,255,255,.75);font-size:13px;margin-top:6px;line-height:1.5;margin-bottom:20px}
.auth-box input{text-align:left;padding:14px 44px 14px 16px}
.pwwrap{position:relative}
.pwwrap .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--muted)}
.auth-box .btn{margin-top:14px}
.pw-rules{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:12px 0 4px;text-align:left}
.pw-rule{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.55);font-weight:600}
.pw-rule .rc{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);flex-shrink:0}
.pw-rule.ok{color:#8FE0B5}
.pw-rule.ok .rc{background:#1FAE6B;border-color:#1FAE6B}
.auth-err{color:#FFB3AC;font-size:12.5px;font-weight:700;margin-top:12px;min-height:16px}
.auth-link{margin-top:18px;background:none;color:rgba(255,255,255,.6);font-size:12px;text-decoration:underline;text-underline-offset:3px}

/* ---- buttons ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:14px;font-weight:700;font-size:14.5px;background:var(--primary);color:#fff;transition:transform .1s ease,filter .1s ease}
.btn:active{transform:scale(.98)}
.btn:disabled{background:#C7CDDB;color:#8890a0;cursor:not-allowed}
.btn.gray{background:var(--surface);color:var(--text);border:1.5px solid var(--border)}
.btn.green{background:var(--accent)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:11px}
.btnrow{display:flex;gap:10px}
.btnrow .btn{flex:1}

/* ---- header / topbar ---- */
header.topbar{padding:18px 18px 6px;position:sticky;top:0;background:var(--bg);z-index:10}
.greet{display:flex;align-items:center;justify-content:space-between}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--primary);font-weight:700}
.bell{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-top:14px;color:var(--muted);font-size:13.5px;box-shadow:var(--shadow)}
main{padding:6px 18px 10px}

/* ---- action cards ---- */
.action-card{position:relative;border-radius:20px;overflow:hidden;padding:18px;margin-bottom:12px;width:100%;text-align:left;box-shadow:0 12px 22px -14px rgba(21,27,46,.3)}
.action-card.vender{background:linear-gradient(135deg,var(--primary) 0%,var(--dark) 100%);color:#fff}
.action-card.comprar{background:var(--surface);color:var(--text);border:1.5px dashed var(--border);box-shadow:none;opacity:.75}
.ac-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.action-card.vender .ac-icon{background:rgba(255,255,255,.18)}
.action-card.comprar .ac-icon{background:var(--pblue);color:var(--primary)}
.ac-title{font-weight:800;font-size:16px;margin-top:12px}
.ac-sub{font-size:12px;margin-top:3px;opacity:.85;max-width:85%}
.badge-soon{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--pblue);color:var(--primary);padding:3px 8px;border-radius:100px;font-weight:700;float:right}

/* ---- categories ---- */
.cat-row{display:flex;gap:15px;overflow-x:auto;padding:2px 0 6px}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:7px;flex-shrink:0}
.cat-circle{width:52px;height:52px;border-radius:50%;background:var(--pblue);color:var(--primary);display:flex;align-items:center;justify-content:center}
.cat-item.disabled{opacity:.4}
.cat-label{font-size:11px;font-weight:700}

/* ---- lists / cards ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.stitle{font-weight:800;font-size:15px;margin:18px 0 10px}
.ptile{display:flex;align-items:center;gap:13px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:13px;text-align:left;margin-bottom:10px;box-shadow:var(--shadow)}
.ptile.disabled{opacity:.5}
.ptile-icon{width:42px;height:42px;border-radius:12px;background:var(--pblue);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.ptile-icon img{width:100%;height:100%;object-fit:cover}
.ptile-title{font-weight:700;font-size:14px}
.ptile-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.ptile-chev{margin-left:auto;color:var(--muted);flex-shrink:0}
.tag{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.05em;color:var(--muted);background:#EEF0F5;padding:3px 7px;border-radius:100px;text-transform:uppercase;font-weight:700}

.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:10px}

/* ---- wizard ---- */
.progress-wrap{padding:14px 18px 4px}
.step-back{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:8px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.progress-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.06em}
.progress-name{font-size:12.5px;font-weight:700;color:var(--primary)}
.progress-track{height:5px;background:var(--pblue);border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:100px;transition:width .25s ease}
.section-title{font-weight:800;font-size:16px;margin:6px 0 14px}

.chip-group{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:100px;border:1.5px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:700;cursor:pointer;user-select:none}
.chip.selected{background:var(--primary);border-color:var(--primary);color:#fff}
fieldset{border:none;padding:0;margin:0 0 15px}
legend{padding:0;margin-bottom:8px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.row2{display:flex;gap:10px}
.row2>*{flex:1;min-width:0}
.field{margin-bottom:14px}
.hint{font-size:11px;color:var(--muted);margin-top:5px}
.charcount{font-size:11px;color:var(--muted);margin-top:4px;text-align:right}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border-bottom:none}
.toggle-row .lbl{font-size:13.5px;font-weight:600}
.toggle-row .lbl .d{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:1px}
.switch{width:42px;height:25px;border-radius:100px;background:#E4E7EF;border:1.5px solid var(--border);position:relative;cursor:pointer;flex-shrink:0}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s ease}
.switch.on{background:var(--primary);border-color:var(--primary)}
.switch.on::after{transform:translateX(17px)}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:6px}
.photo-slot{aspect-ratio:1/1;border-radius:16px;border:1.5px dashed var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;position:relative;overflow:hidden;color:var(--primary)}
.photo-slot span{font-size:10px;color:var(--muted);font-weight:600}
.photo-slot.filled{border-style:solid;border-color:var(--primary)}
.photo-slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo-slot .badge{position:absolute;top:5px;left:5px;background:rgba(21,27,46,.75);color:#fff;font-size:8px;font-weight:700;padding:2px 6px;border-radius:100px;z-index:2;font-family:'IBM Plex Mono',monospace}
.photo-slot .remove{position:absolute;top:5px;right:5px;z-index:2;width:19px;height:19px;border-radius:50%;background:rgba(15,20,40,.7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px}
.public-note{font-size:11.5px;color:var(--dark);background:var(--pblue);border-radius:14px;padding:10px 12px;margin:8px 0 16px;line-height:1.5;font-weight:500}

.review-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.review-item:last-child{border-bottom:none}
.review-item .k{color:var(--muted);width:44%;flex-shrink:0}
.review-item .v{font-weight:700;text-align:right}
.review-block{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:4px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.review-block-title{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);padding-top:11px;font-weight:700}
.wizfooter{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--border);z-index:20}

/* ---- bottom nav ---- */
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:6px 0 calc(8px + env(safe-area-inset-bottom));z-index:50}
nav button{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:9px;font-weight:700;padding:0 1px}
nav button .nic{width:30px;height:26px;border-radius:14px;display:flex;align-items:center;justify-content:center}
nav button.on{color:var(--primary)}
nav button.on .nic{background:var(--pblue)}

/* ---- sheet / confirm ---- */
.modal{position:fixed;inset:0;background:rgba(15,20,40,.5);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal.ov{z-index:400}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:22px 22px 0 0;max-height:88vh;display:flex;flex-direction:column;animation:sheetup .2s ease}
@keyframes sheetup{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet .mh{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 6px}
.sheet .mh h2{font-size:16.5px}
.sheet .mh .x{width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--muted);font-size:14px}
.sheet .mb{padding:8px 18px 4px;overflow-y:auto}
.sheet .mf{display:flex;gap:10px;padding:14px 18px calc(14px + env(safe-area-inset-bottom))}
.sheet .mf .btn{flex:1}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 20px;border-radius:14px;font-size:13px;font-weight:600;z-index:500;box-shadow:0 10px 24px rgba(0,0,0,.3);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}

/* ── Agenda ── */
.ag-search{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:14px;color:var(--muted);box-shadow:var(--shadow)}
.ag-search span{font-size:13px;font-weight:500;flex:1}
.ag-search .go{width:34px;height:34px;border-radius:11px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.weekstrip{display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding-bottom:2px}
.day{flex-shrink:0;width:50px;border-radius:16px;background:var(--surface);border:1px solid var(--line);padding:10px 0;text-align:center;cursor:pointer;transition:.15s}
.day .dw{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.day .dn{font-size:17px;font-weight:800;margin-top:3px}
.day .dd{width:5px;height:5px;border-radius:50%;background:var(--primary);margin:5px auto 0;opacity:0}
.day.has .dd{opacity:1}
.day.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 10px 18px -8px rgba(93,95,239,.55)}
.day.active .dw{color:rgba(255,255,255,.85)}
.day.active .dd{background:#fff}
.pills{display:flex;gap:8px;margin-top:16px;overflow-x:auto;padding-bottom:2px}
.pill{flex-shrink:0;padding:9px 15px;border-radius:100px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.quick{display:flex;gap:16px;margin:18px 0 2px;overflow-x:auto;padding-bottom:2px}
.q{display:flex;flex-direction:column;align-items:center;gap:7px;flex-shrink:0;cursor:pointer}
.q .c{width:54px;height:54px;border-radius:50%;background:var(--pblue);color:var(--primary);display:flex;align-items:center;justify-content:center}
.q .l{font-size:11px;font-weight:700}
.srow{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 12px}
.srow .t{font-size:15.5px;font-weight:800}
.srow .a{font-size:12px;font-weight:700;color:var(--primary)}
.appt{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:13px;box-shadow:var(--shadow);position:relative}
.appt .tt{position:absolute;top:12px;right:12px;background:var(--pblue);color:var(--dark);font-size:11px;font-weight:800;padding:5px 10px;border-radius:100px;font-family:'IBM Plex Mono',monospace}
.appt .thumb{width:64px;height:64px;border-radius:15px;flex-shrink:0;object-fit:cover;background:var(--pblue);color:var(--primary);display:flex;align-items:center;justify-content:center;overflow:hidden}
.appt .kind{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;color:var(--primary);background:var(--pblue);padding:3px 8px;border-radius:100px;text-transform:uppercase}
.appt .acts{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.appt .act{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:12px;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.appt .act.wa{background:#E9F9F1;border-color:#CFF0E0;color:#128A56}
.appt .act.gps{background:var(--pblue);border-color:var(--pblue);color:var(--dark)}
svg{display:block}
</style>
</head>
<body>

<!-- ============ SPLASH ============ -->
<div id="splash">
  <div class="mark"><svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4l8 7.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.5V19a1 1 0 0 0 1 1h3.5v-5h3v5H17a1 1 0 0 0 1-1v-8.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="wm">Corretor<span>PWA</span></div>
  <div class="tag">Organiza · Cadastra · Vende</div>
</div>

<!-- ============ APP SHELL ============ -->
<header class="topbar hidden" id="appHeader"></header>
<main id="mainContent"></main>
<nav id="mainNav" class="hidden">
  <button data-tab="inicio" onclick="goTab('inicio')"><span class="nic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4l8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.5V19a1 1 0 0 0 1 1h3.5v-5h3v5H17a1 1 0 0 0 1-1v-8.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Início</button>
  <button data-tab="imoveis" onclick="goTab('imoveis')"><span class="nic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="4" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.7"/></svg></span>Imóveis</button>
  <button data-tab="agenda" onclick="goTab('agenda')"><span class="nic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M4 9h16M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>Agenda</button>
  <button data-tab="proprietarios" onclick="goTab('proprietarios')"><span class="nic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1.2-3.8 4-5.6 7-5.6s5.8 1.8 7 5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>Propriet.</button>
  <button data-tab="financeiro" onclick="goTab('financeiro')"><span class="nic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 7h18v12H3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="13" r="2.4" stroke="currentColor" stroke-width="1.7"/><path d="M3 10h2M19 10h2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>Financ.</button>

/* ═══════════════════════════════════════════════════════════
   CORRETOR PWA — Gestão de imóveis (módulo VENDER · CASA)
   Arquitetura de referência: SPA de arquivo único, sem framework,
   dados locais (localStorage + IndexedDB), com login criptografado.

// ═══ util básicos ═══
function esc(s){ return String(s??'').replace(/[<>&"']/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c])); }
const APP_VERSION = '1.7.0';
const val = id => document.getElementById(id)?.value.trim() || '';
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2,10)+Date.now().toString(36));
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function fmtBRL(v){ return 'R$ ' + (parseFloat(v)||0).toFixed(2).replace('.',','); }
function fmtDataBR(iso){ if(!iso) return '—'; const [a,m,d]=iso.split('-'); return `${d}/${m}/${a}`; }

// ═══ Máscaras ═══
// Telefone (99)99999.9999
function maskTelefone(input){
  let d = input.value.replace(/\D/g,'').slice(0,11);
  let out = '';
  if(d.length>0) out = '(' + d.slice(0,2);
  if(d.length>=2) out += ')';
  out += d.slice(2,7);
  if(d.length>7) out += '.' + d.slice(7,11);
  input.value = out;
  return out;
}
// CEP 99999-999
function maskCEP(input){
  let d = input.value.replace(/\D/g,'').slice(0,8);
  input.value = d.length>5 ? d.slice(0,5)+'-'+d.slice(5) : d;
  return input.value;
}
// Moeda 99.999,99 (máx 99.999,99)
function maskMoeda(input){
  let d = input.value.replace(/\D/g,'').slice(0,7); // até 7 dígitos => 99999,99
  if(!d){ input.value=''; return ''; }
  let n = parseInt(d,10);
  let s = (n/100).toFixed(2);                 // "1234.56"
  let [int,dec] = s.split('.');
  int = int.replace(/\B(?=(\d{3})+(?!\d))/g,'.'); // milhar
  input.value = int + ',' + dec;
  return input.value;
}
// Valores maiores (imóvel): até 9 dígitos => 9.999.999,99
function maskMoedaG(input){
  let d = input.value.replace(/\D/g,'').slice(0,9);
  if(!d){ input.value=''; return ''; }
  let s = (parseInt(d,10)/100).toFixed(2);
  let [int,dec] = s.split('.');
  int = int.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  input.value = int + ',' + dec;
  return input.value;
}
function parseMoeda(str){ if(!str) return 0; return parseFloat(str.replace(/\./g,'').replace(',','.'))||0; }
function maskMoedaFromNumber(n){ n=parseFloat(n)||0; let [int,dec]=n.toFixed(2).split('.'); int=int.replace(/\B(?=(\d{3})+(?!\d))/g,'.'); return int+','+dec; }

// ═══ Busca de CEP (ViaCEP) ═══
// CEP é opcional. Se preenchido (8 dígitos), busca o endereço e preenche
// o campo Endereço, permitindo complementar. Requer internet no momento do uso.
async function buscarCEP(cepRaw, alvoIds){
  const cep = (cepRaw||'').replace(/\D/g,'');
  if(cep.length!==8) return;
  const hint = document.getElementById('cepHint');
  if(hint) hint.textContent = 'Buscando endereço…';
  try{
    const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const j = await r.json();
    if(j.erro){ if(hint) hint.textContent='CEP não encontrado — preencha manualmente.'; return; }
    // preenche endereço, cidade e UF (sempre gravando o estado)
    if(j.logradouro){ W.endereco = j.logradouro; }
    if(j.localidade){ W.cidade = j.localidade; }
    if(j.uf){ W.estado = String(j.uf).toUpperCase().slice(0,2); }
    if(j.bairro){ W.bairro = j.bairro; }
    renderWizard();
    toast(`Endereço preenchido — ${j.localidade||''}/${(j.uf||'').toUpperCase()}`);
  }catch(e){
    if(hint) hint.textContent = 'Sem conexão para buscar o CEP — preencha manualmente.';
  }
}

// ═══ Rota por GPS — sempre Waze + Google Maps ═══

}

// ═══ Código sequencial do imóvel (cs/ap/tr/ch + 5 dígitos) ═══
function prefixoTipo(tipo){ return ({casa:'cs',apartamento:'ap',terreno:'tr',chacara:'ch'})[tipo]||'cs'; }
function pad5(n){ return String(Math.min(n,99999)).padStart(5,'0'); }
function pad6(n){ return String(Math.min(n,999999)).padStart(6,'0'); }
// sequencial numérico do proprietário (até 999999)
function maiorSeqProp(){
  let maxN = (DB.contadores && DB.contadores.prop) || 0;
  (DB.proprietarios||[]).forEach(p=>{ const n = parseInt(p.codigo,10)||0; if(n>maxN) maxN=n; });
  return maxN;
}
function proximoCodigoProp(){ return pad6(maiorSeqProp()+1); }
// maior sequência já usada por aquele tipo (contador OU maior código gravado)
function maiorSeq(tipo){
  const pref = prefixoTipo(tipo);
  let maxN = (DB.contadores && DB.contadores[pref]) || 0;
  (DB.imoveis||[]).forEach(im=>{
    if((im.codigo||'').toLowerCase().startsWith(pref)){
      const n = parseInt(im.codigo.slice(2),10) || 0;
      if(n>maxN) maxN=n;
    }
  });
  return maxN;
}
function proximoCodigo(tipo){ return prefixoTipo(tipo) + pad5(maiorSeq(tipo) + 1); }
function b64e(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64d(str){ return Uint8Array.from(atob(str), c=>c.charCodeAt(0)); }

// ═══ sheet / confirm (reaproveitados do padrão original) ═══
function showSheet(title, bodyHTML, footHTML){

function confirmar(o){

function closeConfirm(){ document.getElementById('modals2').innerHTML=''; }

// ═══ IndexedDB — mídia (fotos/vídeo) separada do banco principal ═══
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const r = indexedDB.open('corretorimoveis_midia', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('midia');
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbPut(key, value){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction('midia','readwrite');
    tx.objectStore('midia').put(value, key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction('midia','readonly');
    const rq = tx.objectStore('midia').get(key);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbDel(key){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction('midia','readwrite');
    tx.objectStore('midia').delete(key);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}
async function idbAll(){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const out = {};
    const tx = db.transaction('midia','readonly');
    const st = tx.objectStore('midia');
    const rq = st.openCursor();
    rq.onsuccess = e => { const c = e.target.result; if(c){ out[c.key]=c.value; c.continue(); } else res(out); };
    rq.onerror = () => rej(rq.error);
  });
}
async function idbPutAll(obj){
  const db = await idbOpen();
  return new Promise((res,rej)=>{
    const tx = db.transaction('midia','readwrite');
    const st = tx.objectStore('midia');
    Object.entries(obj||{}).forEach(([k,v])=>st.put(v,k));
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  });
}
function keyFotoPub(id,i){ return `foto_${id}_pub${i}`; }
function keyFotoAdd(id,i){ return `foto_${id}_add${i}`; }
function keyVideo(id){ return `video_${id}`; }
function keyContrato(id){ return `contrato_${id}`; }
function keyPropFoto(id){ return `prop_${id}`; }
function keyCorretorFoto(){ return 'corretor_foto'; }
function keyCorretorCreci(){ return 'corretor_creci'; }

// ═══ Banco de dados principal — criptografado em repouso (AES-256-GCM) ═══
// A senha nunca é gravada. Deriva-se uma chave (PBKDF2) e o JSON do banco
// é criptografado com ela antes de ir para o localStorage. Sem a senha
// certa, o conteúdo do banco não pode ser lido — mesmo com acesso ao
// aparelho. É o mesmo padrão usado no app de referência (VetFlowCare).
const LS_KEY = 'corretorimoveis_db';
const LS_AUTH = 'corretorimoveis_auth';
let DB = null;
let _cryptoKey = null;

function defaultDB(){ return { imoveis: [], proprietarios: [], agendamentos: [], financeiro:{ despesas:[], receitas:[] }, contadores:{cs:0,ap:0,tr:0,ch:0,prop:0}, corretor: { nome:'', creci:'', validadeCreci:'', temFoto:false, temCreci:false } }; }
function getAuth(){ try{ return JSON.parse(localStorage.getItem(LS_AUTH)||'null'); }catch(e){ return null; } }

async function deriveKey(pass, saltU8){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:saltU8, iterations:150000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function makeCheck(key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode('corretor-ok'));
  return {iv:b64e(iv), ct:b64e(new Uint8Array(ct))};
}
async function verifyKey(key, check){
  try{
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(check.iv)}, key, b64d(check.ct));
    return new TextDecoder().decode(pt) === 'corretor-ok';
  }catch(e){ return false; }
}
let _saveTimer=null;
function save(){ clearTimeout(_saveTimer); _saveTimer=setTimeout(persistDB, 150); }
async function persistDB(){
  const raw = JSON.stringify(DB);
  if(_cryptoKey){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, _cryptoKey, new TextEncoder().encode(raw));
    localStorage.setItem(LS_KEY, JSON.stringify({iv:b64e(iv), ct:b64e(new Uint8Array(ct))}));
  } else {
    localStorage.setItem(LS_KEY, raw);
  }
}

// ═══ Regras de senha exigidas pelo projeto original ═══
// Exatamente 10 caracteres, com maiúscula, minúscula, número e especial.
function validatePassword(v){
  return { len: v.length===10, up:/[A-Z]/.test(v), low:/[a-z]/.test(v), num:/[0-9]/.test(v), sp:/[^A-Za-z0-9]/.test(v) };
}
function pwRulesHTML(){
  return `<div class="pw-rules" id="pwRules">
    <div class="pw-rule" data-r="len"><span class="rc"></span>10 caracteres</div>
    <div class="pw-rule" data-r="up"><span class="rc"></span>1 maiúscula</div>
    <div class="pw-rule" data-r="low"><span class="rc"></span>1 minúscula</div>
    <div class="pw-rule" data-r="num"><span class="rc"></span>1 número</div>
    <div class="pw-rule" data-r="sp"><span class="rc"></span>1 especial</div>
  </div>`;
}
function checkPwRules(inputId, btnId){
  const res = validatePassword(document.getElementById(inputId).value);
  Object.keys(res).forEach(k=>{
    document.querySelector(`.pw-rule[data-r="${k}"]`)?.classList.toggle('ok', res[k]);
  });
  const ok = Object.values(res).every(Boolean);
  const btn = document.getElementById(btnId);
  if(btn) btn.disabled = !ok;
  return ok;
}
function togglePw(id, btn){
  const el = document.getElementById(id);
  el.type = el.type==='password' ? 'text' : 'password';
  btn.textContent = el.type==='password' ? '👁' : '🙈';
}

// ═══ Splash → App ═══
// NOTA: o login por senha está DESATIVADO nesta versão (será reativado numa
// versão futura). Toda a estrutura de segurança — renderSetup, renderLock,
// deriveKey, criptografia AES-GCM — continua no código abaixo, apenas não é
// mais chamada. Para reativar, basta restaurar a lógica original de boot()
// (ver função bootComLogin abaixo, mantida como referência).
window.addEventListener('DOMContentLoaded', ()=>{
  setTimeout(()=>{
    document.getElementById('splash').classList.add('hidden');
    boot();
  }, 1100);
});
function boot(){
  // Sem senha: carrega o banco em texto puro do localStorage (ou cria vazio).
  _cryptoKey = null;
  try{
    const raw = localStorage.getItem(LS_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    // Se por acaso houver um blob criptografado antigo, ignora e recomeça limpo.
    DB = (parsed && Array.isArray(parsed.imoveis)) ? parsed : defaultDB();
    if(!DB.corretor) DB.corretor = { nome:'', creci:'', validadeCreci:'', temFoto:false, temCreci:false };
    if(DB.corretor.validadeCreci===undefined) DB.corretor.validadeCreci='';
    if(!Array.isArray(DB.proprietarios)) DB.proprietarios = [];
    if(!Array.isArray(DB.agendamentos)) DB.agendamentos = [];
    if(!DB.financeiro || !Array.isArray(DB.financeiro.despesas)) DB.financeiro = { despesas:[], receitas:[] };
    if(!Array.isArray(DB.financeiro.receitas)) DB.financeiro.receitas = [];
    if(!DB.contadores) DB.contadores = {cs:0,ap:0,tr:0,ch:0,prop:0};
    if(DB.contadores.prop===undefined) DB.contadores.prop=0;
  }catch(e){ DB = defaultDB(); }
  enterApp();
}
// Referência para reativar o login no futuro (não usada agora):
function bootComLogin(){
  const auth = getAuth();
  if(!auth) renderSetup();
  else if(sessionStorage.getItem('unlocked')==='1'){ /* já veio de unlockApp nesta sessão */ }
  else renderLock();
}

function renderSetup(){
  const div = document.createElement('div');
  div.id = 'setupScreen';
  div.innerHTML = `
    <div class="mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4l8 7.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.5V19a1 1 0 0 0 1 1h3.5v-5h3v5H17a1 1 0 0 0 1-1v-8.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="auth-title">Crie sua senha de acesso</div>
    <div class="auth-sub">Seus dados (proprietários, endereços, telefones) ficam criptografados neste aparelho. Guarde bem esta senha — sem ela os dados não podem ser recuperados.</div>
    <div class="auth-box">
      <div class="pwwrap"><input id="setupPass" type="password" placeholder="Crie sua senha" maxlength="10" oninput="checkPwRules('setupPass','setupBtn')">
        <button type="button" class="eye" onclick="togglePw('setupPass',this)">👁</button></div>
      ${pwRulesHTML()}
      <button class="btn" id="setupBtn" disabled onclick="doSetup()" style="margin-top:16px">Criar e entrar</button>
      <div class="auth-err" id="setupErr"></div>
    </div>`;
  document.body.appendChild(div);
}
async function doSetup(){
  const pass = val('setupPass');
  if(!Object.values(validatePassword(pass)).every(Boolean)) return;
  const err = document.getElementById('setupErr');
  if(!crypto.subtle){ err.textContent = 'Criptografia indisponível neste navegador.'; return; }
  err.textContent = 'Criando…';
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(pass, salt);
  const check = await makeCheck(key);
  localStorage.setItem(LS_AUTH, JSON.stringify({salt:b64e(salt), check, createdAt:Date.now()}));
  _cryptoKey = key;
  DB = defaultDB();
  await persistDB();
  sessionStorage.setItem('unlocked','1');
  document.getElementById('setupScreen').remove();
  enterApp();
}

function renderLock(){
  const div = document.createElement('div');
  div.id = 'lockScreen';
  div.innerHTML = `
    <div class="mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4l8 7.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.5V19a1 1 0 0 0 1 1h3.5v-5h3v5H17a1 1 0 0 0 1-1v-8.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="auth-title">Bem-vindo de volta</div>
    <div class="auth-sub">Digite sua senha de acesso para abrir sua carteira de imóveis.</div>
    <div class="auth-box">
      <div class="pwwrap"><input id="lockPass" type="password" placeholder="Digite sua senha" maxlength="10" onkeydown="if(event.key==='Enter')unlockApp()">
        <button type="button" class="eye" onclick="togglePw('lockPass',this)">👁</button></div>
      <button class="btn" onclick="unlockApp()" style="margin-top:16px">Entrar</button>
      <div class="auth-err" id="lockErr"></div>
      <button class="auth-link" onclick="lockForgot()">Esqueci minha senha</button>
    </div>`;
  document.body.appendChild(div);
  setTimeout(()=>document.getElementById('lockPass')?.focus(),200);
}
async function unlockApp(){
  const auth = getAuth();
  const pass = val('lockPass');
  const err = document.getElementById('lockErr');
  const until = parseInt(localStorage.getItem('cim_lock_until')||'0');
  if(Date.now() < until){ err.textContent = `Muitas tentativas — aguarde ${Math.ceil((until-Date.now())/1000)}s`; return; }
  if(!pass){ err.textContent = 'Digite a senha'; return; }
  err.textContent = 'Verificando…';
  const key = await deriveKey(pass, b64d(auth.salt));
  if(!(await verifyKey(key, auth.check))){
    const tries = parseInt(localStorage.getItem('cim_bad')||'0') + 1;
    localStorage.setItem('cim_bad', tries);
    if(tries>=5){
      localStorage.setItem('cim_lock_until', Date.now()+30000);
      localStorage.setItem('cim_bad','0');
      err.textContent = '5 tentativas erradas — aguarde 30 segundos';
    } else {
      err.textContent = `Senha incorreta (${tries}/5)`;
    }
    return;
  }
  localStorage.removeItem('cim_bad'); localStorage.removeItem('cim_lock_until');
  _cryptoKey = key;
  try{
    const blob = JSON.parse(localStorage.getItem(LS_KEY));
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(blob.iv)}, key, b64d(blob.ct));
    DB = JSON.parse(new TextDecoder().decode(pt));
  }catch(e){ DB = defaultDB(); }
  sessionStorage.setItem('unlocked','1');
  document.getElementById('lockScreen').remove();
  enterApp();
}
function lockForgot(){
  confirmar({icon:'🔑', title:'Esqueceu a senha?',
    msg:'Sem a senha, os dados criptografados <b>não podem</b> ser recuperados. Deseja apagar tudo e recomeçar?',
    noLabel:'← Voltar', yesLabel:'Apagar e recomeçar', yes:'doWipe()'});
}
function doWipe(){
  localStorage.removeItem(LS_KEY);
  localStorage.removeItem(LS_AUTH);
  sessionStorage.removeItem('unlocked');
  location.reload();
}

function diasParaValidadeCreci(){
  const v = DB.corretor?.validadeCreci;
  if(!v) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const [a,m,d] = v.split('-').map(Number);
  const val = new Date(a, m-1, d); val.setHours(0,0,0,0);
  return Math.round((val - hoje)/86400000);
}

function preencherListaProprietarios(){
  let items = DB.proprietarios.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  const q = propBuscaQ.trim().toLowerCase();
  if(q){
    if(propBuscaModo==='celular'){
      const qd = q.replace(/\D/g,'');
      items = items.filter(p=>[p.tel1,p.tel2,p.tel3].some(t=>(t||'').replace(/\D/g,'').includes(qd)) );
    } else {
      items = items.filter(p=>(p.nome||'').toLowerCase().includes(q));
    }
  }
  const cont = document.getElementById('propListContainer');
  if(!cont) return;
  cont.innerHTML = items.length===0
    ? (DB.proprietarios.length===0
        ? `<div class="empty"><div class="big">👤</div>Nenhum proprietário cadastrado.<br><button class="btn" style="margin-top:16px;max-width:220px" onclick="novoProprietario()">+ Cadastrar proprietário</button></div>`

  });

function excluirProprietario(id){
  const p = DB.proprietarios.find(x=>x.id===id);
  const nome = p ? (p.nome||'este proprietário') : 'este proprietário';
  const vinculados = DB.imoveis.filter(im=>im.proprietario?.id===id).length;
  confirmar({icon:'🗑️', title:'Excluir proprietário?',
    msg:`Deseja realmente excluir <b>${esc(nome)}</b>?${vinculados?` <br>Há ${vinculados} imóvel(is) que usam estes dados — eles não serão apagados, mas perderão o vínculo.`:''} Esta ação não pode ser desfeita.`,
    noLabel:'Cancelar', yesLabel:'Excluir', yes:`doExcluirProprietario('${id}')`});
}
async function doExcluirProprietario(id){
  await idbDel(keyPropFoto(id)).catch(()=>{});
  DB.proprietarios = DB.proprietarios.filter(x=>x.id!==id);
  // desvincula dos imóveis (mantém os dados copiados no imóvel)
  DB.imoveis.forEach(im=>{ if(im.proprietario?.id===id) im.proprietario.id=''; });
  save();
  toast('Proprietário excluído.');
  P=null; pFotoCache=null;
  goTab('proprietarios');
}
async function onPropFoto(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{ await storePropFoto(ev.target.result); };
  reader.readAsDataURL(file);
}

function salvarProprietario(){
  P.nome = val('pNome') || P.nome;
  if(!P.nome.trim()){ toast('Informe o nome do proprietário.'); return; }
  const idx = DB.proprietarios.findIndex(x=>x.id===P.id);
  // novo proprietário: grava o sequencial (maior existente + 1)
  if(idx<0){ const prox = maiorSeqProp()+1; DB.contadores.prop = prox; P.codigo = pad6(prox); }
  else if(!P.codigo){ P.codigo = DB.proprietarios[idx].codigo || pad6(maiorSeqProp()+1); }
  P.updatedAt = Date.now();
  if(idx>=0) DB.proprietarios[idx]=P; else DB.proprietarios.push(P);
  save();
  toast('Proprietário salvo — Nº ' + P.codigo);
  P=null; pFotoCache=null;
  goTab('proprietarios');
}

function iniciarCadastro(){

  renderWizard();
}
async function editarImovel(id){
  const im = DB.imoveis.find(x=>x.id===id);
  if(!im) return;
  W = JSON.parse(JSON.stringify(im));
  if(!W.codigo) W.codigo = (im.codigo||proximoCodigo('casa')); // compat p/ registros antigos
  W.tipo = im.tipo || 'casa';
  W.dataInclusao = im.dataInclusao || isoDate(new Date(im.createdAt||Date.now()));
  if(W.bairro===undefined) W.bairro = im.localizacao?.bairro || '';
  // reconstrói os campos de valor (planos) a partir de im.valores — zero vira "0,00"
  const centavos = n => maskMoedaFromNumber(n||0);
  W.valorSolicitado = im.valores ? centavos(im.valores.solicitado) : '';
  W.valorMinimo     = im.valores ? centavos(im.valores.minimo) : '';
  W.valorNegociado  = im.valores ? centavos(im.valores.negociado) : '';
  wStep = 0; wCache = {};
  document.getElementById('mainNav').classList.add('hidden');
  renderWizard();
}
function sairWizardSemSalvar(){
  confirmar({icon:'🚪', title:'Sair sem salvar?', msg:'As informações preenchidas neste cadastro serão perdidas.',
    noLabel:'Continuar editando', yesLabel:'Sair', yes:'descartarDraftEVoltar()'});
}
async function descartarDraftEVoltar(){
  const jaSalvo = DB.imoveis.some(x=>x.id===W.id);
  if(!jaSalvo){
    for(let i=0;i<6;i++) idbDel(keyFotoPub(W.id,i)).catch(()=>{});
    for(let i=0;i<3;i++) idbDel(keyFotoAdd(W.id,i)).catch(()=>{});
    idbDel(keyVideo(W.id)).catch(()=>{});
    idbDel(keyContrato(W.id)).catch(()=>{});
  }
  W = null;
  abrirTipos();
}

function renderWizard(){
  document.getElementById('appHeader').innerHTML = `
    <div class="progress-wrap" style="padding:0">
      <button class="step-back" onclick="wStep===0?sairWizardSemSalvar():irStep(wStep-1)">‹ Voltar</button>
      <div class="progress-top"><span class="progress-label">ETAPA ${wStep+1} DE 8</span><span class="progress-name">${stepNames[wStep]}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${((wStep+1)/8)*100}%"></div></div>
    </div>`;
  document.getElementById('mainContent').innerHTML = `<div style="padding-bottom:76px">${stepPaneHTML(wStep)}</div>
    <div class="wizfooter"><div class="btnrow">
      <button class="btn gray" onclick="${wStep===0?'sairWizardSemSalvar()':'irStep(wStep-1)'}">Voltar</button>
      <button class="btn ${wStep===7?'green':''}" onclick="${wStep===7?'salvarImovel()':'irStep(wStep+1)'}">${wStep===7?'Salvar imóvel':'Avançar'}</button>
    </div></div>`;
  if(wStep===5) hydratarFotos();
  if(wStep===7) {} // revisão já é montada estática a partir de W
}
function validarStep(s){
  if(s===0 && !(W.endereco||'').trim()){ toast('Informe o endereço do imóvel.'); return false; }
  if(s===1 && !(W.nome||'').trim()){ toast('Informe o nome do proprietário.'); return false; }
  return true;
}
function irStep(i){
  if(i > wStep && !validarStep(wStep)) return;  // só valida ao avançar
  wStep = Math.max(0, Math.min(i,7)); renderWizard(); window.scrollTo(0,0);
}

function chip(group,valv,label){ return `<div class="chip ${W[group]===valv?'selected':''}" onclick="setChip('${group}','${valv.replace(/'/g,"\\'")}')">${esc(label)}</div>`; }
function setChip(group,v){
  W[group]=v;
  if(group==='vendaExclusiva' && v==='Não'){ W.dataInicial=''; W.dataFinal=''; }
  renderWizard();
}
// Comissão: até 2 dígitos inteiros e 1 casa decimal (0.0 – 99.9)
function sanitizarComissao(input){
  let v = input.value.replace(',', '.').replace(/[^0-9.]/g,'');
  const parts = v.split('.');
  let intp = (parts[0]||'').slice(0,2);
  let dec = parts.length>1 ? '.' + (parts[1]||'').slice(0,1) : (v.endsWith('.') ? '.' : '');
  v = intp + dec;
  input.value = v;
  return v;
}
// Cálculo da comissão: valor negociado × (comissão% ÷ 100). Só aparece se o negociado ≠ 0.
function comissaoCalcHTML(){
  const neg = parseMoeda(W.valorNegociado||'');
  const pct = parseFloat((W.comissao||'').replace(',','.'))||0;
  if(neg<=0) return '';
  const valor = neg * (pct/100);
  return `<div class="card" style="background:var(--pgreen);border:none;margin-top:4px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-size:10px;font-weight:700;color:#128A56;text-transform:uppercase">Comissão estimada</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${fmtBRL(neg)} × ${(pct||0).toString().replace('.',',')}%</div></div>
      <b style="font-size:19px;color:#128A56">${fmtBRL(valor)}</b>
    </div></div>`;
}
function atualizaComissaoCalc(){
  const el = document.getElementById('comissaoCalc');
  if(el) el.innerHTML = comissaoCalcHTML();
}
function toggle(field){ return `<div class="switch ${W[field]?'on':''}" onclick="W.${field}=!W.${field};renderWizard()"></div>`; }

// Escolha de proprietário cadastrado no passo do imóvel.

function escolherProprietario(id){
  if(!id){ return; }
  const temDados = (W.nome||W.tel1||W.tel2||W.tel3||W.email1||W.email2);
  if(temDados){
    // reseta a seleção visual até o usuário decidir
    const sel = document.getElementById('propSelect'); if(sel) sel.value = W.proprietarioId||'';
    confirmar({icon:'✍️', title:'Regravar os dados?',
      msg:'Já existem informações preenchidas neste imóvel. Deseja substituí-las pelos dados do proprietário selecionado?',
      noLabel:'Manter', yesLabel:'Regravar', yesBg:'var(--primary)', yes:`aplicarProprietario('${id}')`});
    return;
  }
  aplicarProprietario(id);
}
function aplicarProprietario(id){
  const p = DB.proprietarios.find(x=>x.id===id); if(!p) return;
  W.proprietarioId = p.id;
  W.nome=p.nome||''; W.tel1=p.tel1||''; W.tel2=p.tel2||''; W.tel3=p.tel3||'';
  W.email1=p.email1||''; W.email2=p.email2||'';

// ── Câmera embutida (getUserMedia) — funciona no PC e no celular via HTTPS ──
let _camStream=null, _camCb=null;
async function abrirCameraModal(facing, cb, onFail){
  _camCb = cb;
  const m = document.getElementById('modals') || document.body;
  m.innerHTML = `<div style="position:fixed;inset:0;background:rgba(10,12,25,.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px">
    <video id="camVid" autoplay playsinline muted style="width:100%;max-width:460px;border-radius:16px;background:#000"></video>
    <div style="display:flex;gap:10px;margin-top:14px;width:100%;max-width:460px">
      <button class="btn gray" style="flex:1" onclick="fecharCamera()">Cancelar</button>
      <button class="btn" style="flex:2" onclick="tirarFotoCamera()">📷 Capturar</button>
    </div>
    <div style="color:#fff;opacity:.7;font-size:11px;margin-top:8px" id="camMsg">Permita o acesso à câmera quando o navegador pedir.</div>
  </div>`;
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no-getusermedia');
    _camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode: facing||'environment' }, audio:false });
    const v = document.getElementById('camVid'); if(v){ v.srcObject = _camStream; }
  }catch(e){
    fecharCamera();
    if(typeof onFail==='function'){ onFail(); }   // cai para o seletor com captura
    else toast('Não foi possível abrir a câmera. Use a galeria ou publique o app (HTTPS).');
  }
}
function tirarFotoCamera(){
  const v = document.getElementById('camVid');
  if(!v || !v.videoWidth){ toast('Aguarde a câmera iniciar.'); return; }
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  const dataUrl = c.toDataURL('image/jpeg', 0.85);
  const cb = _camCb;
  fecharCamera();
  if(cb) cb(dataUrl);
}
function fecharCamera(){
  if(_camStream){ _camStream.getTracks().forEach(t=>t.stop()); _camStream=null; }
  _camCb=null;
  const m = document.getElementById('modals'); if(m) m.innerHTML='';
}
async function hydratarFotos(){
  const els = document.querySelectorAll('[data-needload]');
  if(!els.length) return;
  let changed = false;
  for(const el of els){
    const key = el.dataset.needload;
    if(wCache[key]) continue;
    const data = await idbGet(key).catch(()=>null);
    if(data){ wCache[key]=data; changed=true; }
  }
  if(changed) renderWizard();
}
async function onFotoSelected(kind, i, input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{ await storeFotoDataUrl(kind, i, ev.target.result); input.value=''; };
  reader.readAsDataURL(file);
}
async function storeFotoDataUrl(kind, i, dataUrl){
  const key = kind==='pub' ? keyFotoPub(W.id,i) : keyFotoAdd(W.id,i);
  await idbPut(key, dataUrl);
  wCache[key] = dataUrl;
  const nome = nomeFotoArq(kind, i);
  if(kind==='pub'){ W.fotosPublicas[i]=true; W.fotoNomesPub = W.fotoNomesPub||{}; W.fotoNomesPub[i]=nome; }
  else { W.fotosAdicionais[i] = {publica: true, nome}; }
  renderWizard();
  toast('Foto gravada como ' + nome);
}
async function removerFoto(kind, i){
  const key = kind==='pub' ? keyFotoPub(W.id,i) : keyFotoAdd(W.id,i);
  await idbDel(key).catch(()=>{});
  delete wCache[key];
  if(kind==='pub') W.fotosPublicas[i]=false;
  else W.fotosAdicionais[i]=null;
  renderWizard();
}
function toggleFotoPublica(i){
  if(!W.fotosAdicionais[i]) return;
  W.fotosAdicionais[i].publica = !W.fotosAdicionais[i].publica;
  renderWizard();
}
async function onVideoSelected(input){
  const file = input.files[0]; if(!file){ return; }
  // Verifica a duração antes de aceitar — limite de 45 segundos.
  const url = URL.createObjectURL(file);
  const v = document.createElement('video');
  v.preload = 'metadata';
  v.onloadedmetadata = ()=>{
    const dur = v.duration;
    URL.revokeObjectURL(url);
    if(isFinite(dur) && dur > 45.5){
      toast(`Vídeo de ${Math.round(dur)}s — o limite é 45 segundos.`);
      input.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      await idbPut(keyVideo(W.id), ev.target.result);
      W.video = { nome: file.name, arquivo: nomeVideoArq(), compartilhar: true, duracao: Math.round(dur||0) };
      input.value='';
      renderWizard();
      toast('Vídeo gravado como ' + nomeVideoArq());
    };
    reader.readAsDataURL(file);
  };
  v.onerror = ()=>{ URL.revokeObjectURL(url); toast('Não foi possível ler o vídeo.'); input.value=''; };
  v.src = url;
}

  showSheet('Adicionar vídeo', `<div style="font-size:13px;color:var(--muted);margin-bottom:6px">Vídeo <b>${esc(nomeVideoArq())}</b> — como você quer adicionar? (máx. 45s)</div>`,

async function salvarImovel(){
  const jaExiste = DB.imoveis.some(x=>x.id===W.id);
  if(jaExiste){
    confirmar({icon:'💾', title:'Regravar o imóvel?',
      msg:`Deseja salvar as alterações do imóvel <b>${(W.codigo||'').toUpperCase()}</b>?`,
      noLabel:'Desistir', yesLabel:'Regravar', yesBg:'var(--accent)', yes:'gravarImovel()'});
  } else {
    gravarImovel();
  }
}
async function gravarImovel(){
  const jaExiste = DB.imoveis.some(x=>x.id===W.id);
  // Em imóvel novo, confirma o código sequencial e incrementa o contador do tipo.
  if(!jaExiste){
    const pref = prefixoTipo(W.tipo||'casa');
    const prox = maiorSeq(W.tipo||'casa') + 1;
    DB.contadores[pref] = prox;
    W.codigo = pref + pad5(prox);
  }
  const imovel = {
    id: W.id, tipo: W.tipo||'casa', codigo: W.codigo, dataInclusao: W.dataInclusao||isoDate(new Date(W.createdAt||Date.now())), createdAt: W.createdAt, updatedAt: Date.now(),
    localizacao:{ tipoEndereco:W.tipoEndereco, endereco:W.endereco, numero:W.numero, complemento:W.complemento, bairro:W.bairro, cidade:W.cidade, estado:W.estado, cep:W.cep },
    proprietario:{ id:W.proprietarioId||'', nome:W.nome, tel1:W.tel1, tel2:W.tel2, tel3:W.tel3, email1:W.email1, email2:W.email2 },
    caracteristicas:{ terreno:W.terreno, construcao:W.construcao, condicao:W.condicao, morador:W.morador, tipoCasa:W.tipoCasa, outroTipo:W.outroTipo },
    exclusividade:{ exclusiva: W.vendaExclusiva==='Sim', dataInicial:W.dataInicial, dataFinal:W.dataFinal },
    condominio:{ valor: parseFloat(W.condominio)||0 },
    comissao: W.comissao||'',
    valores:{ solicitado: parseMoeda(W.valorSolicitado||''), minimo: parseMoeda(W.valorMinimo||''), negociado: parseMoeda(W.valorNegociado||'') },
    garagem:{ vagas:W.vagas, coberta:W.coberta, disposicao:W.disposicao, portao:W.portao },
    agua:{ tipo:W.agua, fonte:W.aguaFonte, situacao:W.aguaSituacao },
    energia:{ situacao:W.energia }, internet:{ situacao:W.internet },
    fotosPublicas: W.fotosPublicas, fotosAdicionais: W.fotosAdicionais, contrato: W.contrato, video: W.video
  };
  const idx = DB.imoveis.findIndex(x=>x.id===imovel.id);
  if(idx>=0) DB.imoveis[idx]=imovel; else DB.imoveis.push(imovel);
  save();
  toast((idx>=0?'✓ Imóvel regravado — ':'✓ Imóvel salvo — ') + (imovel.codigo||'').toUpperCase());
  W = null;
  goTab('imoveis');
}

function preencherListaImoveis(){
  let items = DB.imoveis.slice().sort((a,b)=>b.updatedAt-a.updatedAt);
  const q = imoBuscaQ.trim().toLowerCase();
  if(q){
    if(imoBuscaModo==='cep'){ const qd=q.replace(/\D/g,''); items = items.filter(im=>(im.localizacao.cep||'').replace(/\D/g,'').includes(qd)); }
    else if(imoBuscaModo==='cidade'){ items = items.filter(im=>(im.localizacao.cidade||'').toLowerCase().includes(q)); }
    else { items = items.filter(im=>(im.proprietario?.nome||'').toLowerCase().includes(q)); }
  }
  const cont = document.getElementById('imoListContainer');
  if(!cont) return;
  cont.innerHTML = items.length===0
    ? (DB.imoveis.length===0
        ? `<div class="empty"><div class="big">🏡</div>Nenhum imóvel cadastrado ainda.<br><button class="btn" style="margin-top:16px;max-width:220px" onclick="abrirTipos()">+ Cadastrar imóvel</button></div>`
        : `<div class="empty"><div class="big">🔍</div>Nenhum imóvel encontrado.</div>`)
    : items.map(im=>`

// ── Extrato do imóvel: todos os lançamentos por data, desde a data de inclusão ──
function abrirExtratoImovel(id){
  const im = DB.imoveis.find(x=>x.id===id); if(!im) return;
  document.getElementById('mainNav').classList.add('hidden');
  const ini = im.dataInclusao || isoDate(new Date(im.createdAt||Date.now()));
  document.getElementById('appHeader').innerHTML = `<button class="step-back" onclick="abrirDetalhe('${im.id}')">‹ Imóvel</button><h2>Extrato do imóvel</h2><div class="mono" style="color:var(--primary);font-weight:700;font-size:12px;margin-top:2px">${(im.codigo||'').toUpperCase()} · desde ${fmtDataBR(ini)}</div>`;

  // lançamentos deste imóvel a partir da data de inclusão
  const recs = DB.financeiro.receitas.filter(e=>e.imovelId===id && (e.data||'')>=ini).map(e=>({...e,_t:'rec'}));
  const desps = DB.financeiro.despesas.filter(e=>e.imovelId===id && (e.data||'')>=ini).map(e=>({...e,_t:'desp'}));
  const todos = [...recs, ...desps].sort((a,b)=> (a.data||'').localeCompare(b.data||'') || (a.createdAt||0)-(b.createdAt||0));

  const totRec = recs.reduce((s,e)=>s+(e.valor||0),0);
  const totDesp = desps.reduce((s,e)=>s+(e.valor||0),0);
  const saldoFinal = totRec - totDesp;

  let h = `<div class="card" style="margin-bottom:12px">
    <div style="display:flex;gap:8px;text-align:center">
      <div style="flex:1"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Receitas</div><b style="color:var(--success);font-size:15px">${fmtBRL(totRec)}</b></div>
      <div style="flex:1;border-left:1px solid var(--border);border-right:1px solid var(--border)"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Despesas</div><b style="color:var(--danger);font-size:15px">${fmtBRL(totDesp)}</b></div>
      <div style="flex:1"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Saldo</div><b style="color:${saldoFinal>=0?'var(--success)':'var(--danger)'};font-size:15px">${fmtBRL(saldoFinal)}</b></div>
    </div></div>`;

  if(!todos.length){
    h += `<div class="empty"><div class="big">📊</div>Nenhum lançamento vinculado a este imóvel<br><span style="font-size:12px">Lançamentos de visitas na agenda entram aqui automaticamente. Em Receitas/Despesas do Financeiro você pode vincular um imóvel.</span></div>`;
    document.getElementById('mainContent').innerHTML = h;
    return;
  }

  // tabela por data com saldo acumulado
  let acc = 0;
  let linhas = '';
  todos.forEach(e=>{
    const rec = e._t==='rec';
    acc += rec ? (e.valor||0) : -(e.valor||0);
    linhas += `<div style="display:flex;align-items:center;padding:9px 10px;border-bottom:1px solid var(--border);gap:8px">
      <div style="width:64px;flex-shrink:0;font-size:11px;font-weight:600" class="mono">${fmtDataBR(e.data)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12.5px;font-weight:700">${esc(e.categoria||(rec?'Receita':'Despesa'))}</div>
        ${e.descricao?`<div style="font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.descricao)}</div>`:''}
      </div>
      <div style="text-align:right;white-space:nowrap">
        <div style="font-size:12.5px;font-weight:700;color:${rec?'var(--success)':'var(--danger)'}">${rec?'+':'-'} ${fmtBRL(e.valor)}</div>
        <div style="font-size:10.5px;color:${acc>=0?'var(--success)':'var(--danger)'}">saldo ${fmtBRL(acc)}</div>
      </div></div>`;
  });
  h += `<div class="card" style="padding:0;overflow:hidden">
    <div style="display:flex;align-items:center;padding:9px 10px;background:var(--pblue);font-size:9.5px;font-weight:800;text-transform:uppercase;color:var(--dark)">
      <div style="width:64px;flex-shrink:0">Data</div><div style="flex:1">Lançamento</div><div style="text-align:right">Valor / Saldo</div></div>
    ${linhas}
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px;background:var(--pblue);font-size:12.5px;font-weight:800">
      <span>Saldo final</span><b style="color:${saldoFinal>=0?'var(--success)':'var(--danger)'}">${fmtBRL(saldoFinal)}</b></div>
  </div>
  <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5">Lançamentos em ordem de data desde a inclusão do imóvel (${fmtDataBR(ini)}). Receitas em verde, despesas em vermelho; o saldo acumula lançamento a lançamento.</div>
  <button class="btn gray" style="margin-top:12px" onclick="abrirDetalhe('${im.id}')">‹ Voltar ao imóvel</button>`;
  document.getElementById('mainContent').innerHTML = h;
}
async function doExcluir(id){
  for(let i=0;i<6;i++) idbDel(keyFotoPub(id,i)).catch(()=>{});
  for(let i=0;i<3;i++) idbDel(keyFotoAdd(id,i)).catch(()=>{});
  idbDel(keyVideo(id)).catch(()=>{});
  idbDel(keyContrato(id)).catch(()=>{});
  DB.imoveis = DB.imoveis.filter(x=>x.id!==id);
  save();
  toast('Imóvel excluído.');
  goTab('imoveis');
}
function abrirCompartilhar(id){

  const texto = montarTextoImovel(im);
  showSheet('Compartilhar imóvel', `

    <textarea rows="7" readonly style="font-size:12.5px">${esc(texto)}</textarea>`,
    `<button class="btn gray" onclick="closeSheet()">Fechar</button>
     <button class="btn green" onclick="window.open('https://wa.me/?text=${encodeURIComponent(texto)}','_blank')">WhatsApp</button>
     <button class="btn" onclick="window.open('mailto:?subject=${encodeURIComponent('Imóvel disponível: '+im.localizacao.endereco)}&body=${encodeURIComponent(texto)}','_blank')">E-mail</button>`);
}
function montarTextoImovel(im){
  const c = im.caracteristicas, l = im.localizacao, g = im.garagem;
  const cor = DB.corretor || {};
  const exc = im.exclusividade || {};
  let txt = `🏡 Casa à venda\n${l.endereco}, ${l.numero} — ${l.cidade}/${l.estado}\n\n`+
    `Terreno: ${c.terreno||'-'} m² · Construção: ${c.construcao||'-'} m²\n`+
    `Tipo: ${c.tipoCasa} · Condição: ${c.condicao}\n`+
    `Garagem: ${g.vagas||0} vaga(s) ${g.coberta?'coberta':'descoberta'}\n`+
    `Condomínio: ${(im.condominio?.valor||0)>0?fmtBRL(im.condominio.valor):'sem condomínio'}`;
  if(exc.exclusiva) txt += `\nVenda exclusiva${(exc.dataInicial||exc.dataFinal)?` (${fmtDataBR(exc.dataInicial)} a ${fmtDataBR(exc.dataFinal)})`:''}`;
  if(cor.nome || cor.creci) txt += `\n\n${cor.nome||''}${cor.creci?` — ${cor.creci}`:''}`;
  return txt;
}

// ── Config ──
// ══════════════ MÓDULO AGENDA ══════════════
let agSelDate = null; // 'YYYY-MM-DD' selecionado na tira de dias
let agBuscaQ = '';    // busca da agenda
let agVerSemana = false; // visão semana (hoje..+7) na agenda
function isoDate(d){ return d.toISOString().slice(0,10); }
function ehFimDeSemana(iso){ if(!iso) return false; const d=new Date(iso+'T00:00:00'); const g=d.getDay(); return g===0||g===6; }
function ehHoje(iso){ return iso===isoDate(new Date()); }
// estilo de destaque para relatórios: fim de semana (amarelo claro) e hoje (linhas grossas)
function estiloLinhaData(iso){
  let s='';
  if(ehFimDeSemana(iso)) s+='background:#FFF7CC;';           // amarelo claro
  if(ehHoje(iso)) s+='border-top:3px solid var(--primary);border-bottom:3px solid var(--primary);';
  return s;
}
function renderAgenda(){
  if(!agSelDate) agSelDate = isoDate(new Date());
  const dias=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  let strip='';
  for(let i=0;i<14;i++){
    const d=new Date(hoje); d.setDate(hoje.getDate()+i);
    const iso=isoDate(d);
    const has = DB.agendamentos.some(a=>a.data===iso);
    strip += `<div class="day ${iso===agSelDate?'active':''} ${has?'has':''}" onclick="agSelDate='${iso}';renderAgenda()">
      <div class="dw">${dias[d.getDay()]}</div><div class="dn">${d.getDate()}</div><div class="dd"></div></div>`;
  }
  let doDia = DB.agendamentos.filter(a=>a.data===agSelDate).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
  // lista da semana: de hoje até +7 dias, ordem crescente por data e hora
  const semIni = isoDate(hoje); const semFimD = new Date(hoje); semFimD.setDate(semFimD.getDate()+7); const semFim = isoDate(semFimD);
  const semanaLista = DB.agendamentos.filter(a=> (a.data||'')>=semIni && (a.data||'')<=semFim)
    .sort((a,b)=> (a.data||'').localeCompare(b.data||'') || (a.hora||'').localeCompare(b.hora||''));
  const q = (agBuscaQ||'').trim().toLowerCase();
  let resultadosBusca = null;
  if(q){
    // busca em TODOS os agendamentos por comprador, código do imóvel ou endereço
    resultadosBusca = DB.agendamentos.filter(a=>{
      const im = DB.imoveis.find(x=>x.id===a.imovelId);
      const alvo = [a.compradorNome, a.imovelCodigo, im?.codigo, im?.localizacao?.endereco, im?.localizacao?.cidade]
        .map(s=>(s||'').toLowerCase()).join(' ');
      return alvo.includes(q);
    }).sort((a,b)=>(a.data||'').localeCompare(b.data||'')||(a.hora||'').localeCompare(b.hora||''));
  }
  document.getElementById('mainContent').innerHTML = `
    <div class="ag-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input style="border:none;outline:none;flex:1;background:none;font-size:13.5px;color:var(--text)" placeholder="Buscar visita, cliente ou imóvel" value="${esc(agBuscaQ)}" oninput="agBuscaQ=this.value;renderAgenda()">
      ${q?`<div class="go" style="background:var(--danger)" onclick="agBuscaQ='';renderAgenda()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></div>`:`<div class="go"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M7 12h10M10 18h4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></div>`}
    </div>
    ${resultadosBusca!==null ? `
      <div class="srow"><span class="t">Resultados da busca</span><span class="a">${resultadosBusca.length} visita(s)</span></div>
      ${resultadosBusca.length===0?`<div class="empty"><div class="big">🔍</div>Nenhuma visita encontrada.</div>`:resultadosBusca.map(a=>agCardHTML(a,true)).join('')}
    ` : `
    <div class="weekstrip">${strip}</div>
    <div class="pills">
      <div class="pill" style="background:var(--primary);border-color:var(--primary);color:#fff" onclick="novaVisita()">＋ Visita</div>
    </div>
    <div class="quick">
      <div class="q" onclick="agVerSemana=false;agSelDate='${isoDate(hoje)}';renderAgenda()"><div class="c"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M4 9h16M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div><div class="l">Hoje</div></div>
      <div class="q" onclick="agVerSemana=true;renderAgenda()"><div class="c" ${agVerSemana?'style="background:var(--primary);color:#fff"':''}><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="10" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 6.5V10l2.2 1.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div><div class="l">Semana</div></div>
      <div class="q" onclick="goTab('imoveis')"><div class="c"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.4" stroke="currentColor" stroke-width="1.6"/></svg></div><div class="l">Imóveis</div></div>
    </div>
    ${agVerSemana ? `
      <div class="srow"><span class="t">Próximos 7 dias</span><span class="a">${semanaLista.length} visita(s)</span></div>
      ${semanaLista.length===0?`<div class="empty"><div class="big">🗓️</div>Nenhuma visita de hoje até +7 dias.</div>`:semanaLista.map(a=>agCardHTML(a,true)).join('')}
    ` : `
      <div class="srow"><span class="t">${fmtDataBR(agSelDate)}</span><span class="a">${doDia.length} visita(s)</span></div>
      ${doDia.length===0 ? `<div class="empty"><div class="big">🗓️</div>Nada agendado para este dia.<br><button class="btn" style="margin-top:16px;max-width:220px" onclick="novaVisita()">＋ Nova visita</button></div>` :
        doDia.map(a=>agCardHTML(a)).join('')}
    `}
    `}`;
  const paraThumbs = resultadosBusca!==null ? resultadosBusca : (agVerSemana ? semanaLista : doDia);
  paraThumbs.forEach(a=>{
    const im = DB.imoveis.find(x=>x.id===a.imovelId);
    if(im && im.fotosPublicas?.some(Boolean)){
      const i = im.fotosPublicas.findIndex(Boolean);
      idbGet(keyFotoPub(im.id,i)).then(d=>{ if(d){ const el=document.getElementById('agthumb_'+a.id); if(el) el.innerHTML=`<img src="${d}" style="width:100%;height:100%;object-fit:cover">`; } }).catch(()=>{});
    }
  });
}
function agCardHTML(a, mostrarData){
  const im = DB.imoveis.find(x=>x.id===a.imovelId);
  const endereco = im ? `${im.localizacao.endereco||''}, ${im.localizacao.numero||''} — ${im.localizacao.cidade||''}/${im.localizacao.estado||''}` : 'Imóvel removido';
  const enderecoFull = im ? `${im.localizacao.endereco||''}, ${im.localizacao.numero||''} ${im.localizacao.cidade||''} ${im.localizacao.estado||''} ${im.localizacao.cep||''}`.trim() : '';
  const totalDesp = ['transporte','refeicao','gasolina','outros'].reduce((s,k)=>s+parseMoeda(a.despesas?.[k]||''),0);
  const tel = (a.compradorTel1||'').replace(/\D/g,'');
  return `<div class="appt">

      <div class="act gps" onclick="abrirRota('${esc(enderecoFull).replace(/'/g,"\\'")}')">🧭 Rota</div>

// cor do termômetro: 0 = branco → 10 = verde escuro
function avaliacaoCor(n){
  const t = Math.max(0,Math.min(10,n))/10;
  const r = Math.round(255+(11-255)*t), g = Math.round(255+(107-255)*t), b = Math.round(255+(58-255)*t);
  return `rgb(${r},${g},${b})`;
}
function abrirAvaliacao(id){
  const a = DB.agendamentos.find(x=>x.id===id); if(!a) return;
  const atual = a.avaliacao||0;
  let cells = '';
  for(let n=0;n<=10;n++){
    cells += `<div onclick="setAvaliacao('${id}',${n})" style="flex:1;min-width:0;height:44px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;cursor:pointer;background:${avaliacaoCor(n)};color:${n>=6?'#fff':'#191A2C'};border:${n===atual?'3px solid var(--primary)':'1px solid var(--border)'};border-radius:8px">${n}</div>`;
  }
  showSheet('🌡️ Avaliação do interesse', `
    <div style="font-size:13px;color:var(--muted);margin-bottom:10px">Do 0 (nenhum interesse) ao 10 (muito interessado). A cor vai do branco ao verde escuro.</div>
    <div style="display:flex;gap:4px;flex-wrap:wrap">${cells}</div>`,
    `<button class="btn gray" onclick="closeSheet()">Fechar</button>`);
}
function setAvaliacao(id, n){
  const a = DB.agendamentos.find(x=>x.id===id); if(!a) return;
  a.avaliacao = n; save(); closeSheet(); toast('Avaliação: '+n+'/10'); renderAgenda();
}
function excluirAgendamento(id){
  confirmar({icon:'🗑️', title:'Cancelar esta visita?', msg:'A visita será removida da agenda. As despesas já lançadas no financeiro serão mantidas.',
    noLabel:'Voltar', yesLabel:'Cancelar visita', yes:`doExcluirAgendamento('${id}')`});
}
function doExcluirAgendamento(id){
  DB.agendamentos = DB.agendamentos.filter(a=>a.id!==id);
  save(); toast('Compromisso excluído.'); renderAgenda();
}

// ── Formulário de Visita ──
let V = null;
function novaVisita(){
  if(DB.imoveis.length===0){ toast('Cadastre um imóvel antes de agendar uma visita.'); return; }
  V = { id:uid(), tipo:'visita', imovelId:'', data: agSelDate||isoDate(new Date()), hora:'09:00',
        compradorNome:'', compradorTel1:'', compradorTel2:'',
        despesas:{ transporte:'', refeicao:'', gasolina:'', outros:'' }, createdAt:Date.now() };
  V._novo = true;
  renderVisitaForm();
}
function editarAgendamento(id){
  const a = DB.agendamentos.find(x=>x.id===id);
  if(!a){ toast('Compromisso não encontrado.'); return; }
  V = JSON.parse(JSON.stringify(a));
  V.despesas = Object.assign({ transporte:'', refeicao:'', gasolina:'', outros:'' }, V.despesas||{});
  // compat: se a visita não tiver terreno/construída, busca do imóvel
  if(V.terreno===undefined || V.construida===undefined){
    const im = DB.imoveis.find(x=>x.id===V.imovelId);
    V.terreno = im ? (im.caracteristicas.terreno||'') : '';
    V.construida = im ? (im.caracteristicas.construcao||'') : '';
  }

function selecionarImovelVisita(id){
  V.imovelId = id;

  V.terreno = im ? (im.caracteristicas.terreno||'') : '';
  V.construida = im ? (im.caracteristicas.construcao||'') : '';
  V.imovelCodigo = im ? (im.codigo||'').toUpperCase() : '';
  renderVisitaForm();
}

    <div class="field"><label>Telefone 2</label><input inputmode="numeric" placeholder="(99)99999.9999" value="${esc(V.compradorTel2)}" oninput="V.compradorTel2=maskTelefone(this)"></div>

      <div class="field"><label>Refeição</label><input inputmode="numeric" placeholder="99.999,99" value="${esc(V.despesas.refeicao)}" oninput="V.despesas.refeicao=maskMoeda(this)"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Gasolina</label><input inputmode="numeric" placeholder="99.999,99" value="${esc(V.despesas.gasolina)}" oninput="V.despesas.gasolina=maskMoeda(this)"></div>
      <div class="field"><label>Outros</label><input inputmode="numeric" placeholder="99.999,99" value="${esc(V.despesas.outros)}" oninput="V.despesas.outros=maskMoeda(this)"></div>
