// ═══ RESUMO DE PROPOSTAS ═══════════════════════════════════════════════════
// Lista os imóveis por data de inclusão dentro de um período e fecha com os
// totais: quantos registros, quantas propostas e a diferença entre o que foi
// negociado e o que foi pedido.
let resIni = '', resFim = '', resModo = 'registro';   // 'registro' | 'proposta'
function abrirResumoPropostas(modo){
  resModo = modo || 'registro';
  const hoje = todayISO();
  if(!resIni){
    // começa no primeiro dia do mês corrente e vai até hoje
    resIni = hoje.slice(0,8)+'01';
    resFim = hoje;
  }
  if(resFim < resIni) resFim = resIni;
  renderResumoPropostas();
  window.scrollTo(0,0);
}
function setResIni(v){ if(!v) return; resIni=v; if(resFim<resIni) resFim=resIni; renderResumoPropostas(); }
function setResFim(v){
  if(!v) return;
  if(v < resIni){ toast('A data final não pode ser anterior à data inicial.'); renderResumoPropostas(); return; }
  resFim=v; renderResumoPropostas();
}
// Data de inclusão do imóvel em ISO (aceita o campo gravado ou o createdAt)
function dataInclusaoISO(im){
  if(im.dataInclusao) return im.dataInclusao;
  if(im.createdAt) return isoDate(new Date(im.createdAt));
  return '';
}
function renderResumoPropostas(){
  document.getElementById('mainNav').classList.remove('hidden');
  document.getElementById('appHeader').innerHTML = `<h2>Resumo de propostas</h2>`;

  const porProposta = resModo === 'proposta';
  // "Por registro" filtra pela data de inclusão; "Por proposta", pela data da proposta.
  const lista = DB.imoveis
    .map(im=>({ im, d: porProposta ? (im.valores?.dataProposta||'') : dataInclusaoISO(im) }))
    .filter(x=>x.d && x.d>=resIni && x.d<=resFim)
    .sort((a,b)=> a.d.localeCompare(b.d));

  let somaSol = 0, somaNeg = 0, nPropostas = 0, somaRec = 0, somaDesp = 0;
  let linhas = '';
  lista.forEach(({im,d})=>{
    const sol = parseFloat(im.valores?.solicitado)||0;
    const neg = parseFloat(im.valores?.negociado)||0;
    const dp  = im.valores?.dataProposta || '';
    somaSol += sol; somaNeg += neg;
    if(dp) nPropostas++;
    // receitas e despesas lançadas para ESTE imóvel dentro do período escolhido
    const rec = DB.financeiro.receitas.filter(e=>e.imovelId===im.id && (e.data||'')>=resIni && (e.data||'')<=resFim)
                  .reduce((t,e)=>t+(e.valor||0),0);
    const des = DB.financeiro.despesas.filter(e=>e.imovelId===im.id && (e.data||'')>=resIni && (e.data||'')<=resFim)
                  .reduce((t,e)=>t+(e.valor||0),0);
    somaRec += rec; somaDesp += des;
    const sal = rec - des;
    linhas += `<div class="card" style="margin-bottom:8px;padding:12px 14px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px">
        <b class="mono" style="color:var(--primary);font-size:13px">${esc((im.codigo||'').toUpperCase())}</b>
        <span style="font-size:11.5px;color:var(--muted)">${porProposta?'Proposta em':'Incluído em'} ${fmtDataBR(d)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0">
        <span style="color:var(--muted)">Valor solicitado</span><b>${fmtBRL(sol)}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0">
        <span style="color:var(--muted)">Data da proposta</span><b>${dp?fmtDataBR(dp):'—'}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0">
        <span style="color:var(--muted)">Valor negociado</span><b style="color:${neg>0?'var(--success)':'var(--muted)'}">${fmtBRL(neg)}</b></div>
      <div style="border-top:1px solid var(--border);margin-top:6px;padding-top:6px">
        <div style="display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0">
          <span style="color:var(--muted)">Receitas do imóvel</span><b style="color:var(--success)">${fmtBRL(rec)}</b></div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0">
          <span style="color:var(--muted)">Despesas do imóvel</span><b style="color:var(--danger)">${fmtBRL(des)}</b></div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;padding:2px 0">
          <span style="color:var(--muted)">Saldo</span><b style="color:${sal>=0?'var(--success)':'var(--danger)'}">${fmtBRL(sal)}</b></div>
      </div>
    </div>`;
  });

  const dif = somaNeg - somaSol;
  const corDif = dif > 0 ? 'var(--success)' : 'var(--danger)';

  // Cabeçalho colorido: azul por registro, verde médio por proposta.
  const cabBg = porProposta ? '#16A34A' : 'var(--primary)';
  const cabTit = porProposta ? 'POR DATA DA PROPOSTA' : 'POR DATA REGISTRO DO IMÓVEL';
  const cabSub = porProposta ? 'Imóveis cuja proposta foi feita no período' : 'Imóveis incluídos no período';

  const saldoFin = somaRec - somaDesp;

  document.getElementById('mainContent').innerHTML = `
    <div class="btnrow" style="margin-bottom:12px">
      <button class="btn gray" onclick="goTab('imoveis')">Voltar</button>
      <button class="btn" onclick="goTab('inicio')">Voltar ao Início</button>
    </div>

    <div style="background:${cabBg};color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px">
      <div style="font-size:14px;font-weight:900;letter-spacing:.4px">${cabTit}</div>
      <div style="font-size:11.5px;opacity:.85;margin-top:3px">${cabSub}</div>
    </div>

    <div class="card" style="margin-bottom:12px">
      <div class="row2">
        <div class="field" style="margin:0"><label>Data inicial</label><input type="date" value="${resIni}" onchange="setResIni(this.value)"></div>
        <div class="field" style="margin:0"><label>Data final</label><input type="date" value="${resFim}" min="${resIni}" onchange="setResFim(this.value)"></div>
      </div>
    </div>

    <div class="card" style="background:var(--pblue);border:1.5px solid var(--primary);margin-bottom:14px">
      <div style="font-size:13px;font-weight:800;margin-bottom:10px">Resumo do período</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)">
        <span>Total de visitas</span><b>${lista.length}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)">
        <span>Total de propostas</span><b>${nPropostas}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)">
        <span>Valores solicitados</span><b>${fmtBRL(somaSol)}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)">
        <span>Valores negociados</span><b>${fmtBRL(somaNeg)}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:14.5px;padding:9px 0;border-bottom:1px solid var(--border)">
        <b>Diferença</b><b style="color:${corDif}">${fmtBRL(dif)}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:7px 0 5px;border-bottom:1px solid var(--border)">
        <span>Receitas do período</span><b style="color:var(--success)">${fmtBRL(somaRec)}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border)">
        <span>Despesas do período</span><b style="color:var(--danger)">${fmtBRL(somaDesp)}</b></div>
      <div style="display:flex;justify-content:space-between;font-size:14.5px;padding:9px 0 2px">
        <b>Saldo (receitas − despesas)</b><b style="color:${saldoFin>=0?'var(--success)':'var(--danger)'}">${fmtBRL(saldoFin)}</b></div>
      <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5">Diferença = negociado menos solicitado (verde acima do pedido, vermelho igual ou abaixo). Receitas e despesas são as dos imóveis listados, dentro do período.</div>
    </div>

    ${lista.length ? linhas : `<div class="empty"><div class="big">${ic('chart',40)}</div>${porProposta?'Nenhuma proposta neste período.':'Nenhum imóvel incluído neste período.'}</div>`}
    <div style="height:150px"></div>`;
}

function preencherListaImoveis(){
  let items = DB.imoveis.slice().sort((a,b)=>b.updatedAt-a.updatedAt);
  const q = imoBuscaQ.trim().toLowerCase();
  if(q){
    if(imoBuscaModo==='cep'){ const qd=q.replace(/\D/g,''); items = items.filter(im=>(im.localizacao.cep||'').replace(/\D/g,'').includes(qd)); }
    else if(imoBuscaModo==='cidade'){ items = items.filter(im=>(im.localizacao.cidade||'').toLowerCase().includes(q)); }
    else { items = items.filter(im=>(im.proprietario?.nome||'').toLowerCase().includes(q)); }
  }
  const cont = document.getElementById('imoListContainer');
  if(!cont) return;
  cont.innerHTML = items.length===0
    ? (DB.imoveis.length===0
        ? `<div class="empty"><div class="big">🏡</div>Nenhum imóvel cadastrado ainda.<br><button class="btn" style="margin-top:16px;max-width:220px" onclick="abrirTipos()">+ Cadastrar imóvel</button></div>`
        : `<div class="empty"><div class="big">${ic('search',40)}</div>Nenhum imóvel encontrado.</div>`)
    : items.map(im=>`
      <button class="ptile" onclick="abrirDetalhe('${im.id}')">
        <div class="ptile-icon" id="thumb_${im.id}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 11.5L12 4l8 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div style="min-width:0"><div class="ptile-title">${esc(im.localizacao.endereco||'Sem endereço')}, ${esc(im.localizacao.numero||'')}</div>
        <div class="ptile-sub"><span class="mono" style="color:var(--primary);font-weight:700">${(im.codigo||'').toUpperCase()}</span> · ${esc(im.localizacao.cidade||'')}${im.localizacao.estado?' / '+esc(im.localizacao.estado):''}${im.proprietario?.nome?' · '+esc(im.proprietario.nome):''}</div></div>
        <div class="ptile-chev">›</div>

function abrirExtratoImovel(id){
  const im = DB.imoveis.find(x=>x.id===id); if(!im) return;
  document.getElementById('mainNav').classList.remove('hidden');
  const ini = im.dataInclusao || isoDate(new Date(im.createdAt||Date.now()));
  document.getElementById('appHeader').innerHTML = `<h2>Extrato do imóvel</h2><div class="mono" style="color:var(--primary);font-weight:700;font-size:12px;margin-top:2px">${(im.codigo||'').toUpperCase()} · desde ${fmtDataBR(ini)}</div>`;

  // lançamentos deste imóvel a partir da data de inclusão
  const recs = DB.financeiro.receitas.filter(e=>e.imovelId===id && (e.data||'')>=ini).map(e=>({...e,_t:'rec'}));
  const desps = DB.financeiro.despesas.filter(e=>e.imovelId===id && (e.data||'')>=ini).map(e=>({...e,_t:'desp'}));
  const todos = [...recs, ...desps].sort((a,b)=> (a.data||'').localeCompare(b.data||'') || (a.createdAt||0)-(b.createdAt||0));

  const totRec = recs.reduce((s,e)=>s+(e.valor||0),0);
  const totDesp = desps.reduce((s,e)=>s+(e.valor||0),0);
  const saldoFinal = totRec - totDesp;

  let h = `<div class="card" style="margin-bottom:12px">
    <div style="display:flex;gap:8px;text-align:center">
      <div style="flex:1"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Receitas</div><b style="color:var(--success);font-size:15px">${fmtBRL(totRec)}</b></div>

      <div style="flex:1"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Saldo</div><b style="color:${saldoFinal>=0?'var(--success)':'var(--danger)'};font-size:15px">${fmtBRL(saldoFinal)}</b></div>
    </div></div>`;

  if(!todos.length){
    h += `<div class="empty"><div class="big">${ic('chart',40)}</div>Nenhum lançamento vinculado a este imóvel<br><span style="font-size:12px">Lançamentos de visitas na agenda entram aqui automaticamente. Em Receitas/Despesas do Financeiro você pode vincular um imóvel.</span></div>`;
    document.getElementById('mainContent').innerHTML = h;
    return;
  }

  // tabela por data com saldo acumulado
  let acc = 0;
  let linhas = '';
  todos.forEach(e=>{
    const rec = e._t==='rec';
    acc += rec ? (e.valor||0) : -(e.valor||0);
    linhas += `<div style="display:flex;align-items:center;padding:9px 10px;border-bottom:1px solid var(--border);gap:8px">
      <div style="width:64px;flex-shrink:0;font-size:11px;font-weight:600" class="mono">${fmtDataBR(e.data)}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12.5px;font-weight:700">${esc(e.categoria||(rec?'Receita':'Despesa'))}</div>
        ${rec&&e.fontePagadora?`<div style="font-size:10.5px;color:var(--muted)">Fonte: ${esc(e.fontePagadora)}</div>`:''}
        ${e.descricao?`<div style="font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.descricao)}</div>`:''}
      </div>
      <div style="text-align:right;white-space:nowrap">
        <div style="font-size:12.5px;font-weight:700;color:${rec?'var(--success)':'var(--danger)'}">${rec?'+':'-'} ${fmtBRL(e.valor)}</div>
        <div style="font-size:10.5px;color:${acc>=0?'var(--success)':'var(--danger)'}">saldo ${fmtBRL(acc)}</div>
      </div></div>`;
  });
  h += `<div class="card" style="padding:0;overflow:hidden">
    <div style="display:flex;align-items:center;padding:9px 10px;background:var(--pblue);font-size:9.5px;font-weight:800;text-transform:uppercase;color:var(--dark)">
      <div style="width:64px;flex-shrink:0">Data</div><div style="flex:1">Lançamento</div><div style="text-align:right">Valor / Saldo</div></div>
    ${linhas}
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px;background:var(--pblue);font-size:12.5px;font-weight:800">
      <span>Saldo final</span><b style="color:${saldoFinal>=0?'var(--success)':'var(--danger)'}">${fmtBRL(saldoFinal)}</b></div>
  </div>
  <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5">Lançamentos em ordem de data desde a inclusão do imóvel (${fmtDataBR(ini)}). Receitas em verde, despesas em vermelho; o saldo acumula lançamento a lançamento.</div>
  <button class="btn gray" style="margin-top:12px" onclick="abrirDetalhe('${im.id}')">${ic('back',16)} Voltar ao imóvel</button>`;
  document.getElementById('mainContent').innerHTML = h;
}
async function doExcluir(id){
  if(bloqueioTrial('excluir o imóvel')) return;
  for(let i=0;i<6;i++) idbDel(keyFotoPub(id,i)).catch(()=>{});
  for(let i=0;i<3;i++) idbDel(keyFotoAdd(id,i)).catch(()=>{});
  idbDel(keyVideo(id)).catch(()=>{});
  idbDel(keyContrato(id)).catch(()=>{});
  ['iptu','registro','cnd','testamento'].forEach(t=>idbDel(keyCertidao(id,t)).catch(()=>{}));
  DB.imoveis = DB.imoveis.filter(x=>x.id!==id);
  save();
  toast('Imóvel excluído.');
  goTab('imoveis');
}
let _shareData = null;
async function dataURLtoFile(dataURL, filename){
  const res = await fetch(dataURL); const blob = await res.blob();
  return new File([blob], filename, { type: blob.type || 'application/octet-stream' });
}
async function abrirCompartilhar(id){
  const im = DB.imoveis.find(x=>x.id===id); if(!im) return;
  const texto = montarTextoImovel(im);
  const nFotos = (im.fotosPublicas||[]).filter(Boolean).length;
  const temVideo = !!(im.video && im.video.compartilhar);
  const videoExisteNaoCompart = !!(im.video && !im.video.compartilhar);
  const temCarteira = !!(DB.corretor && DB.corretor.temCreci);
  _shareData = { texto, files: [], creciFile: null, incluirCreci: false, pronto:false };
  showSheet('Compartilhar imóvel', `
    <div style="font-size:13px;color:var(--muted);margin-bottom:10px">
      Serão compartilhados: <b>${nFotos} foto(s)</b>${temVideo?' + <b>vídeo</b>':''} + a descrição.
      ${videoExisteNaoCompart?'<br><span style="font-size:11.5px">O vídeo existe, mas está marcado para <b>não</b> compartilhar (etapa Vídeo do cadastro).</span>':''}
      ${(nFotos||temVideo)?'':'<br><span style="font-size:11.5px">Sem fotos/vídeo marcados — será compartilhado só o texto.</span>'}
    </div>
    ${temCarteira?`<div class="toggle-row" style="margin-bottom:10px">
      <div class="lbl">Incluir a carteira CRECI<span class="d">Envia junto a foto da carteira cadastrada em Dados do corretor</span></div>
      <div class="switch" id="swCreci" onclick="alternarCreciShare(this)"></div>
    </div>`:`<div style="font-size:11.5px;color:var(--muted);margin-bottom:10px">Sem foto da carteira CRECI cadastrada em <b>Ajustes › Dados do corretor</b> — nada a anexar.</div>`}
    <textarea rows="6" readonly style="font-size:12.5px">${esc(texto)}</textarea>`,
    `<button class="btn green" onclick="window.open('https://wa.me/?text=${encodeURIComponent(texto)}','_blank')">${ic('chat',16)} WhatsApp</button>
     <button class="btn" onclick="window.open('mailto:?subject=Im%C3%B3vel%20dispon%C3%ADvel&body=${encodeURIComponent(texto)}','_blank')">✉️ E-mail</button>
     ${(nFotos||temVideo||temCarteira)?`<button class="btn gray" onclick="fazerCompartilhamento()">${ic('share',16)} Com fotos${(nFotos||temVideo)?(temVideo?' + vídeo':''):''} (mais apps)</button>`:''}
     <button class="btn gray" onclick="closeSheet()">Fechar</button>`);
  // Pré-carrega as mídias (para o compartilhamento nativo funcionar no iPhone, sem quebrar o gesto do usuário)
  try{
    const cod = (im.codigo||im.id||'imovel');
    const files = [];
    for(let i=0;i<6;i++){
      if(im.fotosPublicas && im.fotosPublicas[i]){
        try{ const du = await idbGet(keyFotoPub(id,i)); if(du) files.push(await dataURLtoFile(du, cod+'_'+(i+1)+'.jpg')); }catch(e){}
      }
    }
    if(temVideo){
      try{ const dv = await idbGet(keyVideo(id)); if(dv) files.push(await dataURLtoFile(dv, cod+'_video.mp4')); }catch(e){}
    }
    if(temCarteira){
      try{ const dc = await idbGet(keyCorretorCreci()); if(dc && _shareData) _shareData.creciFile = await dataURLtoFile(dc, 'carteira_creci.jpg'); }catch(e){}
    }
    if(_shareData) { _shareData.files = files; _shareData.pronto = true; }
  }catch(e){ if(_shareData) _shareData.pronto = true; }
}
// Liga/desliga o anexo da carteira CRECI na folha de compartilhamento.
function alternarCreciShare(el){
  if(!_shareData) return;
  _shareData.incluirCreci = !_shareData.incluirCreci;
  el.classList.toggle('on', _shareData.incluirCreci);
}
async function fazerCompartilhamento(){
  const d = _shareData; if(!d){ closeSheet(); return; }
  const files = (d.files || []).slice();
  if(d.incluirCreci && d.creciFile) files.push(d.creciFile);
  // 1) compartilhamento nativo COM arquivos (chamado de forma síncrona p/ preservar o gesto no iPhone)
  if(files.length && navigator.canShare){
    let ok = false; try{ ok = navigator.canShare({ files }); }catch(e){ ok = false; }
    if(ok){
      try{ await navigator.share({ files, text: d.texto }); closeSheet(); return; }
      catch(e){ if(e && e.name==='AbortError'){ return; } }
    }
  }
  // 2) sem suporte a arquivos → compartilhamento nativo só com texto
  if(navigator.share){
    try{ await navigator.share({ text: d.texto }); closeSheet(); return; }
    catch(e){ if(e && e.name==='AbortError'){ return; } }
  }
  // 3) último recurso → WhatsApp por texto
  window.open('https://wa.me/?text='+encodeURIComponent(d.texto),'_blank');
}
function montarTextoImovel(im){
  const c = im.caracteristicas, l = im.localizacao, g = im.garagem;
  const cor = DB.corretor || {};
  const exc = im.exclusividade || {};
  let txt = `🏡 ${tipoLabel(im.tipo)} à venda\n${l.endereco}, ${l.numero} — ${l.cidade}/${l.estado}\n\n`;
  if(im.tipo==='terreno'){
    const lo = im.loteamento||{};
    txt += `Terreno: ${c.terreno||'-'} m²\n`;
    const med = medidasLoteTxt(c); if(med) txt += `Medidas: ${med}\n`;
    if(lo.condominio) txt += `${lo.condominio}\n`;
    if(lo.acesso) txt += `Acesso: ${lo.acesso}\n`;
    if(lo.ruas) txt += `Ruas internas: ${lo.ruas}\n`;
    txt += `Condomínio: ${(im.condominio?.valor||0)>0?fmtBRL(im.condominio.valor):'sem condomínio'}`;
  } else {
    txt += `Terreno: ${c.terreno||'-'} m² · Construção: ${c.construcao||'-'} m²\n`;
    if(im.tipo==='chacara'){ const medc = medidasLoteTxt(c); if(medc) txt += `Medidas: ${medc}\n`; }
    txt += `Tipo: ${c.tipoCasa} · Condição: ${c.condicao}\n`+
      `Garagem: ${g.vagas||0} vaga(s) ${g.coberta?'coberta':'descoberta'}${im.tipo==='apartamento'&&g.portariaVigia?' · Portaria c/ vigia':''}\n`+
      `Condomínio: ${(im.condominio?.valor||0)>0?fmtBRL(im.condominio.valor):'sem condomínio'}`;
  }
  if(exc.exclusiva) txt += `\nVenda exclusiva${(exc.dataInicial||exc.dataFinal)?` (${fmtDataBR(exc.dataInicial)} a ${fmtDataBR(exc.dataFinal)})`:''}`;
  if(cor.nome || cor.creci || cor.email){
    txt += `\n\n————————\n`;
    if(cor.nome) txt += `${cor.nome}\n`;
    if(cor.creci) txt += `CRECI Nº: ${cor.creci}\n`;
    if(cor.validadeCreci) txt += `VALIDADE: ${fmtDataBR(cor.validadeCreci)}\n`;
    if(cor.email) txt += `E-mail: ${cor.email}\n`;
    txt = txt.replace(/\n$/,'');
  }
  return txt;
}

let agCalMonth = new Date(); // mês exibido na grade do calendário — navega livremente p/ passado e futuro
function isoDate(d){ return d.toISOString().slice(0,10); }
function ehFimDeSemana(iso){ if(!iso) return false; const d=new Date(iso+'T00:00:00'); const g=d.getDay(); return g===0||g===6; }
function ehHoje(iso){ return iso===isoDate(new Date()); }

function estiloLinhaData(iso){
  let s='';
  if(ehFimDeSemana(iso)) s+='background:#FFF7CC;';           // amarelo claro
  if(ehHoje(iso)) s+='border-top:3px solid var(--primary);border-bottom:3px solid var(--primary);';
  return s;
}

    <div style="font-size:12px;color:var(--muted);margin-top:8px">Digite ou escolha qualquer mês — vigente, futuro ou passado — para visualizar, agendar ou conferir compromissos.</div>`,
    `<button class="btn gray" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="irParaMes()">Ir para o mês</button>`);
}
function irParaMes(){
  const v = val('agMesInput');
  if(!v){ toast('Escolha um mês.'); return; }
  const [y,m] = v.split('-').map(Number);
  agCalMonth = new Date(y, m-1, 1);
  agSelDate = null;
  agVerSemana = false;
  closeSheet();
  renderAgenda();
}
function agCalGridHTML(){
  const y = agCalMonth.getFullYear(), m = agCalMonth.getMonth();
  const first = new Date(y,m,1).getDay();
  const diasNoMes = new Date(y,m+1,0).getDate();
  const hojeIso = isoDate(new Date());
  const dow = ['D','S','T','Q','Q','S','S'];
  let grid = dow.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<first;i++) grid += '<div></div>';
  for(let d=1; d<=diasNoMes; d++){
    const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = iso===hojeIso, isSel = iso===agSelDate;
    const has = DB.agendamentos.some(a=>a.data===iso);
    grid += `<button type="button" class="cal-day ${isToday?'today':''} ${isSel?'sel':''}" onclick="agSelDate='${iso}';agVerSemana=false;renderAgenda()">${d}<div class="dots">${has?'<i></i>':''}</div></button>`;
  }
  return `<div class="cal-card">
    <div class="cal-head">
      <button type="button" class="nav" onclick="agCalShift(-1)" aria-label="Mês anterior">‹</button>
      <div class="lbl" onclick="abrirSeletorMes()">${MESES[m]} ${y} <span style="font-size:10px;opacity:.6">▾</span></div>
      <button type="button" class="nav" onclick="agCalShift(1)" aria-label="Próximo mês">›</button>
    </div>
    <div class="cal-grid">${grid}</div>
  </div>`;
}
function renderAgenda(){
  if(!agSelDate) agSelDate = isoDate(new Date());
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  let doDia = DB.agendamentos.filter(a=>a.data===agSelDate).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
  // lista da semana: de hoje até +7 dias, ordem crescente por data e hora
  const semIni = isoDate(hoje); const semFimD = new Date(hoje); semFimD.setDate(semFimD.getDate()+7); const semFim = isoDate(semFimD);
  const semanaLista = DB.agendamentos.filter(a=> (a.data||'')>=semIni && (a.data||'')<=semFim)

  let resultadosBusca = null;

      const im = DB.imoveis.find(x=>x.id===a.imovelId);

    <div class="ag-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input style="border:none;outline:none;flex:1;background:none;font-size:13.5px;color:var(--text)" placeholder="Buscar visita, cliente ou imóvel" value="${esc(agBuscaQ)}" oninput="agBuscaQ=this.value;renderAgenda()">
      ${q?`<div class="go" style="background:var(--danger)" onclick="agBuscaQ='';renderAgenda()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></div>`:`<div class="go"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M7 12h10M10 18h4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></div>`}
    </div>
    ${resultadosBusca!==null ? `
      <div class="srow"><span class="t">Resultados da busca</span><span class="a">${resultadosBusca.length} visita(s)</span></div>
      ${resultadosBusca.length===0?`<div class="empty"><div class="big">${ic('search',40)}</div>Nenhuma visita encontrada.</div>`:resultadosBusca.map(a=>agCardHTML(a,true)).join('')}
    ` : `
    ${agCalGridHTML()}
    <div class="pills">
      <div class="pill" style="background:var(--primary);border-color:var(--primary);color:#fff" onclick="novaVisita()">＋ Visita</div>
    </div>
    <div class="quick">
      <div class="q" onclick="agVerSemana=false;agCalMonth=new Date();agSelDate='${isoDate(hoje)}';renderAgenda()"><div class="c"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M4 9h16M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div><div class="l">Hoje</div></div>
      <div class="q" onclick="agVerSemana=true;renderAgenda()"><div class="c" ${agVerSemana?'style="background:var(--primary);color:#fff"':''}><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="10" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 6.5V10l2.2 1.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div><div class="l">Semana</div></div>
      <div class="q" onclick="goTab('imoveis')"><div class="c"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.4" stroke="currentColor" stroke-width="1.6"/></svg></div><div class="l">Imóveis</div></div>
    </div>

      <div class="srow"><span class="t">Próximos 7 dias</span><span class="a">${semanaLista.length} visita(s)</span></div>
      ${semanaLista.length===0?`<div class="empty"><div class="big">${ic('calendar',40)}</div>Nenhuma visita de hoje até +7 dias.</div>`:semanaLista.map(a=>agCardHTML(a,true)).join('')}
    ` : `
      <div class="srow"><span class="t">${fmtDataBR(agSelDate)}</span><span class="a">${doDia.length} visita(s)</span></div>
      ${doDia.length===0 ? `<div class="empty"><div class="big">${ic('calendar',40)}</div>Nada agendado para este dia.<br><button class="btn" style="margin-top:16px;max-width:220px" onclick="novaVisita()">＋ Nova visita</button></div>` :
        doDia.map(a=>agCardHTML(a)).join('')}

    `}
    <button class="btn gray" style="margin:18px 0 24px" onclick="goTab('inicio')">Voltar ao Início</button>`;

      idbGet(keyFotoPub(im.id,i)).then(d=>{ if(d){ const el=document.getElementById('agthumb_'+a.id); if(el) el.innerHTML=`<img src="${d}" style="width:100%;height:100%;object-fit:cover">`; } }).catch(()=>{});

function agCardHTML(a, mostrarData){

        <div style="font-weight:800;font-size:14.5px;margin-top:6px">${esc(a.compradorNome||'Sem nome')}</div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:3px">${ic('pin',13)} ${esc(endereco)}</div>
        ${totalDesp>0?`<div style="font-size:11.5px;color:var(--muted);margin-top:2px">${ic('money',13)} Despesas: ${fmtBRL(totalDesp)}</div>`:''}
      </div>
    </div>
    <div class="acts">
      <div class="act wa" ${tel.length>=10?`onclick="window.open('https://wa.me/55${tel}','_blank')"`:`onclick="toast('Telefone do comprador não cadastrado.')" style="opacity:.5"`}>${ic('chat',15)} WhatsApp</div>
      <div class="act gps" onclick="abrirRota('${esc(enderecoFull).replace(/'/g,"\\'")}')">${ic('nav',15)} Rota</div>
      <div class="act" style="background:#E7F1FF;border-color:#CFE0FF;color:#2563EB" onclick="editarAgendamento('${a.id}')">${ic('edit',15)} Editar</div>
      <div class="act" style="background:var(--danger);border-color:var(--danger);color:#fff" onclick="excluirAgendamento('${a.id}')">${ic('trash',15)} Cancelar</div>
    </div>
    <div class="act" style="margin-top:8px;background:${avaliacaoCor(a.avaliacao||0)};color:${(a.avaliacao||0)>=6?'#fff':'var(--text)'};border-color:var(--border);font-weight:800" onclick="abrirAvaliacao('${a.id}')">${ic('thermo',15)} Avaliação do interesse: ${a.avaliacao||0}/10 — toque para ajustar</div>
  </div>`;
}
// cor do termômetro: 0 = branco → 10 = verde escuro
function avaliacaoCor(n){
  const t = Math.max(0,Math.min(10,n))/10;
  const r = Math.round(255+(11-255)*t), g = Math.round(255+(107-255)*t), b = Math.round(255+(58-255)*t);
  return `rgb(${r},${g},${b})`;
}
function abrirAvaliacao(id){
  if(bloqueioTrial('mudar a avaliação')) return;
  const a = DB.agendamentos.find(x=>x.id===id); if(!a) return;
  const atual = a.avaliacao||0;
  let cells = '';
  for(let n=0;n<=10;n++){
    cells += `<div onclick="setAvaliacao('${id}',${n})" style="flex:1;min-width:0;height:44px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;cursor:pointer;background:${avaliacaoCor(n)};color:${n>=6?'#fff':'#191A2C'};border:${n===atual?'3px solid var(--primary)':'1px solid var(--border)'};border-radius:8px">${n}</div>`;
  }
  showSheet('🌡️ Avaliação do interesse', `
    <div style="font-size:13px;color:var(--muted);margin-bottom:10px">Do 0 (nenhum interesse) ao 10 (muito interessado). A cor vai do branco ao verde escuro.</div>
    <div style="display:flex;gap:4px;flex-wrap:wrap">${cells}</div>`,
    `<button class="btn gray" onclick="closeSheet()">Fechar</button>`);
}
function setAvaliacao(id, n){
  if(bloqueioTrial('mudar a avaliação')) return;
  const a = DB.agendamentos.find(x=>x.id===id); if(!a) return;
  a.avaliacao = n; save(); closeSheet(); toast('Avaliação: '+n+'/10'); renderAgenda();
}
function excluirAgendamento(id){
  if(bloqueioTrial('cancelar a visita')) return;
  confirmar({icon:'🗑️', title:'Cancelar esta visita?', msg:'A visita será removida da agenda. As despesas já lançadas no financeiro serão mantidas.',
    noLabel:'Voltar', yesLabel:'Cancelar visita', yes:`doExcluirAgendamento('${id}')`});
}
function doExcluirAgendamento(id){
  if(bloqueioTrial('cancelar a visita')) return;
  DB.agendamentos = DB.agendamentos.filter(a=>a.id!==id);
  save(); toast('Compromisso excluído.'); renderAgenda();
}

// ── Outros gastos da visita (5 valores + 5 descrições de até 15 caracteres) ──
// Compatível com as visitas antigas, que tinham um único campo "outros".
function outrosArr(){
  if(!V.despesas.outrosLista){
    const antigo = V.despesas.outros || '';
    V.despesas.outrosLista = [0,1,2,3,4].map(i=>({ valor: i===0?antigo:'', desc: i===0&&antigo?'Outros':'' }));
    V.despesas.outros = '';   // o valor migrou para a lista — não pode contar duas vezes
  }
  return V.despesas.outrosLista;
}
function outroVal(i){ return outrosArr()[i]?.valor || ''; }
function outroDesc(i){ return outrosArr()[i]?.desc || ''; }
function setOutroVal(i, v){ outrosArr()[i].valor = v; }
function setOutroDesc(i, v){ outrosArr()[i].desc = (v||'').slice(0,15); }

// ── Formulário de Visita ──
let V = null;
function novaVisita(){
  if(bloqueioTrial('agendar uma visita')) return;
  if(DB.imoveis.length===0){ toast('Cadastre um imóvel antes de agendar uma visita.'); return; }
  V = { id:uid(), tipo:'visita', imovelId:'', data: agSelDate||isoDate(new Date()), hora:'09:00',
        compradorNome:'', compradorTel1:'', compradorTel2:'',
        despesas:{ transporte:'', refeicao:'', gasolina:'', outros:'',
                   outrosLista:[0,1,2,3,4].map(()=>({valor:'',desc:''})) }, createdAt:Date.now() };
  V._novo = true;
  renderVisitaForm();
}
function editarAgendamento(id){
  if(bloqueioTrial('editar a visita')) return;
  const a = DB.agendamentos.find(x=>x.id===id);
  if(!a){ toast('Compromisso não encontrado.'); return; }
  V = JSON.parse(JSON.stringify(a));
  V.despesas = Object.assign({ transporte:'', refeicao:'', gasolina:'', outros:'' }, V.despesas||{});
  // compat: se a visita não tiver terreno/construída, busca do imóvel
  if(V.terreno===undefined || V.construida===undefined){
    const im = DB.imoveis.find(x=>x.id===V.imovelId);
    V.terreno = im ? (im.caracteristicas.terreno||'') : '';
    V.construida = im ? (im.caracteristicas.construcao||'') : '';
  }
  V._novo = false;
  renderVisitaForm();
}
function selecionarImovelVisita(id){
  V.imovelId = id;
  const im = DB.imoveis.find(x=>x.id===id);
  // traz do cadastro e grava no agendamento
  V.terreno = im ? (im.caracteristicas.terreno||'') : '';
  V.construida = im ? (im.caracteristicas.construcao||'') : '';
  V.medidas = im ? medidasLoteTxt(im.caracteristicas) : '';
  V.imovelCodigo = im ? (im.codigo||'').toUpperCase() : '';
  renderVisitaForm();
}
// Uma medida do lote do imóvel escolhido, já formatada ("10,5 m") — vazia vira "—".
function medLote(im, campo){
  const v = im && im.caracteristicas ? im.caracteristicas[campo] : '';
  if(v===''||v===null||v===undefined||!(parseFloat(v)>0)) return '—';
  return String(v).replace('.',',')+' m';
}

    <div class="row2">

      <div class="field"><label>Telefone 2</label><input inputmode="numeric" placeholder="(99)99999.9999" value="${esc(V.compradorTel2)}" oninput="V.compradorTel2=maskTelefone(this)"></div>
    </div>

    <div class="row2">

function salvarVisita(){
  if(bloqueioTrial('salvar a visita')) return;
  if(!V.imovelId){ toast('Escolha o imóvel da visita.'); return; }
  if(!V.compradorNome.trim()){ toast('Informe o nome do comprador.'); return; }
  V.updatedAt = Date.now();
  const novo = V._novo;
  const dados = JSON.parse(JSON.stringify(V));
  delete dados._novo;

  // grava/atualiza o compromisso
  const idx = DB.agendamentos.findIndex(a=>a.id===V.id);
  if(idx>=0) DB.agendamentos[idx] = dados; else DB.agendamentos.push(dados);

  // re-sincroniza as despesas ligadas a este compromisso (remove as antigas e relança)
  DB.financeiro.despesas = DB.financeiro.despesas.filter(d=>d.agendamentoId!==V.id);
  const im = DB.imoveis.find(x=>x.id===V.imovelId);
  const reg = (im?.codigo||'').toUpperCase();  // ex.: CS00001
  const cats = { transporte:'Transporte', refeicao:'Refeição', gasolina:'Gasolina' };
  Object.keys(cats).forEach(k=>{
    const valor = parseMoeda(V.despesas[k]||'');
    if(valor>0){
      DB.financeiro.despesas.push({
        id: uid(), categoria: cats[k], valor, data: V.data,
        origem:'agenda', agendamentoId: V.id, imovelId: V.imovelId, imovelCodigo: reg,
        descricao: `Visita ${reg} — ${V.compradorNome}`.trim(), createdAt: Date.now()
      });
    }
  });
  // os 5 campos de "Outros": cada um vira uma despesa própria, levando a descrição digitada
  (V.despesas.outrosLista||[]).forEach(o=>{
    const valor = parseMoeda(o.valor||'');
    if(valor>0){
      const nome = (o.desc||'').trim();
      DB.financeiro.despesas.push({
        id: uid(), categoria:'Outros', valor, data: V.data,
        origem:'agenda', agendamentoId: V.id, imovelId: V.imovelId, imovelCodigo: reg,
        descricao: `Visita ${reg} — ${V.compradorNome}${nome?' — '+nome:''}`.trim(), createdAt: Date.now()
      });
    }
  });
  save();
  toast(novo?'Visita agendada e despesas lançadas.':'Visita regravada e despesas atualizadas.');
  V = null;
  goTab('agenda');
}

// ── Relatório de fluxo diário (Receitas / Despesas / Saldo acumulado) ──
let fluxoIni = '', fluxoFim = '', fluxoDiaSel = '';
function fluxoPeriodo(qual){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  if(qual==='semana'){
    fluxoIni = isoDate(hoje);
    const fim = new Date(hoje); fim.setDate(fim.getDate()+7);   // hoje até +7 dias
    fluxoFim = isoDate(fim);
    finExpView = 'semana';
  } else if(qual==='mes'){
    fluxoIni = isoDate(new Date(hoje.getFullYear(), hoje.getMonth(), 1));
    fluxoFim = isoDate(new Date(hoje.getFullYear(), hoje.getMonth()+1, 0));
    finExpView = 'fluxo';
  } else if(qual==='hoje'){
    fluxoIni = isoDate(hoje); fluxoFim = isoDate(hoje);
    finExpView = 'fluxo';
  }
  renderFinanceiro();
}
function ehHoje(iso){ return iso===isoDate(new Date()); }
function estiloLinhaData(iso){
  const d = new Date(iso+'T00:00:00'); const dow = d.getDay();
  let s = '';
  if(dow===0||dow===6) s += ';background:#FFF7CC';                 // fim de semana amarelo claro
  if(ehHoje(iso)) s += ';border-top:3px solid var(--dark);border-bottom:3px solid var(--dark);font-weight:800';
  return s;
}
let realIni = '', realFim = '';

      <div style="flex:1;border-left:1px solid var(--border);border-right:1px solid var(--border)"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Despesas</div><b style="color:var(--danger);font-size:15px">${fmtBRL(totDesp)}</b></div>

// A data final nunca fica antes da inicial: ao mover a inicial para frente,
// a final acompanha; e uma final anterior é recusada com aviso.
function setFluxoIni(v){
  if(!v) return;
  fluxoIni = v;
  if(fluxoFim < fluxoIni) fluxoFim = fluxoIni;
  fluxoDiaSel=''; finExpView='fluxo'; renderFinanceiro();
}
function setFluxoFim(v){
  if(!v) return;
  if(v < fluxoIni){ toast('A data final não pode ser anterior à data inicial.'); renderFinanceiro(); return; }
  fluxoFim = v;
  fluxoDiaSel=''; finExpView='fluxo'; renderFinanceiro();
}
function fluxoDiarioHTML(modoSemana){
  const todas = [...DB.financeiro.receitas, ...DB.financeiro.despesas].map(e=>e.data).filter(Boolean).sort();
  const hojeIso = isoDate(new Date());
  if(modoSemana){
    const hoje=new Date(); hoje.setHours(0,0,0,0);
    fluxoIni = isoDate(hoje);
    const fim=new Date(hoje); fim.setDate(fim.getDate()+7); fluxoFim = isoDate(fim);
  } else {
    // Padrão: começa em ontem (hoje − 1 dia) e vai até hoje. O corretor pode
    // trocar as duas datas à vontade — a final é que nunca pode ficar antes da inicial.
    if(!fluxoIni) fluxoIni = addDays(hojeIso,-1);
    if(!fluxoFim) fluxoFim = hojeIso;
    if(fluxoFim < fluxoIni) fluxoFim = fluxoIni;
  }
  // despesas com "data realizada" preenchida NÃO entram nos relatórios
  const despAtivas = DB.financeiro.despesas.filter(e=>!e.dataRealizada);
  // saldo anterior (antes da data inicial)
  const recAtivas = DB.financeiro.receitas.filter(e=>!e.dataRealizada);
  const saldoAnt = recAtivas.filter(e=>(e.data||'')<fluxoIni).reduce((s,e)=>s+(e.valor||0),0)
                 - despAtivas.filter(e=>(e.data||'')<fluxoIni).reduce((s,e)=>s+(e.valor||0),0);

  let h = `<div class="card" style="margin-bottom:10px">
    ${modoSemana?`<div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:8px">🗓️ Semana — de hoje até +7 dias</div>`:`
    <div style="display:flex;gap:8px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px">
      ${fchip(false,'🗓️ Este mês',"fluxoPeriodo('mes')")}
      ${fchip(false,'📆 Hoje',"fluxoPeriodo('hoje')")}
    </div>`}
    <div class="row2">
      <div class="field" style="margin:0"><label>Data inicial</label><input type="date" value="${fluxoIni}" onchange="setFluxoIni(this.value)"></div>
      <div class="field" style="margin:0"><label>Data final</label><input type="date" value="${fluxoFim}" min="${fluxoIni}" onchange="setFluxoFim(this.value)"></div>
    </div>
  </div>`;

  // itera dia a dia
  const di = new Date(fluxoIni+'T00:00:00'), df = new Date(fluxoFim+'T00:00:00');
  if(isNaN(di)||isNaN(df)||di>df){ return h + `<div class="empty"><div class="big">${ic('chart',40)}</div>Selecione um período válido.</div>`; }

  let acc = saldoAnt;
  let totR=0, totD=0;
  let linhas = '';
  for(let d=new Date(di); d<=df; d.setDate(d.getDate()+1)){
    const iso = isoDate(d);
    const r = recAtivas.filter(e=>e.data===iso).reduce((s,e)=>s+(e.valor||0),0);
    const p = despAtivas.filter(e=>e.data===iso).reduce((s,e)=>s+(e.valor||0),0);
    acc += r - p; totR+=r; totD+=p;
    const temMov = (r>0||p>0);
    linhas += `<div ${temMov?`onclick="abrirDiaFluxo('${iso}')" style="cursor:pointer;`:'style="opacity:.5;'}display:flex;align-items:center;padding:9px 10px;border-bottom:1px solid var(--border);${estiloLinhaData(iso)}">
      <div style="width:74px;flex-shrink:0;font-size:11.5px;font-weight:${ehHoje(iso)?'800':'600'}" class="mono">${fmtDataBR(iso)}</div>
      <div style="flex:1;text-align:right;color:var(--success);font-size:12px;font-weight:700">${r>0?fmtBRL(r):'—'}</div>
      <div style="flex:1;text-align:right;color:var(--danger);font-size:12px;font-weight:700">${p>0?fmtBRL(p):'—'}</div>
      <div style="flex:1;text-align:right;color:${acc>=0?'var(--success)':'var(--danger)'};font-size:12px;font-weight:800">${fmtBRL(acc)}</div>
    </div>`;
  }
  const saldoFinal = acc;
  h += `<div class="card" style="padding:0;overflow:hidden">
    <div style="display:flex;align-items:center;padding:9px 10px;background:var(--pblue);font-size:9.5px;font-weight:800;text-transform:uppercase;color:var(--dark)">
      <div style="width:74px;flex-shrink:0">Data</div>
      <div style="flex:1;text-align:right">Receitas</div>
      <div style="flex:1;text-align:right">Despesas</div>
      <div style="flex:1;text-align:right">Saldo</div>
    </div>
    <div style="display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--bg);font-size:11px">
      <div style="width:74px;flex-shrink:0;color:var(--muted);font-weight:600">Saldo ant.</div>
      <div style="flex:1"></div><div style="flex:1"></div>
      <div style="flex:1;text-align:right;font-weight:800;color:${saldoAnt>=0?'var(--success)':'var(--danger)'}">${fmtBRL(saldoAnt)}</div>
    </div>
    ${linhas}
    <div style="display:flex;align-items:center;padding:10px;background:var(--pblue);font-size:12px;font-weight:800">
      <div style="width:74px;flex-shrink:0">TOTAL</div>
      <div style="flex:1;text-align:right;color:var(--success)">${fmtBRL(totR)}</div>
      <div style="flex:1;text-align:right;color:var(--danger)">${fmtBRL(totD)}</div>
      <div style="flex:1;text-align:right;color:${saldoFinal>=0?'var(--success)':'var(--danger)'}">${fmtBRL(saldoFinal)}</div>
    </div>
  </div>
  <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5">O saldo é acumulado: cada dia soma as receitas e subtrai as despesas do saldo do dia anterior, até a data final. Verde = positivo, vermelho = negativo. <b>Toque num dia com movimento para ver os lançamentos daquele dia.</b></div>`;
  return h;
}

// ── Detalhe de um dia do fluxo diário ──
// Mostra todos os lançamentos em aberto da data escolhida, com as mesmas cores
// da lista do Financeiro (receita em verde com "+", despesa em vermelho com "-").
function abrirDiaFluxo(iso){ fluxoDiaSel = iso; renderFinanceiro(); window.scrollTo(0,0); }
function fecharDiaFluxo(){ fluxoDiaSel = ''; renderFinanceiro(); window.scrollTo(0,0); }
function diaFluxoHTML(iso){
  const recs  = DB.financeiro.receitas.filter(e=>!e.dataRealizada && e.data===iso);
  const desps = DB.financeiro.despesas.filter(e=>!e.dataRealizada && e.data===iso);
  const totRec  = recs.reduce((s,e)=>s+(e.valor||0),0);
  const totDesp = desps.reduce((s,e)=>s+(e.valor||0),0);
  const saldo = totRec - totDesp;

  let h = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
    <b style="flex:1;font-size:15px">${ic('calendar',16)} Lançamentos de ${fmtDataBR(iso)}</b></div>
  <div class="card" style="margin-bottom:12px">
    <div style="display:flex;gap:8px;text-align:center">
      <div style="flex:1"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Receitas</div><b style="color:var(--success);font-size:15px">${fmtBRL(totRec)}</b></div>
      <div style="flex:1;border-left:1px solid var(--border);border-right:1px solid var(--border)"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Despesas</div><b style="color:var(--danger);font-size:15px">${fmtBRL(totDesp)}</b></div>
      <div style="flex:1"><div style="font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase">Saldo do dia</div><b style="color:${saldo>=0?'var(--success)':'var(--danger)'};font-size:15px">${fmtBRL(saldo)}</b></div>
    </div>
  </div>`;

  const lista = [
    ...recs.map(e=>({...e, _tipo:'rec'})),
    ...desps.map(e=>({...e, _tipo:'desp'}))
  ];
  if(!lista.length){
    h += `<div class="empty"><div class="big">${ic('receipt',40)}</div>Nenhum lançamento em aberto nesta data</div>`;
  } else {
    lista.forEach(e=>{
      const rec = e._tipo==='rec';
      h += `<div class="card" style="display:flex;align-items:center;gap:10px;cursor:pointer" onclick="${rec?`editarReceita('${e.id}')`:`editarDespesa('${e.id}')`}">
        <div class="ptile-icon" style="width:38px;height:38px;flex-shrink:0;background:${rec?'var(--pgreen)':'var(--pblue)'}">${rec?'💚':iconeCat(e.categoria)}</div>
        <div style="flex:1;min-width:0">
          <b style="font-size:14px">${esc(e.categoria||(rec?'Receita':'Outros'))}</b>
          <div style="font-size:10px;font-weight:800;color:${rec?'var(--success)':'var(--danger)'};text-transform:uppercase;margin-top:2px">${rec?'A receber':'A pagar'}</div>
          ${rec&&e.fontePagadora?`<div style="font-size:11px;color:var(--muted);margin-top:2px">Fonte pagadora: <b style="color:var(--text);font-weight:700">${esc(e.fontePagadora)}</b></div>`:''}
          ${e.descricao?`<div style="font-size:11px;color:var(--muted);margin-top:2px;white-space:pre-wrap">${ic('doc',12)} ${esc(e.descricao)}</div>`:''}
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${e.origem==='agenda'?'agenda · ':''}toque para editar</div></div>
        <b style="color:${rec?'var(--success)':'var(--danger)'};white-space:nowrap">${rec?'+':'-'} ${fmtBRL(e.valor)}</b>
        <button style="background:none;color:var(--muted)" onclick="event.stopPropagation();${rec?`excluirReceita('${e.id}')`:`excluirDespesa('${e.id}')`}">${ic('trash',15)}</button></div>`;
    });
  }

  h += `<div style="font-size:11px;color:var(--muted);margin:10px 2px 14px;line-height:1.5">Só aparecem os lançamentos <b>em aberto</b> (sem "Data realizada" preenchida) — os mesmos que somam no fluxo diário.</div>
  <button class="btn gray" onclick="fecharDiaFluxo()" style="margin-bottom:20px">Voltar</button>`;
  return h;
}

function atualizarAposLancamento(){
  if(currentTab==='inicio') renderInicio(); else renderFinanceiro();
}
function calcAreaLote(){
  var f=parseFloat(String(W.medFrente||'').replace(',','.'))||0;
  var fu=parseFloat(String(W.medFundos||'').replace(',','.'))||0;
  var e=parseFloat(String(W.medEsquerdo||'').replace(',','.'))||0;
  var d=parseFloat(String(W.medDireito||'').replace(',','.'))||0;
  if(f>0 && e>0){
    var mediaF=(f+(fu>0?fu:f))/2, mediaL=(e+(d>0?d:e))/2;
    W.terreno=String(Math.round(mediaF*mediaL));
    var el=document.getElementById('areaTotalInput'); if(el) el.value=W.terreno;
  }
}
function syncMinReal(dataId, realId){ var d=document.getElementById(dataId), r=document.getElementById(realId); if(d&&r){ r.min=d.value||''; if(r.value && d.value && r.value < d.value){ r.value=''; } } }
function syncDatasExcl(){ var i=document.getElementById('exclIni'), f=document.getElementById('exclFim'); if(i&&f){ f.min=i.value||''; i.max=f.value||''; if(i.value && f.value && f.value < i.value){ f.value=''; W.dataFinal=''; toast('A data final não pode ser anterior à data inicial.'); } } }
function novaDespesaManual(){
  if(bloqueioTrial('lançar uma despesa')) return;
  showSheet('🧾 Nova despesa', despForm(null),
    `<button class="btn gray" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="salvarDespesaManual('')">Salvar</button>`);
}
function editarDespesa(id){
  if(bloqueioTrial('editar a despesa')) return;
  const ex = DB.financeiro.despesas.find(d=>d.id===id); if(!ex) return;
  showSheet('✏️ Editar despesa', despForm(ex),
    `<button class="btn gray" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="salvarDespesaManual('${id}')">Salvar</button>`);
}
function salvarDespesaManual(editId){
  if(bloqueioTrial('salvar a despesa')) return;
  const valor = parseMoeda(document.getElementById('ndVal').value);
  if(valor<=0){ toast('Informe um valor.'); return; }
  let categoria = document.getElementById('ndCat').value;
  if(categoria==='__nova__'){
    categoria = (document.getElementById('ndCatNova').value||'').trim();
    if(!categoria){ toast('Digite a nova categoria.'); return; }
  }
  if(!categoria){ toast('Selecione ou digite uma categoria.'); return; }
  const imovelId = document.getElementById('ndImovel')?.value || '';
  const imovelCodigo = imovelId ? (DB.imoveis.find(im=>im.id===imovelId)?.codigo||'').toUpperCase() : '';
  const dados = { categoria, valor,
    data:document.getElementById('ndData').value||isoDate(new Date()),
    dataRealizada:document.getElementById('ndDataReal')?.value||'',
    imovelId, imovelCodigo,
    descricao:document.getElementById('ndDesc').value||'' };
  if(dados.dataRealizada && dados.dataRealizada < dados.data){ toast('A data realizada não pode ser anterior à data.'); return; }
  const commit = ()=>{
    if(editId){ const ex = DB.financeiro.despesas.find(d=>d.id===editId); if(ex) Object.assign(ex, dados); }
    else { DB.financeiro.despesas.push({ id:uid(), origem:'manual', createdAt:Date.now(), ...dados }); }
    save(); closeSheet(); toast(editId?'✏️ Despesa regravada!':'🧾 Despesa registrada!'); atualizarAposLancamento();
  };
  if(editId){ _pendingCommit = commit; confirmar({icon:'✏️', title:'Regravar o lançamento?', msg:`Confirmar as alterações da despesa de <b>${fmtBRL(valor)}</b>?`, noLabel:'Voltar', yesLabel:'Regravar', yes:'_runPendingCommit()'}); }
  else { commit(); }
}
let _pendingCommit = null;
function _runPendingCommit(){ const f=_pendingCommit; _pendingCommit=null; if(f) f(); }
function excluirDespesa(id){
  if(bloqueioTrial('excluir a despesa')) return;
  const e = DB.financeiro.despesas.find(d=>d.id===id);
  confirmar({icon:'🧾', title:'Excluir despesa?', msg:`Deseja excluir a despesa de <b>${fmtBRL(e?.valor)}</b>${e?.categoria?` (${esc(e.categoria)})`:''}?`,
    noLabel:'Cancelar', yesLabel:'Excluir', yes:`doExcluirDespesa('${id}')`});
}
function doExcluirDespesa(id){
  if(bloqueioTrial('excluir a despesa')) return;
  DB.financeiro.despesas = DB.financeiro.despesas.filter(d=>d.id!==id);
  save(); toast('🗑️ Despesa excluída'); atualizarAposLancamento();
}

      <div style="font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:10px">
        Seus dados ficam só neste aparelho. Faça o becape para não perder nada ao trocar de celular ou limpar o app.
        ${(function(){ const d=diasDesdeBackup(); if(d==null) return '<br><b style="color:var(--danger)">Você ainda não fez nenhum becape.</b>'; return d>=7?`<br><b style="color:var(--danger)">Último becape há ${d} dia(s) — recomendo exportar de novo.</b>`:`<br>Último becape há ${d} dia(s).`; })()}
      </div>
      <button class="btn" onclick="exportarBackup()">${ic('save',16)} Exportar backup</button>
      <button class="btn gray" style="margin-top:8px" onclick="var i=document.getElementById('impBackup'); if(i) i.click();">${ic('doc',16)} Importar backup</button>
      <input type="file" id="impBackup" accept="application/json,.json" style="display:none" onchange="importarBackup(this)">
    </div>
    <div class="stitle">Segurança</div>
    <div class="card" style="font-size:12.5px;color:var(--muted);line-height:1.6">
      🔒 O acesso por senha está <b>desativado</b> nesta versão e será adicionado numa fase futura. Por enquanto os dados ficam salvos apenas neste aparelho, sem senha.
    </div>
    <div class="stitle">Dados</div>
    <button class="ptile" onclick="confirmarReset()"><div class="ptile-icon">🗑️</div><div><div class="ptile-title">Apagar todos os dados</div><div class="ptile-sub">Remove imóveis e fotos deste aparelho</div></div></button>
    <div class="stitle">Sobre</div>
    <div class="card" style="font-size:12.5px;color:var(--muted);line-height:1.6">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <b style="color:var(--text)">Cor Sync Imóveis</b>
        <span class="mono" style="color:var(--primary);font-weight:700;background:var(--pblue);padding:3px 10px;border-radius:100px">v${APP_VERSION}</span>
      </div>
      Dados salvos localmente neste aparelho.<br>
      Módulo ativo: <b>Vender › Casa, Apartamento, Chácara e Terreno</b>. O login por senha entra em fase futura.
    </div>`;
  if(c.temFoto) idbGet(keyCorretorFoto()).then(d=>{ if(d){ const el=document.getElementById('cfgCorThumb'); if(el){ el.style.overflow='hidden'; el.innerHTML=`<img src="${d}" style="width:100%;height:100%;object-fit:cover">`; } } }).catch(()=>{});
  stopProCountdownTicker();
  if(isProReal()) startProCountdownTicker();
}
// Mantém a contagem de dias do Pro sempre atualizada em Ajustes, sem precisar sair e voltar da tela.
let _proCountdownTimer = null;
function startProCountdownTicker(){
  stopProCountdownTicker();
  _proCountdownTimer = setInterval(()=>{
    if(currentTab!=='config'){ stopProCountdownTicker(); return; }
    const num = document.getElementById('proCountdownNum');
    if(!num){ stopProCountdownTicker(); return; }
    const d = diasRestantesPro();
    if(d==null){ renderConfig(); return; }
    num.textContent = d;
    const lbl = document.getElementById('proCountdownLbl');
    if(lbl) lbl.textContent = 'dia'+(d===1?'':'s')+' restante'+(d===1?'':'s');
  }, 30000);
}
function stopProCountdownTicker(){ if(_proCountdownTimer){ clearInterval(_proCountdownTimer); _proCountdownTimer=null; } }
// ── Aba: Dados do corretor (dentro de Ajustes) ──
function renderDadosCorretor(){
  const c = DB.corretor || {nome:'',creci:'',validadeCreci:''};
  document.getElementById('mainNav').classList.remove('hidden');
  document.getElementById('appHeader').innerHTML = `<h2>Dados do corretor</h2>`;
  document.getElementById('mainContent').innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:center;margin:4px 0 12px">
        <div onclick="escolherOrigemCorFoto('foto')" style="width:96px;height:96px;border-radius:50%;overflow:hidden;background:var(--pblue);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--primary);cursor:pointer;position:relative">
          <div id="corFotoSlot"><svg width="34" height="34" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c1.2-3.8 4-5.6 7-5.6s5.8 1.8 7 5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>
          <div style="position:absolute;bottom:0;right:0;background:var(--primary);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid var(--surface)">📷</div>
        </div>
      </div>
      <div style="text-align:center;font-size:11px;color:var(--muted);margin-bottom:12px">Foto do corretor</div>
      <div class="field" style="margin-bottom:10px"><label>Nome do corretor</label><input id="corNome" value="${esc(c.nome)}" placeholder="Seu nome"></div>
      <div class="field" style="margin-bottom:12px"><label>CRECI</label><input id="corCreci" value="${esc(c.creci)}" placeholder="Ex.: CRECI-SP 123456-F"></div>

      <label>Carteira CRECI (foto)</label>
      <div onclick="escolherOrigemCorFoto('creci')" id="corCreciSlot" style="width:70%;max-width:260px;margin:0 auto;aspect-ratio:3/4;border-radius:14px;border:1.5px dashed var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--primary);cursor:pointer;overflow:hidden">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="10" r="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M13 9h5M13 12h5M6 16h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span style="font-size:11px;color:var(--muted);font-weight:600">Tirar foto ou escolher da galeria</span>
      </div>
      <div id="corCreciGirar" style="display:${c.temCreci?'block':'none'};margin:8px auto 12px;max-width:260px">
        <button class="btn gray sm" onclick="girarCarteiraCreci()">↻ Girar a foto 90°</button>
        <div class="hint" style="text-align:center">Use até a carteira ficar em pé, com a foto do lado esquerdo.</div>
      </div>

      <div class="field" style="margin-bottom:12px"><label>Validade da carteira CRECI</label>
        <input id="corValidade" type="date" min="${todayISO()}" value="${esc(c.validadeCreci)}" oninput="atualizarAvisoValidadeCreci()" onchange="atualizarAvisoValidadeCreci()">
        <div id="corValidadeAviso">${avisoValidadeCreciHTML(c.validadeCreci)}</div></div>

      <div class="field" style="margin-bottom:12px"><label>E-mail</label>
        <input id="corEmail" type="email" maxlength="35" value="${esc(c.email||'')}" placeholder="seuemail@exemplo.com">
        <div class="hint">Até 35 caracteres. Aparece no compartilhamento do imóvel.</div></div>

      <input type="file" id="corFotoCam" accept="image/*" capture="user" class="filein" onchange="onCorFoto('foto',this)">
      <input type="file" id="corFotoGal" accept="image/*" class="filein" onchange="onCorFoto('foto',this)">
      <input type="file" id="corCreciCam" accept="image/*" capture="environment" class="filein" onchange="onCorFoto('creci',this)">
      <input type="file" id="corCreciGal" accept="image/*" class="filein" onchange="onCorFoto('creci',this)">
    </div>
    <div style="height:150px"></div>
    <div class="wizfooter"><div class="btnrow">
      <button class="btn gray" onclick="goTab('config')">Voltar</button>
      <button class="btn green" onclick="salvarCorretor()">Salvar</button>
    </div></div>`;
  if(c.temFoto) idbGet(keyCorretorFoto()).then(d=>{ if(d){ const el=document.getElementById('corFotoSlot'); if(el) el.innerHTML=`<img src="${d}" style="width:96px;height:96px;object-fit:cover">`; } }).catch(()=>{});
  if(c.temCreci) idbGet(keyCorretorCreci()).then(d=>{ if(d){ const el=document.getElementById('corCreciSlot'); if(el){ el.style.border='1.5px solid var(--primary)'; el.style.background='#F1F4F9'; el.innerHTML=`<img src="${d}" style="width:100%;height:100%;object-fit:contain">`; } } }).catch(()=>{});
}
// Gira a foto da carteira 90° no sentido horário e regrava — serve para
// endireitar a imagem quando ela é tirada deitada.
async function girarCarteiraCreci(){
  try{
    const d = await idbGet(keyCorretorCreci());
    if(!d){ toast('Nenhuma foto da carteira para girar.'); return; }
    const img = new Image();
    await new Promise((ok,err)=>{ img.onload=ok; img.onerror=err; img.src=d; });
    const cv = document.createElement('canvas');
    cv.width = img.naturalHeight; cv.height = img.naturalWidth;   // troca largura/altura
    const cx = cv.getContext('2d');
    cx.translate(cv.width/2, cv.height/2);
    cx.rotate(Math.PI/2);
    cx.drawImage(img, -img.naturalWidth/2, -img.naturalHeight/2);
    await idbPut(keyCorretorCreci(), cv.toDataURL('image/jpeg', 0.9));
    renderDadosCorretor();
    toast('Foto girada.');
  }catch(e){ toast('Não foi possível girar a foto.'); }
}
function escolherOrigemCorFoto(kind){
  const titulo = kind==='foto' ? 'Foto do corretor' : 'Carteira CRECI';
  showSheet(titulo, `<div style="font-size:13px;color:var(--muted);margin-bottom:6px">Como você quer adicionar?</div>`,
    `<button class="btn gray" onclick="closeSheet()">Cancelar</button>
     <button class="btn gray" onclick="pegarArquivo('image/*',null,function(f){closeSheet();onCorFoto('${kind}',f);})">${ic('image',16)} Galeria</button>
     <button class="btn" onclick="capturarCorField();pegarArquivo('image/*','${kind==='foto'?'user':'environment'}',function(f){closeSheet();onCorFoto('${kind}',f);})">${ic('camera',16)} Câmera</button>`);
}
function capturarCorField(){ DB.corretor.nome = val('corNome')||DB.corretor.nome; DB.corretor.creci = val('corCreci')||DB.corretor.creci; if(document.getElementById('corValidade')) DB.corretor.validadeCreci = val('corValidade'); DB.corretor.email = (document.getElementById('corEmail')?document.getElementById('corEmail').value:DB.corretor.email)||''; }
async function storeCorFoto(kind, dataUrl){
  if(kind==='foto'){ await idbPut(keyCorretorFoto(), dataUrl); DB.corretor.temFoto=true; }
  else { await idbPut(keyCorretorCreci(), dataUrl); DB.corretor.temCreci=true; }
  save(); renderDadosCorretor();
}
async function onCorFoto(kind, input){
  const file = (input && input.files) ? input.files[0] : input; if(!file) return;
  capturarCorField();
  const reader = new FileReader();
  reader.onload = (ev)=>{ downscaleImage(ev.target.result, 1280, 0.82, function(d){ storeCorFoto(kind, d); }); };
  reader.readAsDataURL(file);
}
// Aviso abaixo do campo "Validade da carteira CRECI".
// Vazio → aviso vermelho de que não haverá lembrete. Data passada → não é aceita.
function avisoValidadeCreciHTML(v){
  if(!v) return `<div style="font-size:12px;color:var(--danger);font-weight:800;margin-top:6px;line-height:1.4">Não será avisado — sem a validade preenchida, o app não lembra você do vencimento da carteira CRECI.</div>`;
  if(v < todayISO()) return `<div style="font-size:12px;color:var(--danger);font-weight:800;margin-top:6px;line-height:1.4">Data já vencida. Informe a validade atual da carteira ou deixe o campo em branco.</div>`;
  return `<div class="hint">Avisaremos na tela inicial quando faltar 30, 15, 7 e 1 dia.</div>`;
}
function atualizarAvisoValidadeCreci(){
  const el = document.getElementById('corValidadeAviso');
  if(el) el.innerHTML = avisoValidadeCreciHTML(val('corValidade'));
}
function salvarCorretor(){
  const validade = val('corValidade');
  // O campo pode ficar vazio (o corretor só não recebe o aviso de vencimento).
  if(validade && validade < todayISO()){ toast('A validade do CRECI não pode ser anterior a hoje.'); return; }
  DB.corretor.nome = val('corNome');
  DB.corretor.creci = val('corCreci');
  DB.corretor.validadeCreci = validade;
  DB.corretor.email = (document.getElementById('corEmail')?document.getElementById('corEmail').value:DB.corretor.email)||'';
  save();
  toast('Dados do corretor salvos.');
  goTab('config');
}
function openChangePass(){
  showSheet('Alterar senha', `
    <label>Senha atual</label><div class="pwwrap"><input id="cpOld" type="password"><button type="button" class="eye" onclick="togglePw('cpOld',this)">👁</button></div>
    <label>Nova senha</label><div class="pwwrap"><input id="cpNew" type="password" maxlength="64" oninput="checkPwRules('cpNew','cpBtn')"><button type="button" class="eye" onclick="togglePw('cpNew',this)">👁</button></div>
    ${pwRulesHTML()}`,
    `<button class="btn gray" onclick="closeSheet()">Cancelar</button><button class="btn" id="cpBtn" disabled onclick="doChangePass()">Salvar</button>`);
}
async function doChangePass(){
  const auth = getAuth();
  const oldKey = await deriveKey(val('cpOld'), b64d(auth.salt));
  if(!(await verifyKey(oldKey, auth.check))){ toast('Senha atual incorreta'); return; }
  const novo = val('cpNew');
  if(!Object.values(validatePassword(novo)).every(Boolean)) return;
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(novo, salt);
  const check = await makeCheck(key);
  localStorage.setItem(LS_AUTH, JSON.stringify({salt:b64e(salt), check, createdAt:auth.createdAt}));
  _cryptoKey = key;
  await persistDB();
  closeSheet(); toast('Senha alterada com sucesso.');
}
function doLogout(){
  sessionStorage.removeItem('unlocked');
  _cryptoKey = null;
  location.reload();
}
function confirmarReset(){
  confirmar({icon:'⚠️', title:'Apagar tudo?', msg:'Todos os imóveis, fotos e a senha serão apagados permanentemente deste aparelho.',
    noLabel:'Cancelar', yesLabel:'Apagar tudo', yes:'doResetTudo()'});
}
async function doResetTudo(){
  localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_AUTH);
  sessionStorage.removeItem('unlocked');
  try{ indexedDB.deleteDatabase('corretorimoveis_midia'); }catch(e){}
  location.reload();
}

// ═══ Service Worker (offline básico) ═══
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
